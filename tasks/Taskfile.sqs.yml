version: '3'

vars:
  ROOT_DIR:
    sh: git rev-parse --show-toplevel
  NAMESPACE: '{{.NAMESPACE | default "test-mirrord"}}'
  MIRRORD_BIN: '{{.MIRRORD_BIN | default "mirrord"}}'

tasks:
  deploy:
    desc: "Deploy SQS LocalStack test environment"
    vars:
      CLUSTER_NAME: '{{.CLUSTER_NAME | default "bearkube"}}'
      CONTAINER_RUNTIME: '{{.CONTAINER_RUNTIME | default "docker"}}'
    cmds:
      - "{{.CONTAINER_RUNTIME}} build -t sqs-consumer:local {{.ROOT_DIR}}/apps/sqs-consumer"
      - minikube -p {{.CLUSTER_NAME}} image load sqs-consumer:local
      - kubectl apply -k {{.ROOT_DIR}}/k8s/overlays/sqs-localstack
      - task: _wait:localstack
      - task: _wait:consumer

  deploy:legacy:
    desc: "Deploy SQS env with the old MirrordWorkloadQueueRegistry only (no MirrordSplitConfig). Use this under a released operator that lacks the new CRD."
    cmds:
      - kubectl apply -k {{.ROOT_DIR}}/k8s/overlays/sqs-localstack-legacy
      - task: _wait:localstack
      - task: _wait:consumer

  deploy:aws:
    desc: "Deploy SQS AWS test environment"
    preconditions:
      - sh: test -n "${QUEUE_NAME}"
        msg: "QUEUE_NAME not set in .env"
      - sh: test -n "${AWS_REGION}"
        msg: "AWS_REGION not set in .env"
    cmds:
      - kubectl create namespace {{.NAMESPACE}} --dry-run=client -o yaml | kubectl apply -f -
      - kubectl kustomize {{.ROOT_DIR}}/k8s/overlays/sqs-aws | envsubst | kubectl apply -f -
      - task: _patch:operator:aws
      - task: _wait:consumer

  test:
    desc: "Full SQS LocalStack test (deploy + send message)"
    cmds:
      - task: deploy
      - task: send
      - echo "Check logs with 'task sqs:logs'"

  test:quick:
    desc: "Quick test - send message only (no deploy)"
    cmds:
      - task: send
      - echo "Check logs with 'task sqs:logs'"

  run:local:
    desc: "Run SQS consumer locally with mirrord (LocalStack)"
    dir: '{{.ROOT_DIR}}/apps/sqs-consumer'
    vars:
      MIRRORD_CONFIG: '{{.MIRRORD_CONFIG | default (print .ROOT_DIR "/k8s/overlays/sqs-localstack/mirrord.json")}}'
    cmds:
      - go build -o /tmp/sqs-consumer main.go
      - '{{.MIRRORD_BIN}} exec -f {{.MIRRORD_CONFIG}} -- /tmp/sqs-consumer'

  split:session:
    desc: "Start a local mirrord SQS-splitting session in the foreground (Ctrl-C to stop). Output streams to this console. Pinned to eu-north-1 so it matches the source queue, the consumer deployment env, and the operator (operator-values.yaml AWS_REGION) - the operator creates the split queue in its own region, so everything must agree. Set MIRRORD_BIN to override the CLI."
    dir: '{{.ROOT_DIR}}'
    vars:
      MIRRORD_CONFIG: '{{.MIRRORD_CONFIG | default (print .ROOT_DIR "/k8s/overlays/sqs-localstack/mirrord.json")}}'
      REGION: '{{.REGION | default "eu-north-1"}}'
    cmds:
      - (cd apps/sqs-consumer && go build -o /tmp/sqs-consumer main.go)
      - kubectl exec -n localstack deploy/localstack -- awslocal sqs create-queue --queue-name TestQueue --region {{.REGION}} >/dev/null 2>&1 || true
      - |
        BIN="${MIRRORD_BIN:-{{.ROOT_DIR}}/../mirrord/target/aarch64-apple-darwin/debug/mirrord}"
        AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test AWS_REGION={{.REGION}} \
          QUEUE_NAME=test-queue MIRRORD_CHECK_VERSION=false \
          "$BIN" exec -f {{.MIRRORD_CONFIG}} -- /tmp/sqs-consumer

  split:send:
    desc: "Send messages to the SQS source queue and print results to the console. FILTERED=N go to your local session (tenant Avi.Test); UNFILTERED=N stay in the cluster (tenant Basic)."
    vars:
      FILTERED: '{{.FILTERED | default "1"}}'
      UNFILTERED: '{{.UNFILTERED | default "0"}}'
      REGION: '{{.REGION | default "eu-north-1"}}'
      QUEUE_URL: '{{.QUEUE_URL | default "http://localhost:4566/000000000000/TestQueue"}}'
    cmds:
      - |
        for i in $(seq 1 {{.FILTERED}}); do
          kubectl exec -n localstack deploy/localstack -- \
            awslocal sqs send-message --region {{.REGION}} --queue-url {{.QUEUE_URL}} \
              --message-body "filtered-$i" \
              --message-attributes '{"tenant":{"DataType":"String","StringValue":"Avi.Test"}}' >/dev/null
          echo "sent filtered-$i  (tenant=Avi.Test -> local session)"
        done
        for i in $(seq 1 {{.UNFILTERED}}); do
          kubectl exec -n localstack deploy/localstack -- \
            awslocal sqs send-message --region {{.REGION}} --queue-url {{.QUEUE_URL}} \
              --message-body "unfiltered-$i" \
              --message-attributes '{"tenant":{"DataType":"String","StringValue":"Basic"}}' >/dev/null
          echo "sent unfiltered-$i  (tenant=Basic -> stays in cluster)"
        done

  split:reset:
    desc: "Full reset of SQS splitting state: kill the local consumer, delete every split-session CRD, delete all mirrord split queues, and restart the operator so no stale in-memory split keeps routing your messages to a dead queue."
    vars:
      REGION: '{{.REGION | default "eu-north-1"}}'
    cmds:
      - echo "killing any local consumer processes"
      - pkill -f /tmp/sqs-consumer 2>/dev/null || true
      - echo "deleting split-session CRDs (both legacy and unified)"
      - kubectl delete mirrordclustersplitsession --all -A --wait=false 2>/dev/null || true
      - kubectl delete mirrordsqssession --all -A --wait=false 2>/dev/null || true
      - kubectl delete mirrordclustersession --all -n mirrord --wait=false 2>/dev/null || true
      # A split session carries the `mirrord-queue-splitting` finalizer, so the
      # delete above only marks it for deletion - the operator is supposed to
      # remove the finalizer after it cleans up the split, but an orphaned
      # session (consumer gone, operator restarted) never gets reconciled and
      # stays stuck in Terminating forever. Since this is a full reset that
      # also wipes the queues and restarts the operator, that cleanup is moot,
      # so we strip the finalizer to let the stuck sessions actually go away.
      - echo "clearing finalizers on any stuck split-session CRDs"
      - |
        for name in $(kubectl get mirrordclustersplitsession -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
          echo "  clearing finalizers on $name"
          kubectl patch mirrordclustersplitsession "$name" --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
        done
      - echo "deleting all mirrord split queues in {{.REGION}}"
      - |
        for q in $(kubectl exec -n localstack deploy/localstack -- \
            awslocal sqs list-queues --region {{.REGION}} --query 'QueueUrls[]' --output text 2>/dev/null \
            | tr '\t' '\n' | grep mirrord); do
          echo "  deleting $(basename "$q")"
          kubectl exec -n localstack deploy/localstack -- \
            awslocal sqs delete-queue --queue-url "$q" --region {{.REGION}} 2>/dev/null || true
        done
      - echo "restarting operator to clear in-memory split state"
      - kubectl rollout restart deployment/mirrord-operator -n mirrord
      - kubectl rollout status deployment/mirrord-operator -n mirrord --timeout=120s
      - echo "reset complete - start a fresh session with 'task sqs:split:session'"

  split:multi-registry:
    desc: "Backwards-compat test for two MirrordWorkloadQueueRegistry objects on the same workload, each declaring a different queue. The old operator merged them; the unified resolver must too. Splits BOTH test-queue (registry 1) and orders-queue (registry 2) in one session and checks the MirrordClusterSplitSession resolves both. PASS = both queue ids present; FAIL = the second registry was dropped or the session errored."
    dir: '{{.ROOT_DIR}}'
    vars:
      MIRRORD_CONFIG: '{{.MIRRORD_CONFIG | default (print .ROOT_DIR "/k8s/overlays/sqs-localstack/mirrord-multi-registry.json")}}'
      REGION: '{{.REGION | default "eu-north-1"}}'
      CLUSTER_NAME: '{{.CLUSTER_NAME | default "bearkube"}}'
      CONTAINER_RUNTIME: '{{.CONTAINER_RUNTIME | default "docker"}}'
    cmds:
      # Rebuild and load the consumer image so the in-cluster pods run the
      # multi-queue app too (it reads QUEUE_NAME and ORDERS_QUEUE_NAME). The
      # local session rebuilds its own binary below via `go build`.
      - "{{.CONTAINER_RUNTIME}} build -t sqs-consumer:local {{.ROOT_DIR}}/apps/sqs-consumer"
      - minikube -p {{.CLUSTER_NAME}} image load sqs-consumer:local
      - kubectl apply -k {{.ROOT_DIR}}/k8s/overlays/sqs-localstack-legacy
      - kubectl apply -f {{.ROOT_DIR}}/k8s/sqs/queue-registry-second.yaml
      # A real MirrordSplitConfig always wins over legacy registries, so any
      # leftover from a prior `sqs:deploy` would hide the legacy path we want to
      # test. Kustomize `$patch: delete` in the legacy overlay does not remove an
      # already-created object, so delete it explicitly here.
      - kubectl delete mirrordsplitconfig --all -n {{.NAMESPACE}} --ignore-not-found=true
      # registry 2's orders-queue reads its name from ORDERS_QUEUE_NAME, a
      # different env var than test-queue's QUEUE_NAME, so the operator patches
      # two distinct vars instead of clashing on one. Inject it at runtime and
      # create the matching LocalStack queue.
      - kubectl set env deployment/sqs-consumer -n {{.NAMESPACE}} ORDERS_QUEUE_NAME=OrdersQueue
      - kubectl exec -n localstack deploy/localstack -- awslocal sqs create-queue --queue-name TestQueue --region {{.REGION}} >/dev/null 2>&1 || true
      - kubectl exec -n localstack deploy/localstack -- awslocal sqs create-queue --queue-name OrdersQueue --region {{.REGION}} >/dev/null 2>&1 || true
      # Start clean so the only split session we inspect is the one we create.
      - kubectl delete mirrordclustersplitsession --all -n {{.NAMESPACE}} --ignore-not-found=true --wait=false
      - task: _wait:localstack
      - task: _wait:consumer
      - echo "two registries now target Deployment/sqs-consumer:"
      - kubectl get mirrordworkloadqueueregistry -n {{.NAMESPACE}} -o custom-columns='NAME:.metadata.name,CONSUMER:.spec.consumer.name,QUEUES:.spec.queues'
      - (cd apps/sqs-consumer && go build -o /tmp/sqs-consumer main.go)
      - |
        BIN="${MIRRORD_BIN:-{{.ROOT_DIR}}/../mirrord/target/aarch64-apple-darwin/debug/mirrord}"
        LOG=$(mktemp)
        echo "starting split session in the background (log: $LOG)"
        AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test AWS_REGION={{.REGION}} \
          QUEUE_NAME=test-queue MIRRORD_CHECK_VERSION=false \
          "$BIN" exec -f {{.MIRRORD_CONFIG}} -- /tmp/sqs-consumer > "$LOG" 2>&1 &
        MIRRORD_PID=$!

        RESOLVED=""
        for i in $(seq 1 30); do
          if ! kill -0 "$MIRRORD_PID" 2>/dev/null; then
            break
          fi
          RESOLVED=$(kubectl get mirrordclustersplitsession -n {{.NAMESPACE}} \
            -o jsonpath='{range .items[*]}{.status.ready.tmpResources[*].queueId}{"\n"}{end}' 2>/dev/null \
            | tr ' ' '\n' | grep -v '^$' | sort -u | tr '\n' ' ')
          if [ -n "$RESOLVED" ]; then
            break
          fi
          sleep 2
        done

        kill "$MIRRORD_PID" 2>/dev/null || true
        wait "$MIRRORD_PID" 2>/dev/null || true

        echo "-----------------------------------------------------------------"
        echo "session log (tail):"
        tail -n 15 "$LOG" || true
        echo "-----------------------------------------------------------------"
        echo "resolved queue ids in MirrordClusterSplitSession: [$RESOLVED]"
        if echo "$RESOLVED" | grep -q 'test-queue' && echo "$RESOLVED" | grep -q 'orders-queue'; then
          echo "PASS: both registries merged - test-queue (registry 1) and orders-queue (registry 2) resolved"
        else
          echo "FAIL: the two registries did not merge - expected both 'test-queue' and 'orders-queue'"
          echo "      (the unified resolver likely rejected or dropped the second registry)"
          exit 1
        fi

  split:multi-registry:send:
    desc: "Send messages to BOTH source queues (TestQueue + OrdersQueue) for the multi-registry test. FILTERED=N per queue match the filter (tenant=Avi.Test) and go to your local session; UNFILTERED=N per queue do not match (tenant=Basic) and stay in the cluster. Defaults: FILTERED=2 UNFILTERED=1."
    vars:
      FILTERED: '{{.FILTERED | default "2"}}'
      UNFILTERED: '{{.UNFILTERED | default "1"}}'
      REGION: '{{.REGION | default "eu-north-1"}}'
    cmds:
      - |
        Q=http://localhost:4566/000000000000
        send() {
          # $1 queue url, $2 body, $3 tenant
          kubectl exec -n localstack deploy/localstack -- awslocal sqs send-message \
            --region {{.REGION}} --queue-url "$1" --message-body "$2" \
            --message-attributes "{\"tenant\":{\"DataType\":\"String\",\"StringValue\":\"$3\"}}" >/dev/null
          echo "  sent $2 (tenant=$3) -> $(basename "$1")"
        }
        for NAME in TestQueue OrdersQueue; do
          echo "queue $NAME:"
          for i in $(seq 1 {{.FILTERED}}); do
            send "$Q/$NAME" "${NAME}-local-$i" "Avi.Test"
          done
          for i in $(seq 1 {{.UNFILTERED}}); do
            send "$Q/$NAME" "${NAME}-remote-$i" "Basic"
          done
        done
        echo ""
        echo "filtered (tenant=Avi.Test) -> local session consumer"
        echo "unfiltered (tenant=Basic)  -> in-cluster pods (kubectl logs -n {{.NAMESPACE}} -l app=sqs-consumer -c consumer)"

  split:multi-registry:clean:
    desc: "Remove the second registry and extra env/queue added by sqs:split:multi-registry."
    cmds:
      - kubectl delete -f {{.ROOT_DIR}}/k8s/sqs/queue-registry-second.yaml --ignore-not-found=true
      - kubectl set env deployment/sqs-consumer -n {{.NAMESPACE}} ORDERS_QUEUE_NAME- 2>/dev/null || true

  split:stale-queue-repro:
    desc: "Reproduce the 'queue ... not found in resolved params' (QueueNotResolved / StartFailed 500) error via the LEGACY MirrordWorkloadQueueRegistry path. Starts session 1 while only the test-queue registry exists, so the shared split freezes on {test-queue}. Then adds a SECOND registry (orders-queue) and starts session 2, which joins the already-built split and asks for orders-queue - a queue the frozen split never created. PASS = session 2 fails with 'not found in resolved params'. Undo with sqs:split:stale-queue-repro:clean."
    dir: '{{.ROOT_DIR}}'
    vars:
      MIRRORD_CONFIG: '{{.MIRRORD_CONFIG | default (print .ROOT_DIR "/k8s/overlays/sqs-localstack/mirrord.json")}}'
      REGION: '{{.REGION | default "eu-north-1"}}'
      CLUSTER_NAME: '{{.CLUSTER_NAME | default "bearkube"}}'
      CONTAINER_RUNTIME: '{{.CONTAINER_RUNTIME | default "docker"}}'
    cmds:
      # Legacy env: MirrordWorkloadQueueRegistry only, no MirrordSplitConfig. The
      # resolver maps the registry to a config in memory, and the connect path
      # pulls in every registry queue, so the resolved set grows as soon as a new
      # registry appears - while the running split stays frozen on its old set.
      - "{{.CONTAINER_RUNTIME}} build -t sqs-consumer:local {{.ROOT_DIR}}/apps/sqs-consumer"
      - minikube -p {{.CLUSTER_NAME}} image load sqs-consumer:local
      - kubectl apply -k {{.ROOT_DIR}}/k8s/overlays/sqs-localstack-legacy
      # A real MirrordSplitConfig wins over the legacy registry and would hide the
      # path we want to exercise, so remove any left from a prior sqs:deploy.
      - kubectl delete mirrordsplitconfig --all -n {{.NAMESPACE}} --ignore-not-found=true
      # orders-queue resolves from ORDERS_QUEUE_NAME; give the deployment the env
      # and create both source queues so the setup is legitimate.
      - kubectl set env deployment/sqs-consumer -n {{.NAMESPACE}} ORDERS_QUEUE_NAME=OrdersQueue
      - kubectl exec -n localstack deploy/localstack -- awslocal sqs create-queue --queue-name TestQueue --region {{.REGION}} >/dev/null 2>&1 || true
      - kubectl exec -n localstack deploy/localstack -- awslocal sqs create-queue --queue-name OrdersQueue --region {{.REGION}} >/dev/null 2>&1 || true
      # Start from ONE registry (test-queue) and a clean operator so session 1 does
      # a fresh init that owns exactly {test-queue}. Clearing the persisted patch
      # request prevents the operator recovering an older split on restart.
      - kubectl delete -f {{.ROOT_DIR}}/k8s/sqs/queue-registry-second.yaml --ignore-not-found=true
      - kubectl apply -f {{.ROOT_DIR}}/k8s/sqs/queue-registry.yaml
      - kubectl delete mirrordclustersplitsession --all -A --ignore-not-found=true --wait=false
      - |
        for name in $(kubectl get mirrordclusterworkloadpatchrequest -o json 2>/dev/null \
            | jq -r '.items[] | select(.spec.workloadRef.name=="sqs-consumer") | .metadata.name'); do
          kubectl patch mirrordclusterworkloadpatchrequest "$name" --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
          kubectl delete mirrordclusterworkloadpatchrequest "$name" --ignore-not-found=true --wait=false 2>/dev/null || true
        done
      - kubectl rollout restart deployment/mirrord-operator -n mirrord
      - kubectl rollout status deployment/mirrord-operator -n mirrord --timeout=120s
      - |
        echo "waiting for the operator API to serve requests"
        for i in $(seq 1 30); do
          if kubectl get --raw '/apis/operator.metalbear.co/v1' >/dev/null 2>&1; then
            echo "  operator API ready"
            break
          fi
          sleep 2
        done
      - task: _wait:localstack
      - task: _wait:consumer
      - (cd apps/sqs-consumer && go build -o /tmp/sqs-consumer main.go)
      - |
        set -u
        BIN="${MIRRORD_BIN:-{{.ROOT_DIR}}/../mirrord/target/aarch64-apple-darwin/debug/mirrord}"
        S1_LOG=$(mktemp)
        S2_LOG=$(mktemp)
        S1_PID=""
        S2_PID=""
        cleanup() {
          [ -n "$S1_PID" ] && kill "$S1_PID" 2>/dev/null || true
          [ -n "$S2_PID" ] && kill "$S2_PID" 2>/dev/null || true
          wait 2>/dev/null || true
        }
        trap cleanup EXIT

        echo "=== session 1: only the test-queue registry exists (log: $S1_LOG) ==="
        AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test AWS_REGION={{.REGION}} \
          QUEUE_NAME=test-queue MIRRORD_CHECK_VERSION=false \
          "$BIN" exec -f {{.MIRRORD_CONFIG}} -- /tmp/sqs-consumer > "$S1_LOG" 2>&1 &
        S1_PID=$!

        echo "waiting for session 1's split to build (owns {test-queue})"
        READY=""
        for i in $(seq 1 45); do
          if ! kill -0 "$S1_PID" 2>/dev/null; then
            echo "session 1 died before its split built:"
            cat "$S1_LOG"
            exit 1
          fi
          READY=$(kubectl get mirrordclustersplitsession -n {{.NAMESPACE}} \
            -o jsonpath='{range .items[*]}{.status.ready.tmpResources[*].queueId}{"\n"}{end}' 2>/dev/null \
            | tr ' ' '\n' | grep -v '^$' | sort -u | tr '\n' ' ')
          if echo "$READY" | grep -q 'test-queue'; then
            break
          fi
          sleep 2
        done
        echo "session 1 resolved queues: [$READY]"

        echo "=== adding the SECOND registry (orders-queue) while session 1 stays live ==="
        kubectl apply -f {{.ROOT_DIR}}/k8s/sqs/queue-registry-second.yaml
        # Give the operator's config reflector time to observe the new registry.
        sleep 8

        echo "=== session 2: registry set is now {test-queue, orders-queue} (log: $S2_LOG) ==="
        AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test AWS_REGION={{.REGION}} \
          QUEUE_NAME=test-queue MIRRORD_CHECK_VERSION=false \
          "$BIN" exec -f {{.MIRRORD_CONFIG}} -- /tmp/sqs-consumer > "$S2_LOG" 2>&1 &
        S2_PID=$!

        echo "waiting for session 2 to start or fail"
        for i in $(seq 1 45); do
          if ! kill -0 "$S2_PID" 2>/dev/null; then
            break
          fi
          if grep -q 'not found in resolved params' "$S2_LOG"; then
            break
          fi
          sleep 2
        done

        echo "-----------------------------------------------------------------"
        echo "session 2 log (tail):"
        tail -n 25 "$S2_LOG" || true
        echo "-----------------------------------------------------------------"
        if grep -q 'not found in resolved params' "$S2_LOG"; then
          echo "PASS: reproduced QueueNotResolved - session 2 asked for orders-queue, which session 1's frozen split never created."
          exit 0
        fi
        echo "FAIL: did not reproduce the error. Session 2 may have joined cleanly or the split rebuilt."
        echo "session 1 log (tail):"
        tail -n 15 "$S1_LOG" || true
        exit 1

  split:stale-queue-repro:clean:
    desc: "Undo sqs:split:stale-queue-repro: remove the second registry and the ORDERS_QUEUE_NAME env, and reset split state so the next session starts fresh."
    cmds:
      - pkill -f /tmp/sqs-consumer 2>/dev/null || true
      - kubectl delete -f {{.ROOT_DIR}}/k8s/sqs/queue-registry-second.yaml --ignore-not-found=true
      - kubectl set env deployment/sqs-consumer -n {{.NAMESPACE}} ORDERS_QUEUE_NAME- 2>/dev/null || true
      - kubectl delete mirrordclustersplitsession --all -A --ignore-not-found=true --wait=false
      - |
        for name in $(kubectl get mirrordclustersplitsession -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
          kubectl patch mirrordclustersplitsession "$name" --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
        done
      - |
        for name in $(kubectl get mirrordclusterworkloadpatchrequest -o json 2>/dev/null \
            | jq -r '.items[] | select(.spec.workloadRef.name=="sqs-consumer") | .metadata.name'); do
          kubectl patch mirrordclusterworkloadpatchrequest "$name" --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
          kubectl delete mirrordclusterworkloadpatchrequest "$name" --ignore-not-found=true --wait=false 2>/dev/null || true
        done

  split:multi-type:
    desc: "Split TWO DIFFERENT broker types (SQS test-queue + Kafka kafka-topic) for one workload in a single session, using one MirrordSplitConfig listing both kinds. Prints the resulting QueueSplit and MirrordClusterSplitSession so you can SEE which kinds actually land in one session."
    dir: '{{.ROOT_DIR}}'
    vars:
      MIRRORD_CONFIG: '{{.MIRRORD_CONFIG | default (print .ROOT_DIR "/k8s/overlays/sqs-localstack/mirrord-multi-type.json")}}'
      REGION: '{{.REGION | default "eu-north-1"}}'
      CLUSTER_NAME: '{{.CLUSTER_NAME | default "bearkube"}}'
      CONTAINER_RUNTIME: '{{.CONTAINER_RUNTIME | default "docker"}}'
    cmds:
      - "{{.CONTAINER_RUNTIME}} build -t sqs-consumer:local {{.ROOT_DIR}}/apps/sqs-consumer"
      - minikube -p {{.CLUSTER_NAME}} image load sqs-consumer:local
      - kubectl apply -k {{.ROOT_DIR}}/k8s/overlays/sqs-localstack
      # Kafka splitting needs the client config (in the operator namespace) and a
      # running Kafka cluster with the source topic. The kafka deploy provides both.
      - kubectl apply -f {{.ROOT_DIR}}/k8s/kafka/kafka-client-config.yaml
      # One config, two kinds, same target.
      - kubectl apply -f {{.ROOT_DIR}}/k8s/sqs/split-config-multi-type.yaml
      # The operator resolves the SQS queue name from QUEUE_NAME (already set) and
      # the Kafka topic + group from these. sqs-consumer does not actually consume
      # Kafka, but resolution only reads the env vars from the pod template.
      - kubectl set env deployment/sqs-consumer -n {{.NAMESPACE}} KAFKA_TOPIC_NAME=test-topic KAFKA_GROUP_ID=test-consumer-group
      - kubectl exec -n localstack deploy/localstack -- awslocal sqs create-queue --queue-name TestQueue --region {{.REGION}} >/dev/null 2>&1 || true
      - kubectl delete mirrordclustersplitsession --all -n {{.NAMESPACE}} --ignore-not-found=true --wait=false
      # Clear persisted recovery state for the target so the next session does a
      # fresh init instead of rebuilding an older single-queue split.
      - |
        for name in $(kubectl get mirrordclusterworkloadpatchrequest -o json 2>/dev/null \
            | jq -r '.items[] | select(.spec.workloadRef.name=="sqs-consumer") | .metadata.name'); do
          kubectl patch mirrordclusterworkloadpatchrequest "$name" --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
          kubectl delete mirrordclusterworkloadpatchrequest "$name" --ignore-not-found=true --wait=false 2>/dev/null || true
        done
      - kubectl rollout restart deployment/mirrord-operator -n mirrord
      - kubectl rollout status deployment/mirrord-operator -n mirrord --timeout=120s
      - |
        echo "waiting for the operator API to serve requests"
        for i in $(seq 1 30); do
          if kubectl get --raw '/apis/operator.metalbear.co/v1' >/dev/null 2>&1; then
            echo "  operator API ready"
            break
          fi
          sleep 2
        done
      - task: _wait:localstack
      - task: _wait:consumer
      - echo "one MirrordSplitConfig targeting Deployment/sqs-consumer with TWO kinds:"
      - kubectl get mirrordsplitconfig sqs-test-split-config -n {{.NAMESPACE}} -o jsonpath='{range .spec.queues[*]}{.id}{" -> "}{.kind}{"\n"}{end}'
      - (cd apps/sqs-consumer && go build -o /tmp/sqs-consumer main.go)
      - |
        BIN="${MIRRORD_BIN:-{{.ROOT_DIR}}/../mirrord/target/aarch64-apple-darwin/debug/mirrord}"
        LOG=$(mktemp)
        echo "starting split session in the background (log: $LOG)"
        AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test AWS_REGION={{.REGION}} \
          QUEUE_NAME=test-queue MIRRORD_CHECK_VERSION=false \
          "$BIN" exec -f {{.MIRRORD_CONFIG}} -- /tmp/sqs-consumer > "$LOG" 2>&1 &
        MIRRORD_PID=$!

        CAPTURE=""
        for i in $(seq 1 40); do
          if ! kill -0 "$MIRRORD_PID" 2>/dev/null; then
            break
          fi
          # The QueueSplit custom API only exists while the session is live.
          CAPTURE=$(kubectl get queuesplits -n {{.NAMESPACE}} -o yaml 2>/dev/null)
          if echo "$CAPTURE" | grep -q 'type:'; then
            break
          fi
          sleep 2
        done

        echo "================================================================="
        echo "QueueSplit (custom API) while the session is live:"
        echo "$CAPTURE"
        echo "================================================================="
        echo "MirrordClusterSplitSession spec.queues (what the connect flow persisted):"
        kubectl get mirrordclustersplitsession -n {{.NAMESPACE}} \
          -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{range .spec.queues[*]}{"  "}{.id}{" -> "}{.kind}{"\n"}{end}{end}' 2>/dev/null
        echo "================================================================="

        kill "$MIRRORD_PID" 2>/dev/null || true
        wait "$MIRRORD_PID" 2>/dev/null || true

        echo "session log (tail):"
        tail -n 12 "$LOG" || true
        echo "================================================================="
        KINDS=$(echo "$CAPTURE" | grep -E '^\s+type:' | awk '{print $2}' | sort -u | tr '\n' ' ')
        echo "distinct queue kinds in the QueueSplit: [$KINDS]"
        if echo "$KINDS" | grep -qi 'SQS' && echo "$KINDS" | grep -qi 'Kafka'; then
          echo "RESULT: one session carried BOTH SQS and Kafka."
        else
          echo "RESULT: only one kind landed - the other was dropped by the connect flow."
        fi

  split:multi-type:clean:
    desc: "Restore the single-queue split config and remove Kafka env added by sqs:split:multi-type."
    cmds:
      - kubectl apply -f {{.ROOT_DIR}}/k8s/sqs/split-config.yaml
      - kubectl set env deployment/sqs-consumer -n {{.NAMESPACE}} KAFKA_TOPIC_NAME- KAFKA_GROUP_ID- 2>/dev/null || true

  split:sqs-rmq:
    desc: "Split TWO DIFFERENT broker types (SQS test-queue + RabbitMQ orders) for one workload in a single session, using one MirrordSplitConfig listing both kinds. Brings up LocalStack and a RabbitMQ hello-world cluster, points sqs-consumer at both, and prints the resulting MirrordSplitConfig. Run 'sqs:split:sqs-rmq:session' next, then ':match' / ':unmatch'."
    dir: '{{.ROOT_DIR}}'
    vars:
      REGION: '{{.REGION | default "eu-north-1"}}'
      CLUSTER_NAME: '{{.CLUSTER_NAME | default "bearkube"}}'
      CONTAINER_RUNTIME: '{{.CONTAINER_RUNTIME | default "docker"}}'
      RMQ_CLUSTER_NAME: '{{.RMQ_CLUSTER_NAME | default "hello-world"}}'
      RMQ_CLUSTER_NS: '{{.RMQ_CLUSTER_NS | default "default"}}'
      ORDERS_QUEUE: '{{.ORDERS_QUEUE | default "orders"}}'
    cmds:
      - "{{.CONTAINER_RUNTIME}} build -t sqs-consumer:local {{.ROOT_DIR}}/apps/sqs-consumer"
      - minikube -p {{.CLUSTER_NAME}} image load sqs-consumer:local
      - kubectl apply -k {{.ROOT_DIR}}/k8s/overlays/sqs-localstack
      # Bring up a RabbitMQ broker (cluster operator + hello-world cluster). The
      # operator resolves the RMQ queue name from the pod env; sqs-consumer never
      # actually consumes RabbitMQ, exactly like the SQS+Kafka multi-type test.
      - kubectl apply -f "https://github.com/rabbitmq/cluster-operator/releases/download/v2.21.1/cluster-operator.yml"
      - kubectl wait --for=condition=Available deployment/rabbitmq-cluster-operator -n rabbitmq-system --timeout=120s
      - kubectl apply -f https://raw.githubusercontent.com/rabbitmq/cluster-operator/main/docs/examples/hello-world/rabbitmq.yaml
      - kubectl wait --for=condition=ClusterAvailable rabbitmqcluster/{{.RMQ_CLUSTER_NAME}} -n {{.RMQ_CLUSTER_NS}} --timeout=180s
      # Declare the RMQ source queue and create the rmq-cluster MirrordPropertyList
      # the operator reads to declare temp queues and run the split.
      - |
        set -e
        SECRET="{{.RMQ_CLUSTER_NAME}}-default-user"
        RMQ_USER=$(kubectl get secret "$SECRET" -n {{.RMQ_CLUSTER_NS}} -o jsonpath='{.data.username}' | base64 -d)
        RMQ_PASS=$(kubectl get secret "$SECRET" -n {{.RMQ_CLUSTER_NS}} -o jsonpath='{.data.password}' | base64 -d)
        HOST="{{.RMQ_CLUSTER_NAME}}.{{.RMQ_CLUSTER_NS}}.svc"
        POD=$(kubectl get pod -n {{.RMQ_CLUSTER_NS}} -l app.kubernetes.io/component=rabbitmq,app.kubernetes.io/name={{.RMQ_CLUSTER_NAME}} -o jsonpath='{.items[0].metadata.name}')
        kubectl exec -n {{.RMQ_CLUSTER_NS}} "$POD" -c rabbitmq -- rabbitmqadmin --username "$RMQ_USER" --password "$RMQ_PASS" declare queue --name {{.ORDERS_QUEUE}} --type classic --durable true
        cat <<EOF | kubectl apply -f -
        apiVersion: mirrord.metalbear.co/v1
        kind: MirrordPropertyList
        metadata:
          name: rmq-cluster
          namespace: {{.NAMESPACE}}
        spec:
          properties:
            - name: scheme
              value: amqp
            - name: host
              value: "$HOST"
            - name: port
              value: "5672"
            - name: username
              value: "$RMQ_USER"
            - name: password
              value: "$RMQ_PASS"
            - name: vhost
              value: "/"
        EOF
      # sqs-consumer already carries QUEUE_NAME (SQS). Add the RMQ queue env so the
      # operator can resolve rmq-orders from the pod template too.
      - kubectl set env deployment/sqs-consumer -n {{.NAMESPACE}} RABBIT_MQ_ORDERS_QUEUE={{.ORDERS_QUEUE}}
      - kubectl exec -n localstack deploy/localstack -- awslocal sqs create-queue --queue-name TestQueue --region {{.REGION}} >/dev/null 2>&1 || true
      # One config, two kinds, same target.
      - kubectl apply -f {{.ROOT_DIR}}/k8s/sqs/split-config-sqs-rmq.yaml
      - kubectl delete mirrordclustersplitsession --all -n {{.NAMESPACE}} --ignore-not-found=true --wait=false
      # Clear persisted recovery state for the target so the next session does a
      # fresh init instead of rebuilding an older single-queue split.
      - |
        for name in $(kubectl get mirrordclusterworkloadpatchrequest -o json 2>/dev/null \
            | jq -r '.items[] | select(.spec.workloadRef.name=="sqs-consumer") | .metadata.name'); do
          kubectl patch mirrordclusterworkloadpatchrequest "$name" --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
          kubectl delete mirrordclusterworkloadpatchrequest "$name" --ignore-not-found=true --wait=false 2>/dev/null || true
        done
      - kubectl rollout restart deployment/mirrord-operator -n mirrord
      - kubectl rollout status deployment/mirrord-operator -n mirrord --timeout=120s
      - |
        echo "waiting for the operator API to serve requests"
        for i in $(seq 1 30); do
          if kubectl get --raw '/apis/operator.metalbear.co/v1' >/dev/null 2>&1; then
            echo "  operator API ready"
            break
          fi
          sleep 2
        done
      - task: _wait:localstack
      - task: _wait:consumer
      - echo "one MirrordSplitConfig targeting Deployment/sqs-consumer with TWO kinds:"
      - kubectl get mirrordsplitconfig sqs-test-split-config -n {{.NAMESPACE}} -o jsonpath='{range .spec.queues[*]}{.id}{" -> "}{.kind}{"\n"}{end}'
      - echo ""
      - echo "next - run 'task sqs:split:sqs-rmq:session' (leave it running), then in another shell 'task sqs:split:sqs-rmq:match' and 'task sqs:split:sqs-rmq:unmatch'"

  split:sqs-rmq:session:
    desc: "Start a local mirrord session splitting BOTH SQS (test-queue) and RabbitMQ (rmq-orders) in the foreground (Ctrl-C to stop). Creates one MirrordClusterSplitSession carrying both brokers. Set MIRRORD_BIN to override the CLI."
    dir: '{{.ROOT_DIR}}'
    vars:
      MIRRORD_CONFIG: '{{.MIRRORD_CONFIG | default (print .ROOT_DIR "/k8s/overlays/sqs-localstack/mirrord-sqs-rmq.json")}}'
      REGION: '{{.REGION | default "eu-north-1"}}'
      ORDERS_QUEUE: '{{.ORDERS_QUEUE | default "orders"}}'
    cmds:
      - (cd apps/sqs-consumer && go build -o /tmp/sqs-consumer main.go)
      - kubectl exec -n localstack deploy/localstack -- awslocal sqs create-queue --queue-name TestQueue --region {{.REGION}} >/dev/null 2>&1 || true
      - |
        BIN="${MIRRORD_BIN:-{{.ROOT_DIR}}/../mirrord/target/aarch64-apple-darwin/debug/mirrord}"
        AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test AWS_REGION={{.REGION}} \
          QUEUE_NAME=test-queue RABBIT_MQ_ORDERS_QUEUE={{.ORDERS_QUEUE}} MIRRORD_CHECK_VERSION=false \
          "$BIN" exec -f {{.MIRRORD_CONFIG}} -- /tmp/sqs-consumer

  split:sqs-rmq:match:
    desc: "Send MATCHING messages to BOTH source queues so they reach the local session: SQS TestQueue with tenant=Avi.Test and RabbitMQ orders with header tenant=a. FILTERED=N per queue (default 2)."
    vars:
      FILTERED: '{{.FILTERED | default "2"}}'
      REGION: '{{.REGION | default "eu-north-1"}}'
      QUEUE_URL: '{{.QUEUE_URL | default "http://localhost:4566/000000000000/TestQueue"}}'
      RMQ_CLUSTER_NAME: '{{.RMQ_CLUSTER_NAME | default "hello-world"}}'
      RMQ_CLUSTER_NS: '{{.RMQ_CLUSTER_NS | default "default"}}'
      ORDERS_QUEUE: '{{.ORDERS_QUEUE | default "orders"}}'
    cmds:
      - |
        echo "SQS TestQueue (tenant=Avi.Test -> local session):"
        for i in $(seq 1 {{.FILTERED}}); do
          kubectl exec -n localstack deploy/localstack -- \
            awslocal sqs send-message --region {{.REGION}} --queue-url {{.QUEUE_URL}} \
              --message-body "sqs-match-$i" \
              --message-attributes '{"tenant":{"DataType":"String","StringValue":"Avi.Test"}}' >/dev/null
          echo "  sent sqs-match-$i"
        done
      - |
        SECRET="{{.RMQ_CLUSTER_NAME}}-default-user"
        RMQ_USER=$(kubectl get secret "$SECRET" -n {{.RMQ_CLUSTER_NS}} -o jsonpath='{.data.username}' | base64 -d)
        RMQ_PASS=$(kubectl get secret "$SECRET" -n {{.RMQ_CLUSTER_NS}} -o jsonpath='{.data.password}' | base64 -d)
        POD=$(kubectl get pod -n {{.RMQ_CLUSTER_NS}} -l app.kubernetes.io/component=rabbitmq,app.kubernetes.io/name={{.RMQ_CLUSTER_NAME}} -o jsonpath='{.items[0].metadata.name}')
        echo "RabbitMQ {{.ORDERS_QUEUE}} (header tenant=a -> local session):"
        for i in $(seq 1 {{.FILTERED}}); do
          kubectl exec -n {{.RMQ_CLUSTER_NS}} "$POD" -c rabbitmq -- \
            rabbitmqadmin --username "$RMQ_USER" --password "$RMQ_PASS" publish message \
              --routing-key "{{.ORDERS_QUEUE}}" \
              --payload "rmq-match-$i tenant=a" \
              --properties '{"headers":{"tenant":"a"}}'
        done

  split:sqs-rmq:match:drifted:
    desc: "Like sqs:split:sqs-rmq:match but targets the DRIFTED queues (SQS TestQueueV2 + RMQ orders-v2) created by sqs:split:sqs-rmq:drift. Use this after a drift + session restart so matching messages actually reach the re-resolved session. FILTERED=N per queue (default 2)."
    vars:
      FILTERED: '{{.FILTERED | default "2"}}'
      REGION: '{{.REGION | default "eu-north-1"}}'
      QUEUE_URL: '{{.QUEUE_URL | default "http://localhost:4566/000000000000/TestQueueV2"}}'
      RMQ_CLUSTER_NAME: '{{.RMQ_CLUSTER_NAME | default "hello-world"}}'
      RMQ_CLUSTER_NS: '{{.RMQ_CLUSTER_NS | default "default"}}'
      ORDERS_QUEUE: '{{.ORDERS_QUEUE | default "orders-v2"}}'
    cmds:
      - |
        echo "SQS $(basename {{.QUEUE_URL}}) (tenant=Avi.Test -> local session):"
        for i in $(seq 1 {{.FILTERED}}); do
          kubectl exec -n localstack deploy/localstack -- \
            awslocal sqs send-message --region {{.REGION}} --queue-url {{.QUEUE_URL}} \
              --message-body "sqs-match-$i" \
              --message-attributes '{"tenant":{"DataType":"String","StringValue":"Avi.Test"}}' >/dev/null
          echo "  sent sqs-match-$i"
        done
      - |
        SECRET="{{.RMQ_CLUSTER_NAME}}-default-user"
        RMQ_USER=$(kubectl get secret "$SECRET" -n {{.RMQ_CLUSTER_NS}} -o jsonpath='{.data.username}' | base64 -d)
        RMQ_PASS=$(kubectl get secret "$SECRET" -n {{.RMQ_CLUSTER_NS}} -o jsonpath='{.data.password}' | base64 -d)
        POD=$(kubectl get pod -n {{.RMQ_CLUSTER_NS}} -l app.kubernetes.io/component=rabbitmq,app.kubernetes.io/name={{.RMQ_CLUSTER_NAME}} -o jsonpath='{.items[0].metadata.name}')
        echo "RabbitMQ {{.ORDERS_QUEUE}} (header tenant=a -> local session):"
        for i in $(seq 1 {{.FILTERED}}); do
          kubectl exec -n {{.RMQ_CLUSTER_NS}} "$POD" -c rabbitmq -- \
            rabbitmqadmin --username "$RMQ_USER" --password "$RMQ_PASS" publish message \
              --routing-key "{{.ORDERS_QUEUE}}" \
              --payload "rmq-match-$i tenant=a" \
              --properties '{"headers":{"tenant":"a"}}'
        done

  split:sqs-rmq:unmatch:
    desc: "Send NON-matching messages to BOTH source queues so they stay in the cluster: SQS TestQueue with tenant=Basic and RabbitMQ orders with header tenant=b. UNFILTERED=N per queue (default 2)."
    vars:
      UNFILTERED: '{{.UNFILTERED | default "2"}}'
      REGION: '{{.REGION | default "eu-north-1"}}'
      QUEUE_URL: '{{.QUEUE_URL | default "http://localhost:4566/000000000000/TestQueue"}}'
      RMQ_CLUSTER_NAME: '{{.RMQ_CLUSTER_NAME | default "hello-world"}}'
      RMQ_CLUSTER_NS: '{{.RMQ_CLUSTER_NS | default "default"}}'
      ORDERS_QUEUE: '{{.ORDERS_QUEUE | default "orders"}}'
    cmds:
      - |
        echo "SQS TestQueue (tenant=Basic -> stays in cluster):"
        for i in $(seq 1 {{.UNFILTERED}}); do
          kubectl exec -n localstack deploy/localstack -- \
            awslocal sqs send-message --region {{.REGION}} --queue-url {{.QUEUE_URL}} \
              --message-body "sqs-unmatch-$i" \
              --message-attributes '{"tenant":{"DataType":"String","StringValue":"Basic"}}' >/dev/null
          echo "  sent sqs-unmatch-$i"
        done
      - |
        SECRET="{{.RMQ_CLUSTER_NAME}}-default-user"
        RMQ_USER=$(kubectl get secret "$SECRET" -n {{.RMQ_CLUSTER_NS}} -o jsonpath='{.data.username}' | base64 -d)
        RMQ_PASS=$(kubectl get secret "$SECRET" -n {{.RMQ_CLUSTER_NS}} -o jsonpath='{.data.password}' | base64 -d)
        POD=$(kubectl get pod -n {{.RMQ_CLUSTER_NS}} -l app.kubernetes.io/component=rabbitmq,app.kubernetes.io/name={{.RMQ_CLUSTER_NAME}} -o jsonpath='{.items[0].metadata.name}')
        echo "RabbitMQ {{.ORDERS_QUEUE}} (header tenant=b -> stays in cluster):"
        for i in $(seq 1 {{.UNFILTERED}}); do
          kubectl exec -n {{.RMQ_CLUSTER_NS}} "$POD" -c rabbitmq -- \
            rabbitmqadmin --username "$RMQ_USER" --password "$RMQ_PASS" publish message \
              --routing-key "{{.ORDERS_QUEUE}}" \
              --payload "rmq-unmatch-$i tenant=b" \
              --properties '{"headers":{"tenant":"b"}}'
        done

  split:sqs-rmq:status:
    desc: "Show the live queue-splitting status for the combined SQS+RMQ session: the resolved queues the operator reports (the 'mirrord queues' view), the persisted MirrordClusterSplitSession, and the source/temp queue depths on both brokers. Resolved queues are gathered ONCE at session start today - run this before and after a mid-session config/env change to watch them go stale (and, once the watcher lands, refresh or fail+reconnect)."
    vars:
      REGION: '{{.REGION | default "eu-north-1"}}'
      RMQ_CLUSTER_NAME: '{{.RMQ_CLUSTER_NAME | default "hello-world"}}'
      RMQ_CLUSTER_NS: '{{.RMQ_CLUSTER_NS | default "default"}}'
    cmds:
      - echo "=== QueueSplit (the 'mirrord queues' view; only present while a session is live) ==="
      - |
        kubectl get queuesplits -n {{.NAMESPACE}} \
          -o jsonpath='{range .items[*]}{.metadata.name}{"  phase="}{.status.phase}{"  message="}{.status.message}{"\n"}{range .status.queues[*]}{"  resolved -> id="}{.id}{" kind="}{.queueType}{" queue="}{.queue}{" topic="}{.topic}{"\n"}{end}{end}' 2>/dev/null \
          || echo "(no live session - the queuesplits API is only served while a split session runs)"
      - echo ""
      - echo "=== MirrordClusterSplitSession spec.queues (persisted by the connect flow) ==="
      - kubectl get mirrordclustersplitsession -n {{.NAMESPACE}} -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{range .spec.queues[*]}{"  "}{.id}{" -> "}{.kind}{"\n"}{end}{end}' 2>/dev/null || echo "(none)"
      - echo ""
      - echo "=== SQS queues (source + mirrord-* temp) ==="
      - |
        for q in $(kubectl exec -n localstack deploy/localstack -- awslocal sqs list-queues --region {{.REGION}} --query 'QueueUrls[]' --output text 2>/dev/null | tr '\t' '\n'); do
          c=$(kubectl exec -n localstack deploy/localstack -- awslocal sqs get-queue-attributes --queue-url "$q" --region {{.REGION}} --attribute-names ApproximateNumberOfMessages --output json 2>/dev/null | jq -r '.Attributes.ApproximateNumberOfMessages')
          echo "  $(basename "$q"): ${c:-?} messages"
        done
      - echo ""
      - echo "=== RabbitMQ queues (source + mirrord-* temp) ==="
      - |
        SECRET="{{.RMQ_CLUSTER_NAME}}-default-user"
        RMQ_USER=$(kubectl get secret "$SECRET" -n {{.RMQ_CLUSTER_NS}} -o jsonpath='{.data.username}' | base64 -d 2>/dev/null)
        RMQ_PASS=$(kubectl get secret "$SECRET" -n {{.RMQ_CLUSTER_NS}} -o jsonpath='{.data.password}' | base64 -d 2>/dev/null)
        POD=$(kubectl get pod -n {{.RMQ_CLUSTER_NS}} -l app.kubernetes.io/component=rabbitmq,app.kubernetes.io/name={{.RMQ_CLUSTER_NAME}} -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
        if [ -n "$POD" ]; then
          kubectl exec -n {{.RMQ_CLUSTER_NS}} "$POD" -c rabbitmq -- rabbitmqctl list_queues name messages consumers 2>/dev/null || echo "  (could not list)"
        else
          echo "  RabbitMQ not running"
        fi

  split:sqs-rmq:drift:
    desc: "Mid-session, change which queues the workload consumes so a FRESH resolve differs from the running split: creates new source queues (SQS TestQueueV2 + RMQ orders-v2) and repoints the consumer's QUEUE_NAME / RABBIT_MQ_ORDERS_QUEUE at them. Run sqs:split:sqs-rmq:status before and after. Today the live session stays frozen on the old queues (the bug the watcher fixes). Undo with sqs:split:sqs-rmq:drift:revert."
    vars:
      REGION: '{{.REGION | default "eu-north-1"}}'
      RMQ_CLUSTER_NAME: '{{.RMQ_CLUSTER_NAME | default "hello-world"}}'
      RMQ_CLUSTER_NS: '{{.RMQ_CLUSTER_NS | default "default"}}'
      SQS_NEW: '{{.SQS_NEW | default "TestQueueV2"}}'
      RMQ_NEW: '{{.RMQ_NEW | default "orders-v2"}}'
    cmds:
      - echo "creating new source queues {{.SQS_NEW}} (SQS) and {{.RMQ_NEW}} (RMQ)"
      - kubectl exec -n localstack deploy/localstack -- awslocal sqs create-queue --queue-name {{.SQS_NEW}} --region {{.REGION}} >/dev/null 2>&1 || true
      - |
        SECRET="{{.RMQ_CLUSTER_NAME}}-default-user"
        RMQ_USER=$(kubectl get secret "$SECRET" -n {{.RMQ_CLUSTER_NS}} -o jsonpath='{.data.username}' | base64 -d)
        RMQ_PASS=$(kubectl get secret "$SECRET" -n {{.RMQ_CLUSTER_NS}} -o jsonpath='{.data.password}' | base64 -d)
        POD=$(kubectl get pod -n {{.RMQ_CLUSTER_NS}} -l app.kubernetes.io/component=rabbitmq,app.kubernetes.io/name={{.RMQ_CLUSTER_NAME}} -o jsonpath='{.items[0].metadata.name}')
        kubectl exec -n {{.RMQ_CLUSTER_NS}} "$POD" -c rabbitmq -- rabbitmqadmin --username "$RMQ_USER" --password "$RMQ_PASS" declare queue --name {{.RMQ_NEW}} --type classic --durable true
      - echo "repointing consumer env - QUEUE_NAME={{.SQS_NEW}}, RABBIT_MQ_ORDERS_QUEUE={{.RMQ_NEW}}"
      - kubectl set env deployment/sqs-consumer -n {{.NAMESPACE}} QUEUE_NAME={{.SQS_NEW}} RABBIT_MQ_ORDERS_QUEUE={{.RMQ_NEW}}
      - echo "done - a fresh resolve now targets {{.SQS_NEW}} / {{.RMQ_NEW}}. Run 'task sqs:split:sqs-rmq:status' to compare against the live session."

  split:sqs-rmq:drift:revert:
    desc: "Undo sqs:split:sqs-rmq:drift: repoint the consumer back to the original queues (QUEUE_NAME=TestQueue, RABBIT_MQ_ORDERS_QUEUE=orders) and delete the drift queues created by the drift task."
    vars:
      REGION: '{{.REGION | default "eu-north-1"}}'
      RMQ_CLUSTER_NAME: '{{.RMQ_CLUSTER_NAME | default "hello-world"}}'
      RMQ_CLUSTER_NS: '{{.RMQ_CLUSTER_NS | default "default"}}'
      ORDERS_QUEUE: '{{.ORDERS_QUEUE | default "orders"}}'
      SQS_ORIG: '{{.SQS_ORIG | default "TestQueue"}}'
      SQS_NEW: '{{.SQS_NEW | default "TestQueueV2"}}'
      RMQ_NEW: '{{.RMQ_NEW | default "orders-v2"}}'
    cmds:
      - echo "repointing consumer env back to QUEUE_NAME={{.SQS_ORIG}}, RABBIT_MQ_ORDERS_QUEUE={{.ORDERS_QUEUE}}"
      - kubectl set env deployment/sqs-consumer -n {{.NAMESPACE}} QUEUE_NAME={{.SQS_ORIG}} RABBIT_MQ_ORDERS_QUEUE={{.ORDERS_QUEUE}}
      - kubectl exec -n localstack deploy/localstack -- awslocal sqs delete-queue --queue-url http://localhost:4566/000000000000/{{.SQS_NEW}} --region {{.REGION}} 2>/dev/null || true
      - |
        SECRET="{{.RMQ_CLUSTER_NAME}}-default-user"
        RMQ_USER=$(kubectl get secret "$SECRET" -n {{.RMQ_CLUSTER_NS}} -o jsonpath='{.data.username}' | base64 -d)
        RMQ_PASS=$(kubectl get secret "$SECRET" -n {{.RMQ_CLUSTER_NS}} -o jsonpath='{.data.password}' | base64 -d)
        POD=$(kubectl get pod -n {{.RMQ_CLUSTER_NS}} -l app.kubernetes.io/component=rabbitmq,app.kubernetes.io/name={{.RMQ_CLUSTER_NAME}} -o jsonpath='{.items[0].metadata.name}')
        kubectl exec -n {{.RMQ_CLUSTER_NS}} "$POD" -c rabbitmq -- rabbitmqadmin --username "$RMQ_USER" --password "$RMQ_PASS" delete queue --name {{.RMQ_NEW}} --idempotently 2>/dev/null || true
      - echo "reverted to original queues"

  split:sqs-rmq:clean:
    desc: "Restore the single-queue SQS split config and remove the RMQ infra added by sqs:split:sqs-rmq (env, rmq-cluster property list, orders queue, mirrord-* temp queues)."
    vars:
      RMQ_CLUSTER_NAME: '{{.RMQ_CLUSTER_NAME | default "hello-world"}}'
      RMQ_CLUSTER_NS: '{{.RMQ_CLUSTER_NS | default "default"}}'
      ORDERS_QUEUE: '{{.ORDERS_QUEUE | default "orders"}}'
    cmds:
      - kubectl apply -f {{.ROOT_DIR}}/k8s/sqs/split-config.yaml
      - kubectl set env deployment/sqs-consumer -n {{.NAMESPACE}} RABBIT_MQ_ORDERS_QUEUE- 2>/dev/null || true
      - kubectl delete mirrordpropertylist rmq-cluster -n {{.NAMESPACE}} --ignore-not-found=true
      - |
        SECRET="{{.RMQ_CLUSTER_NAME}}-default-user"
        RMQ_USER=$(kubectl get secret "$SECRET" -n {{.RMQ_CLUSTER_NS}} -o jsonpath='{.data.username}' | base64 -d 2>/dev/null)
        RMQ_PASS=$(kubectl get secret "$SECRET" -n {{.RMQ_CLUSTER_NS}} -o jsonpath='{.data.password}' | base64 -d 2>/dev/null)
        POD=$(kubectl get pod -n {{.RMQ_CLUSTER_NS}} -l app.kubernetes.io/component=rabbitmq,app.kubernetes.io/name={{.RMQ_CLUSTER_NAME}} -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
        if [ -n "$POD" ]; then
          kubectl exec -n {{.RMQ_CLUSTER_NS}} "$POD" -c rabbitmq -- rabbitmqadmin --username "$RMQ_USER" --password "$RMQ_PASS" delete queue --name {{.ORDERS_QUEUE}} --idempotently 2>/dev/null || true
          for q in $(kubectl exec -n {{.RMQ_CLUSTER_NS}} "$POD" -c rabbitmq -- rabbitmqctl list_queues name --no-table-headers 2>/dev/null | grep "^mirrord-" || true); do
            kubectl exec -n {{.RMQ_CLUSTER_NS}} "$POD" -c rabbitmq -- rabbitmqctl delete_queue "$q" 2>/dev/null || true
            echo "deleted temp queue $q"
          done
        fi
      - echo "restored base SQS split config and removed RMQ infra"

  split:added-queue-repro:
    desc: "Reproduce the 'queue X not found in resolved params' (StartFailed 500) bug. Session 1 builds a split for only test-queue and stays alive; then orders-queue is ADDED to the MirrordSplitConfig; then session 2 connects and, because the connect flow now asks to split BOTH queues, it joins the still-running split and requests orders-queue, which that split never created. REPRODUCED = session 2 is rejected with the error. Undo with sqs:split:added-queue-repro:clean."
    dir: '{{.ROOT_DIR}}'
    vars:
      REGION: '{{.REGION | default "eu-north-1"}}'
      MIRRORD_CONFIG: '{{.MIRRORD_CONFIG | default (print .ROOT_DIR "/k8s/overlays/sqs-localstack/mirrord.json")}}'
    cmds:
      - kubectl apply -k {{.ROOT_DIR}}/k8s/overlays/sqs-localstack
      - task: _wait:localstack
      - task: _wait:consumer
      - kubectl exec -n localstack deploy/localstack -- awslocal sqs create-queue --queue-name TestQueue --region {{.REGION}} >/dev/null 2>&1 || true
      - kubectl exec -n localstack deploy/localstack -- awslocal sqs create-queue --queue-name OrdersQueue --region {{.REGION}} >/dev/null 2>&1 || true
      # Start from a single-queue baseline so session 1's split owns only
      # test-queue. Re-apply the base config, drop old split sessions, and wipe
      # the persisted workload-patch recovery state so the next session does a
      # fresh init instead of rebuilding a wider recovered split.
      - kubectl apply -f {{.ROOT_DIR}}/k8s/sqs/split-config.yaml
      - kubectl delete mirrordclustersplitsession --all -n {{.NAMESPACE}} --ignore-not-found=true --wait=false
      - |
        for name in $(kubectl get mirrordclusterworkloadpatchrequest -o json 2>/dev/null \
            | jq -r '.items[] | select(.spec.workloadRef.name=="sqs-consumer") | .metadata.name'); do
          kubectl patch mirrordclusterworkloadpatchrequest "$name" --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
          kubectl delete mirrordclusterworkloadpatchrequest "$name" --ignore-not-found=true --wait=false 2>/dev/null || true
        done
      - kubectl rollout restart deployment/mirrord-operator -n mirrord
      - kubectl rollout status deployment/mirrord-operator -n mirrord --timeout=120s
      - |
        echo "waiting for the operator API to serve requests"
        for i in $(seq 1 30); do
          if kubectl get --raw '/apis/operator.metalbear.co/v1' >/dev/null 2>&1; then
            echo "  operator API ready"
            break
          fi
          sleep 2
        done
      - task: _wait:consumer
      - |
        BIN="${MIRRORD_BIN:-{{.ROOT_DIR}}/../mirrord/target/aarch64-apple-darwin/debug/mirrord}"
        S1_LOG=$(mktemp)
        S2_LOG=$(mktemp)
        echo "session 1 log: $S1_LOG"
        echo "session 2 log: $S2_LOG"

        # The local command does not affect the split, so a plain sleep keeps the
        # session (and therefore the shared split) alive without the consumer.
        echo "starting session 1 (splits test-queue) and keeping it alive"
        AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test AWS_REGION={{.REGION}} \
          MIRRORD_CHECK_VERSION=false \
          "$BIN" exec -f {{.MIRRORD_CONFIG}} -- sleep 600 > "$S1_LOG" 2>&1 &
        S1_PID=$!

        echo "waiting for session 1's split to become ready"
        READY=0
        for i in $(seq 1 45); do
          if ! kill -0 "$S1_PID" 2>/dev/null; then
            echo "session 1 exited early:"
            tail -n 20 "$S1_LOG"
            exit 1
          fi
          READY=$(kubectl get mirrordclustersplitsession -n {{.NAMESPACE}} \
            -o jsonpath='{range .items[*]}{.status.ready.tmpResources[*].queueId}{"\n"}{end}' 2>/dev/null \
            | tr ' ' '\n' | grep -c 'test-queue' || true)
          if [ "${READY:-0}" -ge 1 ]; then
            break
          fi
          sleep 2
        done
        if [ "${READY:-0}" -lt 1 ]; then
          echo "session 1 split never became ready:"
          tail -n 20 "$S1_LOG"
          kill "$S1_PID" 2>/dev/null || true
          exit 1
        fi
        echo "session 1 split is live with test-queue"

        # Widen the config AFTER the split exists. The running split still owns
        # only test-queue, and the periodic re-resolve only re-checks owned
        # queues, so it never picks up the new one.
        echo "adding orders-queue to the MirrordSplitConfig"
        kubectl apply -f {{.ROOT_DIR}}/k8s/sqs/split-config-multi-queue.yaml
        kubectl set env deployment/sqs-consumer -n {{.NAMESPACE}} ORDERS_QUEUE_NAME=OrdersQueue >/dev/null
        sleep 5

        # Session 2 targets the same workload. The connect flow reads the widened
        # config and asks to split BOTH queues, then joins the existing split and
        # requests orders-queue, which the frozen split does not have.
        echo "starting session 2 (connect flow now requests test-queue + orders-queue)"
        AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test AWS_REGION={{.REGION}} \
          MIRRORD_CHECK_VERSION=false \
          "$BIN" exec -f {{.MIRRORD_CONFIG}} -- sleep 30 > "$S2_LOG" 2>&1 &
        S2_PID=$!

        echo "waiting for session 2 to fail or come up"
        for i in $(seq 1 40); do
          if grep -q 'not found in resolved params' "$S2_LOG"; then
            break
          fi
          if ! kill -0 "$S2_PID" 2>/dev/null; then
            break
          fi
          sleep 2
        done

        kill "$S1_PID" "$S2_PID" 2>/dev/null || true
        wait "$S1_PID" 2>/dev/null || true
        wait "$S2_PID" 2>/dev/null || true

        echo "================================================================="
        echo "session 2 log (tail):"
        tail -n 25 "$S2_LOG"
        echo "================================================================="
        if grep -q 'not found in resolved params' "$S2_LOG"; then
          echo "REPRODUCED: session 2 was rejected with 'not found in resolved params' (StartFailed 500)."
        else
          echo "NOT reproduced: session 2 did not hit the error."
          echo "The running split may have rebuilt with the new queue (bug fixed)."
          exit 1
        fi

  split:added-queue-repro:clean:
    desc: "Undo sqs:split:added-queue-repro: restore the single-queue split config, remove ORDERS_QUEUE_NAME, delete leftover split sessions and OrdersQueue."
    vars:
      REGION: '{{.REGION | default "eu-north-1"}}'
    cmds:
      - kubectl apply -f {{.ROOT_DIR}}/k8s/sqs/split-config.yaml
      - kubectl set env deployment/sqs-consumer -n {{.NAMESPACE}} ORDERS_QUEUE_NAME- 2>/dev/null || true
      - kubectl delete mirrordclustersplitsession --all -n {{.NAMESPACE}} --ignore-not-found=true --wait=false
      - kubectl exec -n localstack deploy/localstack -- awslocal sqs delete-queue --queue-url http://localhost:4566/000000000000/OrdersQueue --region {{.REGION}} 2>/dev/null || true

  # =============================================================================
  # SQS Preview Environment Tasks
  #
  # A preview environment splits queues through a namespaced PreviewSession that
  # owns a cluster-scoped MirrordClusterSplitSession. `preview:verify-cleanup`
  # is the automated start/stop/check for the fix: after `preview stop` the split
  # session and its temp SQS queues must be gone. Before the fix the split session
  # (with a namespaced owner Kubernetes GC won't act on) and the temp queues
  # lived on forever.
  # =============================================================================

  preview:deploy:
    desc: "Deploy the SQS LocalStack env (consumer + split config) for preview testing"
    cmds:
      - task: deploy
      - echo ""
      - echo "SQS preview environment ready. Run 'task sqs:preview:start' to create a preview session."

  preview:start:
    desc: "Start an SQS preview environment (tenant=^Avi. filter on test-queue). Runs in the foreground; stop it with 'task sqs:preview:stop' from another shell."
    dir: '{{.ROOT_DIR}}'
    vars:
      PREVIEW_KEY: '{{.PREVIEW_KEY | default "test-sqs-preview"}}'
      PREVIEW_IMAGE: '{{.PREVIEW_IMAGE | default "sqs-consumer:local"}}'
      PREVIEW_TIMEOUT: '{{.PREVIEW_TIMEOUT | default "300"}}'
      MIRRORD_CONFIG: '{{.MIRRORD_CONFIG | default (print .ROOT_DIR "/k8s/overlays/sqs-localstack/mirrord-preview.json")}}'
    cmds:
      - |
        {{.MIRRORD_BIN}} preview start \
          -f {{.MIRRORD_CONFIG}} \
          -i "{{.PREVIEW_IMAGE}}" \
          -k "{{.PREVIEW_KEY}}" \
          --timeout {{.PREVIEW_TIMEOUT}}

  preview:stop:
    desc: "Stop an SQS preview environment (the split session and temp queues should then be cleaned up)."
    vars:
      PREVIEW_KEY: '{{.PREVIEW_KEY | default "test-sqs-preview"}}'
    cmds:
      - "{{.MIRRORD_BIN}} preview stop -k \"{{.PREVIEW_KEY}}\" || true"

  preview:status:
    desc: "Show SQS preview state: preview sessions, preview pods, split sessions, external resources, and temp SQS queues."
    vars:
      REGION: '{{.REGION | default "eu-north-1"}}'
    cmds:
      - echo "=== PreviewSessions ==="
      - kubectl get previewsessions -n {{.NAMESPACE}} 2>/dev/null || echo "(none)"
      - echo ""
      - echo "=== Preview pods ==="
      - kubectl get pods -n {{.NAMESPACE}} -l operator.metalbear.co/managed-by=preview 2>/dev/null || echo "(none)"
      - echo ""
      - echo "=== MirrordClusterSplitSessions (name / spec.namespace / preview-session-ref) ==="
      - |
        kubectl get mirrordclustersplitsession -o json 2>/dev/null \
          | jq -r '.items[] | .metadata.name + "  ns=" + .spec.namespace + "  preview-ref=" + (.metadata.annotations["operator.metalbear.co/preview-session-ref"] // "-") + "  owners=" + ((.metadata.ownerReferences // []) | length | tostring)' \
          || echo "(none)"
      - echo ""
      - echo "=== MirrordClusterExternalResources ==="
      - kubectl get mirrordclusterexternalresources 2>/dev/null || echo "(none)"
      - echo ""
      - echo "=== Temp SQS queues (mirrord-*) ==="
      - |
        kubectl exec -n localstack deploy/localstack -- \
          awslocal sqs list-queues --region {{.REGION}} --query 'QueueUrls[]' --output text 2>/dev/null \
          | tr '\t' '\n' | grep mirrord | sed 's#.*/#  #' || echo "  (none)"

  preview:logs:
    desc: "Follow the SQS preview pod logs."
    cmds:
      - kubectl logs -n {{.NAMESPACE}} -l operator.metalbear.co/managed-by=preview --tail=100 -f

  preview:send:
    desc: "Send messages to the SQS source queue while a preview is running. FILTERED=N (tenant=Avi.Test) reach the preview pod; UNFILTERED=N (tenant=Basic) stay on the target pod."
    vars:
      FILTERED: '{{.FILTERED | default "2"}}'
      UNFILTERED: '{{.UNFILTERED | default "1"}}'
      REGION: '{{.REGION | default "eu-north-1"}}'
      QUEUE_URL: '{{.QUEUE_URL | default "http://localhost:4566/000000000000/TestQueue"}}'
    cmds:
      - |
        for i in $(seq 1 {{.FILTERED}}); do
          kubectl exec -n localstack deploy/localstack -- \
            awslocal sqs send-message --region {{.REGION}} --queue-url {{.QUEUE_URL}} \
              --message-body "preview-filtered-$i" \
              --message-attributes '{"tenant":{"DataType":"String","StringValue":"Avi.Test"}}' >/dev/null
          echo "sent preview-filtered-$i  (tenant=Avi.Test -> preview pod)"
        done
        for i in $(seq 1 {{.UNFILTERED}}); do
          kubectl exec -n localstack deploy/localstack -- \
            awslocal sqs send-message --region {{.REGION}} --queue-url {{.QUEUE_URL}} \
              --message-body "preview-unfiltered-$i" \
              --message-attributes '{"tenant":{"DataType":"String","StringValue":"Basic"}}' >/dev/null
          echo "sent preview-unfiltered-$i  (tenant=Basic -> target pod)"
        done

  preview:verify-cleanup:
    desc: "Automated start/stop check for the preview split-session cleanup fix. Deploys the SQS env, starts a preview (which creates a cluster-scoped MirrordClusterSplitSession and temp SQS queues), then runs `preview stop` and asserts the split session AND the temp queues are gone. PASS = fix works; FAIL = the orphaned split session / temp queues leaked."
    dir: '{{.ROOT_DIR}}'
    vars:
      PREVIEW_KEY: '{{.PREVIEW_KEY | default "test-sqs-preview-cleanup"}}'
      PREVIEW_IMAGE: '{{.PREVIEW_IMAGE | default "sqs-consumer:local"}}'
      PREVIEW_TIMEOUT: '{{.PREVIEW_TIMEOUT | default "300"}}'
      MIRRORD_CONFIG: '{{.MIRRORD_CONFIG | default (print .ROOT_DIR "/k8s/overlays/sqs-localstack/mirrord-preview.json")}}'
      REGION: '{{.REGION | default "eu-north-1"}}'
    cmds:
      - task: deploy
      - |
        set -u
        KEY="{{.PREVIEW_KEY}}"
        NS="{{.NAMESPACE}}"
        REGION="{{.REGION}}"
        START_LOG=$(mktemp)

        temp_queue_count() {
          kubectl exec -n localstack deploy/localstack -- \
            awslocal sqs list-queues --region "$REGION" --query 'QueueUrls[]' --output text 2>/dev/null \
            | tr '\t' '\n' | grep -c mirrord || true
        }

        echo "=== starting preview env (key=$KEY, log: $START_LOG) ==="
        {{.MIRRORD_BIN}} preview start \
          -f {{.MIRRORD_CONFIG}} -i "{{.PREVIEW_IMAGE}}" -k "$KEY" \
          --timeout {{.PREVIEW_TIMEOUT}} > "$START_LOG" 2>&1 &
        START_PID=$!
        cleanup() { kill "$START_PID" 2>/dev/null || true; }
        trap cleanup EXIT

        echo "waiting for the MirrordClusterSplitSession to be created for this preview"
        SESSION=""
        for i in $(seq 1 90); do
          SESSION=$(kubectl get mirrordclustersplitsession -o json 2>/dev/null \
            | jq -r --arg ns "$NS" '.items[] | select(.spec.namespace==$ns) | .metadata.name' | head -1)
          [ -n "$SESSION" ] && break
          if ! kill -0 "$START_PID" 2>/dev/null; then
            echo "FAIL: 'preview start' exited before a split session appeared:"
            tail -n 30 "$START_LOG"
            exit 1
          fi
          sleep 2
        done
        if [ -z "$SESSION" ]; then
          echo "FAIL: no MirrordClusterSplitSession was created for the preview"
          tail -n 30 "$START_LOG"
          exit 1
        fi

        echo "-----------------------------------------------------------------"
        echo "split session created: $SESSION"
        echo "  ownerReferences: $(kubectl get mirrordclustersplitsession "$SESSION" -o jsonpath='{.metadata.ownerReferences}' 2>/dev/null)"
        echo "  preview-session-ref: $(kubectl get mirrordclustersplitsession "$SESSION" -o jsonpath='{.metadata.annotations.operator\.metalbear\.co/preview-session-ref}' 2>/dev/null)"
        TEMP_BEFORE=$(temp_queue_count)
        echo "  temp mirrord-* queues while preview is up: ${TEMP_BEFORE:-0}"
        echo "-----------------------------------------------------------------"

        echo "=== stopping preview env ==="
        {{.MIRRORD_BIN}} preview stop -k "$KEY" || true

        echo "waiting for the split session and temp queues to be cleaned up (up to 120s)"
        GONE=0
        for i in $(seq 1 60); do
          STILL=$(kubectl get mirrordclustersplitsession "$SESSION" -o name 2>/dev/null || true)
          TEMP_NOW=$(temp_queue_count)
          if [ -z "$STILL" ] && [ "${TEMP_NOW:-0}" -eq 0 ]; then
            GONE=1
            break
          fi
          sleep 2
        done

        echo "================================================================="
        if [ "$GONE" -eq 1 ]; then
          echo "PASS: after 'preview stop' the MirrordClusterSplitSession and temp SQS queues were cleaned up."
          exit 0
        fi
        echo "FAIL: cleanup did not happen within the timeout."
        echo "  split session still present: $(kubectl get mirrordclustersplitsession "$SESSION" -o name 2>/dev/null || echo none)"
        echo "  temp queues remaining:"
        kubectl exec -n localstack deploy/localstack -- \
          awslocal sqs list-queues --region "$REGION" --query 'QueueUrls[]' --output text 2>/dev/null \
          | tr '\t' '\n' | grep mirrord | sed 's#.*/#    #' || echo "    (none)"
        exit 1

  preview:clean:
    desc: "Delete SQS preview sessions and pods, then clean up any leftover split sessions and temp queues."
    cmds:
      - echo "deleting preview sessions"
      - kubectl delete previewsessions --all -n {{.NAMESPACE}} 2>/dev/null || echo "(none)"
      - echo "deleting preview pods"
      - kubectl delete pods -n {{.NAMESPACE}} -l operator.metalbear.co/managed-by=preview 2>/dev/null || echo "(none)"
      - task: split:reset

  run:local:aws:
    desc: "Run SQS consumer locally with mirrord (AWS)"
    dir: '{{.ROOT_DIR}}/apps/sqs-consumer'
    vars:
      MIRRORD_CONFIG: '{{.MIRRORD_CONFIG | default (print .ROOT_DIR "/k8s/overlays/sqs-aws/mirrord.json")}}'
    cmds:
      - echo "Building SQS consumer..."
      - go build -o /tmp/sqs-consumer main.go
      - echo "Starting mirrord with AWS SQS config..."
      - echo "Messages matching filter will be received here."
      - '{{.MIRRORD_BIN}} exec -f {{.MIRRORD_CONFIG}} -- /tmp/sqs-consumer'

  send:
    desc: "Send test message to LocalStack SQS"
    vars:
      TENANT: '{{.TENANT | default "Avi.Test"}}'
      MESSAGE: '{{.MESSAGE | default "Test message"}}'
      QUEUE_URL: '{{.QUEUE_URL | default "http://localhost:4566/000000000000/TestQueue"}}'
      REGION: '{{.REGION | default "eu-north-1"}}'
    cmds:
      - |
        POD=$(kubectl get pod -n localstack -l app.kubernetes.io/name=localstack -o jsonpath='{.items[0].metadata.name}')
        kubectl exec -n localstack $POD -- awslocal sqs send-message \
          --queue-url {{.QUEUE_URL}} \
          --region {{.REGION}} \
          --message-body '{{.MESSAGE}}' \
          --message-attributes 'tenant={StringValue={{.TENANT}},DataType=String}'

  send:aws:
    desc: "Send test message to AWS SQS WITH 'test' attribute (goes to LOCAL app)"
    vars:
      MESSAGE: '{{.MESSAGE | default "Test message for LOCAL app"}}'
      TEST_VALUE: '{{.TEST_VALUE | default "mirrord"}}'
    cmds:
      - |
        echo "Sending message with 'test={{.TEST_VALUE}}' attribute..."
        aws sqs send-message \
          --queue-url https://sqs.${AWS_REGION}.amazonaws.com/${AWS_ACCOUNT_ID}/${QUEUE_NAME} \
          --region ${AWS_REGION} \
          --message-body '{{.MESSAGE}}' \
          --message-attributes 'test={StringValue={{.TEST_VALUE}},DataType=String}' \
          --output json
        echo "Message sent! Check local terminal running 'task sqs:run:local:aws'"

  send:aws:nomatch:
    desc: "Send test message to AWS SQS WITHOUT 'test' attribute (goes to CLUSTER)"
    vars:
      MESSAGE: '{{.MESSAGE | default "Test message for CLUSTER consumer"}}'
    cmds:
      - |
        echo "Sending message WITHOUT 'test' attribute..."
        aws sqs send-message \
          --queue-url https://sqs.${AWS_REGION}.amazonaws.com/${AWS_ACCOUNT_ID}/${QUEUE_NAME} \
          --region ${AWS_REGION} \
          --message-body '{{.MESSAGE}}' \
          --output json
        echo "Message sent! Check cluster logs with 'task sqs:logs'"

  send:aws:both:
    desc: "Send two messages - one for LOCAL, one for CLUSTER"
    cmds:
      - task: send:aws
        vars: {MESSAGE: "Message 1 - for LOCAL app (has test attribute)"}
      - echo ""
      - task: send:aws:nomatch
        vars: {MESSAGE: "Message 2 - for CLUSTER (no test attribute)"}

  logs:
    desc: "Show SQS consumer logs"
    cmds:
      - kubectl logs -n {{.NAMESPACE}} -l app=sqs-consumer --tail=100 -f

  logs:localstack:
    desc: "Show LocalStack logs"
    cmds:
      - kubectl logs -n localstack -l app.kubernetes.io/name=localstack --tail=100 -f

  shell:
    desc: "Shell into SQS consumer pod"
    cmds:
      - |
        POD=$(kubectl get pod -n {{.NAMESPACE}} -l app=sqs-consumer -o jsonpath='{.items[0].metadata.name}')
        kubectl exec -it -n {{.NAMESPACE}} $POD -- sh

  shell:localstack:
    desc: "Shell into LocalStack pod"
    cmds:
      - |
        POD=$(kubectl get pod -n localstack -l app.kubernetes.io/name=localstack -o jsonpath='{.items[0].metadata.name}')
        kubectl exec -it -n localstack $POD -- bash

  status:
    desc: "Show SQS test environment status"
    cmds:
      - echo "=== SQS Consumer ==="
      - kubectl get pods -n {{.NAMESPACE}} -l app=sqs-consumer 2>/dev/null || echo "Not deployed"
      - echo ""
      - echo "=== LocalStack ==="
      - kubectl get pods -n localstack -l app.kubernetes.io/name=localstack 2>/dev/null || echo "Not deployed"
      - echo ""
      - echo "=== Queue Registry ==="
      - kubectl get mirrordworkloadqueueregistries -n {{.NAMESPACE}} 2>/dev/null || echo "No registry"

  status:aws:
    desc: "Show AWS SQS test status"
    cmds:
      - echo "=== Pods in {{.NAMESPACE}} ==="
      - kubectl get pods -n {{.NAMESPACE}}
      - echo ""
      - echo "=== Operator pods ==="
      - kubectl get pods -n mirrord
      - echo ""
      - echo "=== Queue Registry ==="
      - kubectl get mirrordworkloadqueueregistries -n {{.NAMESPACE}} -o yaml 2>/dev/null || echo "No registry"
      - echo ""
      - echo "=== AWS SQS Queue ==="
      - aws sqs get-queue-attributes --queue-url https://sqs.${AWS_REGION}.amazonaws.com/${AWS_ACCOUNT_ID}/${QUEUE_NAME} --region ${AWS_REGION} --attribute-names ApproximateNumberOfMessages ApproximateNumberOfMessagesNotVisible 2>/dev/null || echo "Could not fetch"

  registry:
    desc: "Show queue registry details"
    cmds:
      - kubectl get mirrordworkloadqueueregistries -n {{.NAMESPACE}} -o yaml

  describe:
    desc: "Describe SQS consumer pod"
    cmds:
      - kubectl describe pod -n {{.NAMESPACE}} -l app=sqs-consumer

  clean:
    desc: "Clean SQS LocalStack test resources"
    cmds:
      - kubectl delete -k {{.ROOT_DIR}}/k8s/overlays/sqs-localstack --ignore-not-found=true
      - kubectl delete namespace localstack --ignore-not-found=true

  clean:aws:
    desc: "Clean SQS AWS test resources"
    cmds:
      - kubectl delete -k {{.ROOT_DIR}}/k8s/overlays/sqs-aws --ignore-not-found=true

  _wait:localstack:
    internal: true
    cmds:
      - echo "Waiting for LocalStack..."
      - kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=localstack -n localstack --timeout=120s

  _wait:consumer:
    internal: true
    cmds:
      - echo "Waiting for SQS consumer..."
      - kubectl wait --for=condition=ready pod -l app=sqs-consumer -n {{.NAMESPACE}} --timeout=120s

  _patch:operator:aws:
    internal: true
    cmds:
      - |
        envsubst < {{.ROOT_DIR}}/k8s/overlays/sqs-aws/operator-patch.yaml | \
          kubectl patch deployment mirrord-operator -n mirrord --patch-file /dev/stdin --type=strategic || true
      - kubectl rollout status deployment/mirrord-operator -n mirrord --timeout=120s || true

  # =============================================================================
  # SQS Split Testing Tasks (for investigating stale filter issues)
  # =============================================================================

  test:split:
    desc: "Test SQS splitting - start local consumer, send filtered messages"
    vars:
      MIRRORD_CONFIG: '{{.MIRRORD_CONFIG | default (print .ROOT_DIR "/k8s/overlays/sqs-localstack/mirrord.json")}}'
    cmds:
      - echo "=== SQS Split Test (bearkube) ==="
      - echo ""
      - echo "This starts a local consumer with SQS filter and tests message routing"
      - echo ""
      - |
        # Build the consumer
        cd {{.ROOT_DIR}}/apps/sqs-consumer
        go build -o /tmp/sqs-consumer main.go 2>/dev/null || echo "Build may have failed"
        
        export AWS_ACCESS_KEY_ID=test
        export AWS_SECRET_ACCESS_KEY=test
        export AWS_REGION=eu-north-1
        export QUEUE_NAME=test-queue
        
        echo "Running local SQS consumer with mirrord..."
        {{.MIRRORD_BIN}} exec -f {{.MIRRORD_CONFIG}} -- /tmp/sqs-consumer

  test:split:send:
    desc: "Send filtered and unfiltered messages: task sqs:test:split:send FILTERED=5 UNFILTERED=2"
    vars:
      FILTERED: '{{.FILTERED | default "3"}}'
      UNFILTERED: '{{.UNFILTERED | default "2"}}'
      QUEUE_URL: 'http://localhost:4566/000000000000/test-queue'
    cmds:
      - |
        echo "=== Sending messages for SQS Split Test ==="
        echo "Sending {{.FILTERED}} filtered (tenant=Avi.Test) + {{.UNFILTERED}} unfiltered (tenant=Basic) messages..."
        echo ""
        
        # Send filtered messages (tenant=Avi.* - will be split to local app)
        for i in $(seq 1 {{.FILTERED}}); do
          kubectl exec -n localstack deploy/localstack -- \
            awslocal sqs send-message \
              --queue-url {{.QUEUE_URL}} \
              --message-body "{\"order\": \"ORD-F$i\", \"amount\": \"$((RANDOM % 1000)).99\", \"type\": \"premium\"}" \
              --message-attributes '{"tenant":{"DataType":"String","StringValue":"Avi.Test"}}' \
              2>/dev/null | jq -r '"FILTERED: " + .MessageId' || echo "FILTERED: failed"
        done
        
        # Send unfiltered messages (tenant=Basic - stays in original queue)
        for i in $(seq 1 {{.UNFILTERED}}); do
          kubectl exec -n localstack deploy/localstack -- \
            awslocal sqs send-message \
              --queue-url {{.QUEUE_URL}} \
              --message-body "{\"order\": \"ORD-U$i\", \"amount\": \"$((RANDOM % 100)).99\", \"type\": \"basic\"}" \
              --message-attributes '{"tenant":{"DataType":"String","StringValue":"Basic"}}' \
              2>/dev/null | jq -r '"UNFILTERED: " + .MessageId' || echo "UNFILTERED: failed"
        done
        
        echo ""
        echo "Done! Sent {{.FILTERED}} filtered + {{.UNFILTERED}} unfiltered = $(({{.FILTERED}} + {{.UNFILTERED}})) total"

  test:split:status:
    desc: "Show SQS session and queue status"
    cmds:
      - echo "=== MirrordClusterSession ==="
      - kubectl get mirrordclustersession -n mirrord 2>/dev/null || echo "(none)"
      - echo ""
      - echo "=== MirrordSqsSession ==="
      - kubectl get mirrordsqssession -n mirrord 2>/dev/null || echo "(none)"
      - echo ""
      - echo "=== Queue Status ==="
      - |
        echo "Main queue (test-queue):"
        kubectl exec -n localstack deploy/localstack -- \
          awslocal sqs get-queue-attributes \
            --queue-url http://localhost:4566/000000000000/test-queue \
            --attribute-names ApproximateNumberOfMessages \
            --output json 2>/dev/null | jq -r '.Attributes.ApproximateNumberOfMessages + " messages"' || echo "  (error)"
      - |
        echo ""
        echo "Temp queues (mirrord-*):"
        kubectl exec -n localstack deploy/localstack -- \
          awslocal sqs list-queues --output json 2>&1 | jq -r '.QueueUrls[]' | grep mirrord | while read queue; do
            count=$(kubectl exec -n localstack deploy/localstack -- \
              awslocal sqs get-queue-attributes --queue-url "$queue" \
                --attribute-names ApproximateNumberOfMessages --output json 2>/dev/null | jq -r '.Attributes.ApproximateNumberOfMessages')
            echo "  $(basename $queue): $count messages"
          done || echo "  (none)"

  test:split:cleanup:
    desc: "Clean up all SQS sessions and temp queues"
    cmds:
      - echo "=== Cleaning up sessions ==="
      - kubectl delete mirrordclustersession --all -n mirrord 2>/dev/null || echo "(none to delete)"
      - echo ""
      - echo "=== Purging main queue ==="
      - kubectl exec -n localstack deploy/localstack -- awslocal sqs purge-queue --queue-url http://localhost:4566/000000000000/test-queue 2>/dev/null || echo "(already empty)"
      - echo ""
      - echo "=== Deleting temp queues ==="
      - |
        kubectl exec -n localstack deploy/localstack -- \
          awslocal sqs list-queues --output json 2>&1 | jq -r '.QueueUrls[]' | grep mirrord | while read queue; do
            echo "Deleting: $(basename $queue)"
            kubectl exec -n localstack deploy/localstack -- awslocal sqs delete-queue --queue-url "$queue" 2>/dev/null || true
          done || echo "(none)"
      - echo ""
      - echo "Cleanup complete!"

  test:reconnect:
    desc: "Test fast disconnect/reconnect SQS behavior (runs full test script)"
    cmds:
      - |
        echo "=== SQS Fast Reconnect Test ==="
        echo ""
        echo "This test verifies what happens when:"
        echo "1. Session 1 starts with SQS filter"
        echo "2. Session 1 disconnects"
        echo "3. Session 2 immediately starts with same filter"
        echo "4. Messages are sent - which session receives them?"
        echo ""
        
        # Clean up first
        kubectl delete mirrordclustersession --all -n mirrord 2>/dev/null || true
        kubectl exec -n localstack deploy/localstack -- awslocal sqs purge-queue --queue-url http://localhost:4566/000000000000/test-queue 2>/dev/null || true
        
        # Build consumer
        cd {{.ROOT_DIR}}/apps/sqs-consumer
        go build -o /tmp/sqs-consumer main.go
        
        export AWS_ACCESS_KEY_ID=test
        export AWS_SECRET_ACCESS_KEY=test
        export AWS_REGION=eu-north-1
        export QUEUE_NAME=test-queue
        
        MIRRORD_CONFIG="{{.ROOT_DIR}}/k8s/overlays/sqs-localstack/mirrord.json"
        SESSION1_LOG="/tmp/sqs-session1.log"
        SESSION2_LOG="/tmp/sqs-session2.log"
        
        echo "=== Step 1: Start Session 1 ==="
        {{.MIRRORD_BIN}} exec -f $MIRRORD_CONFIG -- /tmp/sqs-consumer > $SESSION1_LOG 2>&1 &
        SESSION1_PID=$!
        echo "Session 1 PID: $SESSION1_PID"
        sleep 10
        
        if ! kill -0 $SESSION1_PID 2>/dev/null; then
          echo "ERROR: Session 1 died"
          cat $SESSION1_LOG
          exit 1
        fi
        
        echo "=== Step 2: Send message to Session 1 ==="
        kubectl exec -n localstack deploy/localstack -- \
          awslocal sqs send-message \
            --queue-url http://localhost:4566/000000000000/test-queue \
            --message-body '{"msg": "session1-test"}' \
            --message-attributes '{"tenant":{"DataType":"String","StringValue":"Avi.Test"}}' 2>/dev/null | jq -r '.MessageId'
        sleep 3
        echo "Session 1 log tail:"
        tail -5 $SESSION1_LOG
        
        echo ""
        echo "=== Step 3: Kill Session 1 ==="
        kill $SESSION1_PID 2>/dev/null || true
        wait $SESSION1_PID 2>/dev/null || true
        echo "Session 1 terminated"
        
        echo ""
        echo "=== Step 4: Immediately start Session 2 ==="
        {{.MIRRORD_BIN}} exec -f $MIRRORD_CONFIG -- /tmp/sqs-consumer > $SESSION2_LOG 2>&1 &
        SESSION2_PID=$!
        echo "Session 2 PID: $SESSION2_PID"
        sleep 10
        
        if ! kill -0 $SESSION2_PID 2>/dev/null; then
          echo "ERROR: Session 2 died"
          cat $SESSION2_LOG
          exit 1
        fi
        
        echo ""
        echo "=== Step 5: Send 3 messages ==="
        for i in 1 2 3; do
          kubectl exec -n localstack deploy/localstack -- \
            awslocal sqs send-message \
              --queue-url http://localhost:4566/000000000000/test-queue \
              --message-body "{\"msg\": \"after-reconnect-$i\"}" \
              --message-attributes '{"tenant":{"DataType":"String","StringValue":"Avi.Test"}}' 2>/dev/null | jq -r "\"Message $i: \" + .MessageId"
          sleep 1
        done
        
        echo "Waiting 10s for processing..."
        sleep 10
        
        echo ""
        echo "=== Results ==="
        echo ""
        echo "--- Session 1 Log ---"
        cat $SESSION1_LOG
        echo ""
        echo "--- Session 2 Log ---"
        cat $SESSION2_LOG
        echo ""
        
        SESSION1_COUNT=$(grep -c "\[MSG #" $SESSION1_LOG 2>/dev/null || echo "0")
        SESSION2_COUNT=$(grep -c "\[MSG #" $SESSION2_LOG 2>/dev/null || echo "0")
        
        echo "=== Summary ==="
        echo "Session 1 received: $SESSION1_COUNT messages (expected: 1)"
        echo "Session 2 received: $SESSION2_COUNT messages (expected: 3)"
        echo ""
        
        if [ "$SESSION2_COUNT" -lt 3 ]; then
          echo "WARNING: Session 2 missed messages! This indicates stale filter issue."
        else
          echo "SUCCESS: Session 2 received all messages."
        fi
        
        echo ""
        echo "=== Stale Sessions ==="
        kubectl get mirrordclustersession -n mirrord 2>/dev/null || echo "(none)"
        
        kill $SESSION2_PID 2>/dev/null || true
        echo ""
        echo "Test complete!"

  test:live-upgrade:
    desc: "Test a live session surviving an operator change. MODE=both|upgrade|restart OLD_VERSION=3.165.0 RESTORE_TAG=latest"
    vars:
      MODE: '{{.MODE | default "both"}}'
      OLD_VERSION: '{{.OLD_VERSION | default ""}}'
      RESTORE_TAG: '{{.RESTORE_TAG | default "latest"}}'
    cmds:
      - |
        MODE="{{.MODE}}" \
        OLD_VERSION="{{.OLD_VERSION}}" \
        RESTORE_TAG="{{.RESTORE_TAG}}" \
        MIRRORD_BIN="${MIRRORD_BIN:-{{.MIRRORD_BIN}}}" \
        RELEASE_LICENSE_KEY="${RELEASE_LICENSE_KEY:-}" \
        bash {{.ROOT_DIR}}/scripts/test-live-operator-upgrade.sh

  queue:list:
    desc: "List all SQS queues in LocalStack"
    cmds:
      - echo "=== All SQS Queues ==="
      - kubectl exec -n localstack deploy/localstack -- awslocal sqs list-queues --output json 2>&1 | jq -r '.QueueUrls[]' || echo "(none)"

  queue:purge:
    desc: "Purge the main test-queue"
    cmds:
      - kubectl exec -n localstack deploy/localstack -- awslocal sqs purge-queue --queue-url http://localhost:4566/000000000000/test-queue
      - echo "Queue purged"

  queue:receive:
    desc: "Receive and show messages from test-queue (for debugging)"
    vars:
      MAX_MESSAGES: '{{.MAX_MESSAGES | default "10"}}'
    cmds:
      - |
        echo "=== Receiving up to {{.MAX_MESSAGES}} messages ==="
        kubectl exec -n localstack deploy/localstack -- \
          awslocal sqs receive-message \
            --queue-url http://localhost:4566/000000000000/test-queue \
            --max-number-of-messages {{.MAX_MESSAGES}} \
            --message-attribute-names All \
            --output json 2>&1 | jq '.'
