# mirrord config for running a locally-built operator-service against the
# local sandbox cluster, stealing traffic from the deployed mirrord-operator.
#
# Same idea as operator/.mirrord/operator.yaml (staging), simplified for the
# single-user local cluster: no baggage/http_filter session keying — we just
# steal everything the deployed operator receives.
#
# Run it via `task operator:dev`, or manually from ../operator:
#   MIRRORD_CHECK_VERSION=false mirrord exec \
#     -f ../local-sandbox/.mirrord/operator-dev.yaml -- cargo run -p operator-service

# The session that replaces the operator must not itself go through the operator.
operator: false

# So you can run `mirrord exec -- cargo run` on the operator-service.
skip_extra_build_tools:
  - cargo

skip_sip:
  - operator-service

target:
  path: deployment/mirrord-operator
  namespace: mirrord

agent:
  log_level: "mirrord=debug"
  image: test
  image_pull_policy: Never
  namespace: mirrord
  clean_iptables_on_start: true

feature:
  network:
    incoming: steal
  fs:
    mode: read
    read_only:
      # Only the pod's service-account files — NOT bare "/var.+": the fs filter
      # checks read_only BEFORE local, and on macOS the operator writes remote
      # cluster tokens under /var/folders/... which must stay local.
      - "^/var/run.+"
      - "^/mirrord.+"
    # Read the sandbox's local config files from the LOCAL disk instead of the deployed
    # pod (used for the generic branch pod config below).
    local:
      - ".*/local-sandbox/configs/.*"
      # macOS temp dir where the operator writes remote-cluster token files.
      # Both forms: the layer may canonicalize /var -> /private/var, and
      # mirrord's built-in default-local set only covers ^/var/folders.
      - "/var/folders/.*"
      - "/private/var/folders/.*"
  env:
    override:
      RUST_LOG: "operator_service=info,mirrord=info,operator_pod_mutator=debug,operator_queue_splitting=debug,operator_preview_env=debug"

      # The sandbox offline license (scripts/generate-license.sh output, copied into
      # configs/ so the fs `local` pattern serves it from this repo). The inherited
      # OPERATOR_LICENSE_KEY is an online key that expired in Aug 2026; a file path
      # outranks the key, so the local operator runs on this instead. Requires a
      # binary that trusts the sandbox issuer - run
      #   SANDBOX_LICENSE=1 OPERATOR_LICENSE_ISSUER_PUBLIC_KEY="$(cat scripts/license-issuer.pem)" task operator:dev
      # so cargo bakes the issuer in at build time (plain `task operator:dev` exports
      # it only after the build, which is too late for option_env!).
      OPERATOR_LICENSE_PATH: "../local-sandbox/configs/company-license.pem"

      # Feature flags for the LOCAL operator. The base env is inherited from
      # the deployed operator pod, so a flag the deployed chart doesn't render
      # (e.g. a feature you're developing that isn't released yet) is missing
      # there — force it here. Full list of OPERATOR_* flags:
      # operator/crates/operator-proxy/src/config.rs
      OPERATOR_GENERIC_BRANCHING: "true"
      OPERATOR_PG_BRANCHING: "true"
      # S3 bucket branching (task s3:test). No branch pod and no init binaries,
      # so no image concerns - the operator clones buckets itself against the
      # LocalStack endpoint it inherits from the deployed pod's AWS env.
      OPERATOR_S3_BRANCHING: "true"
      # Shrink the external-resources GC poll from 60s so the cleanup phase of
      # branching tests finishes in seconds instead of minutes.
      OPERATOR_DYNAMIC_OWNER_CHECK_SECONDS: "10"
      # Close sessions whose client is gone after 15s instead of the default 30s
      # (real config knob, clamped to a 6s floor). Speeds up the cleanup phase
      # of branching tests; harmless for dev sessions on a local cluster.
      OPERATOR_SESSION_UNUSED_TTL_SECONDS: "15"
      OPERATOR_KAFKA_SPLITTING: "true"
      OPERATOR_NATS_SPLITTING: "true"
      OPERATOR_NATS_PUBSUB_SPLITTING: "true"
      # Share hosts for preview sessions (task preview:test:share). The domain doesn't
      # need to resolve: minting and the baggage-arm steal are what the sandbox verifies,
      # no mirrord-share-ingress deployment involved.
      OPERATOR_SHARE_INGRESS_SHARE_DOMAIN: "preview.sandbox.local"
      # Hosts are minted as <key>.<domain> with no random suffix (task
      # preview:test:stable-slugs); preview:share:verify only checks a host exists, so
      # it passes either way.
      OPERATOR_SHARE_INGRESS_STABLE_SLUGS: "true"
      # Branch pod config for generic branches (resources: JVM services like OpenSearch OOM
      # on the 512Mi default). This is a LOCAL file - the fs `local` pattern above makes the
      # operator read it from this repo instead of the deployed pod, so it's versioned here
      # and hot-reloads (the operator re-reads it every 60s).
      # Relative to ../operator: operator:dev runs the binary from there, so this
      # stays portable across machines (standard sibling-repo layout).
      OPERATOR_GENERIC_BRANCH_CONFIG: "../local-sandbox/configs/generic-branch-config.yaml"
      OPERATOR_REDIS_BRANCHING: "true"
      # Redis branch pod config for the TLS demo. Swapped between the plain and TLS
      # variants by task redis:tls:enable / redis:tls:disable (hot-reloaded).
      OPERATOR_REDIS_BRANCH_CONFIG: "../local-sandbox/configs/redis-branch-config.yaml"
      # PostgreSQL branch pod config for the roles demo. Swapped between the empty and
      # full variants by task postgres:roles:full / postgres:roles:empty (hot-reloaded).
      OPERATOR_PG_BRANCH_CONFIG: "../local-sandbox/configs/pg-branch-config.yaml"
      # # OPERATOR_DYNAMODB_BRANCHING: "true"
      # OPERATOR_CLICKHOUSE_BRANCHING: "true"

      # Branch pods copy their init binaries (pg-branch-init & co.) out of
      # OPERATOR_IMAGE. Left unset, the session inherits the deployed pod's value, the
      # RELEASED image that `task operator:use` installed - already on the node, no build.
      # That is right whenever the local branch does not touch the init binaries
      # (crates/operator-db-branching/src/bin/*-branch-init.rs). When it does, the
      # released binaries lack the new flags, so point branch pods at a local build:
      # `task redis:tls:build:init-image` builds an init-binaries-only image and loads it
      # into minikube (no registry), or `task operator:image:push` builds the full image.
      # A local image goes stale silently: check its `docker images` date against the
      # last commit on the init binaries before trusting it.
      # OPERATOR_IMAGE: "mirrord-branch-init:local"
      # OPERATOR_IMAGE_PULL_POLICY: "Never"
      # OPERATOR_IMAGE: "vrrashkov/operator:local"
      # OPERATOR_IMAGE_PULL_POLICY: "Always"
