version: "3"

# Minikube cluster lifecycle.

vars:
  CLUSTER_NAME: '{{.CLUSTER_NAME | default "bearkube"}}'
  CONTAINER_RUNTIME: '{{.CONTAINER_RUNTIME | default "docker"}}'

tasks:
  create:
    desc: Create (or start) the minikube cluster and point kubectl at it
    cmds:
      - task: _reap-test-containers
      - minikube -p {{.CLUSTER_NAME}} start --driver={{.CONTAINER_RUNTIME}}
      - minikube -p {{.CLUSTER_NAME}} addons enable metrics-server
      - kubectl config use-context {{.CLUSTER_NAME}}

  start:
    desc: Start the cluster only if it is stopped (no-op when running)
    silent: true
    cmds:
      - task: _reap-test-containers
      - |
        if minikube -p {{.CLUSTER_NAME}} status 2>/dev/null | grep -q 'host: Running'; then
          kubectl config use-context {{.CLUSTER_NAME}} 2>/dev/null || true
          echo "Cluster '{{.CLUSTER_NAME}}' is already running."
          exit 0
        fi
        echo "Starting minikube profile '{{.CLUSTER_NAME}}'..."
        minikube -p {{.CLUSTER_NAME}} start --driver={{.CONTAINER_RUNTIME}}
        kubectl config use-context {{.CLUSTER_NAME}}

  # Interrupted `cargo test` runs in ../operator leak testcontainers fixtures
  # (redis, GCP Pub/Sub emulators, ...). A few dozen of them exhaust the Docker
  # VM's memory and everything degrades at once: kubectl gets TLS handshake
  # timeouts, brokers miss liveness probes, split forwarders die. Reaping them
  # before touching the cluster keeps the environment known-good.
  _reap-test-containers:
    internal: true
    silent: true
    cmds:
      - |
        removed=0
        # Anything testcontainers started is fair game, whatever the image.
        ids=$(docker ps -aq --filter label=org.testcontainers=true 2>/dev/null)
        if [ -n "$ids" ]; then
          removed=$((removed + $(echo "$ids" | wc -l | tr -d ' ')))
          docker rm -f $ids >/dev/null 2>&1 || true
        fi
        # Images that only ever run as ephemeral test fixtures in this workspace.
        for image in redis:7-alpine gcr.io/google.com/cloudsdktool/cloud-sdk:emulators \
          rabbitmq:3-management localstack/localstack testcontainers/ryuk; do
          ids=$(docker ps -aq --filter "ancestor=$image" 2>/dev/null)
          if [ -n "$ids" ]; then
            removed=$((removed + $(echo "$ids" | wc -l | tr -d ' ')))
            docker rm -f $ids >/dev/null 2>&1 || true
          fi
        done
        if [ "$removed" -gt 0 ]; then
          printf '\033[1;33m%s\033[0m\n' "reaped $removed leaked test container(s) (testcontainers fixtures from interrupted cargo test runs)"
        fi

  delete:
    desc: Delete the minikube cluster
    cmds:
      - minikube -p {{.CLUSTER_NAME}} delete

  status:
    desc: Show cluster status and nodes
    cmds:
      - minikube -p {{.CLUSTER_NAME}} status || true
      - kubectl get nodes 2>/dev/null || true
