version: "3"

# Temporal task-queue splitting.
#
#   task temporal:deploy         deploy Temporal server + UI + cluster worker + split CRDs
#   task temporal:run:local      run the worker locally under mirrord (starts the split)
#   task temporal:send:match     workflow id test-alice-*  -> your local session
#   task temporal:send:nomatch   workflow id test-other-*  -> cluster worker
#
# The split filter lives in k8s/overlays/temporal/mirrord.json
# (workflow_id matching ^test-alice-). Workflows are started via tctl inside
# the temporal server pod; MESSAGE becomes the CheckoutWorkflow input.
#
# mTLS (operator -> Temporal with client certificates):
#
#   task temporal:mtls:deploy    put a client-cert-requiring nginx front in
#                                front of the Temporal frontend and point the
#                                operator's connection config at it
#   task temporal:mtls:verify    handshake checks: rejected without a client
#                                cert, verified with one
#   task temporal:mtls:disable   point the operator back at the plain frontend
#
# After mtls:deploy, run the normal flow (run:local + send:match/nomatch);
# every operator poll and forward then goes through the mTLS front. Splits
# resolve the connection config when they start, so restart run:local after
# switching modes.

vars:
  ROOT_DIR:
    sh: git rev-parse --show-toplevel
  NAMESPACE: '{{.NAMESPACE | default "test-mirrord"}}'
  CLUSTER_NAME: '{{.CLUSTER_NAME | default "bearkube"}}'
  CONTAINER_RUNTIME: '{{.CONTAINER_RUNTIME | default "docker"}}'
  MIRRORD_BIN: '{{.MIRRORD_BIN | default "mirrord"}}'
  APP_DIR: '{{.ROOT_DIR}}/apps/temporal-worker'
  OVERLAY: '{{.ROOT_DIR}}/k8s/overlays/temporal'
  CHARTS_DIR: '{{.ROOT_DIR}}/../operator/public/charts/mirrord-operator'
  TEMPORAL_MIRRORD_CONFIG: '{{.TEMPORAL_MIRRORD_CONFIG | default (print .ROOT_DIR "/k8s/overlays/temporal/mirrord.json")}}'
  # Overridable via TEMPORAL_TASK_QUEUE / TEMPORAL_NS in .env (module-prefixed
  # names so they can't collide with other modules' globals).
  TEMPORAL_NAMESPACE: "temporal"
  TEMPORAL_ADDRESS: "temporal-frontend.temporal.svc.cluster.local:7233"
  TEMPORAL_NS: '{{.TEMPORAL_NS | default "temporal"}}'
  TASK_QUEUE: '{{.TEMPORAL_TASK_QUEUE | default "order-checkout"}}'
  MTLS_CERTS_DIR: "{{.ROOT_DIR}}/.certs/temporal-mtls"

tasks:
  deploy:
    desc: Deploy the Temporal test env (server + UI + worker + split CRDs)
    cmds:
      - "{{.CONTAINER_RUNTIME}} build -t temporal-worker:local {{.APP_DIR}}"
      - minikube -p {{.CLUSTER_NAME}} image load temporal-worker:local
      - kubectl create namespace {{.NAMESPACE}} --dry-run=client -o yaml | kubectl apply -f -
      - kubectl create namespace {{.TEMPORAL_NAMESPACE}} --dry-run=client -o yaml | kubectl apply -f -
      - kubectl apply -f {{.OVERLAY}}/namespace.yaml
      - kubectl apply -f {{.OVERLAY}}/temporal-server.yaml
      - task: _wait:server
      - task: _register:namespace
      - kubectl apply -f {{.OVERLAY}}/temporal-ui.yaml
      - task: _wait:ui
      - kubectl apply -f {{.OVERLAY}}/worker.yaml
      - task: _wait:worker
      - task: _apply:split-crds
      - kubectl apply -f {{.OVERLAY}}/property-list.yaml
      - kubectl apply -f {{.OVERLAY}}/split-config.yaml

  run:local:
    desc: Run the worker locally under mirrord (starts task-queue splitting; Ctrl-C to stop)
    interactive: true
    dir: apps/temporal-worker
    cmds:
      - go build -o /tmp/temporal-worker main.go
      - "{{.MIRRORD_BIN}} exec -f {{.TEMPORAL_MIRRORD_CONFIG}} -- /tmp/temporal-worker"

  send:match:
    desc: 'Start a workflow matching the split filter -> local session (MESSAGE=...)'
    cmds:
      - task: send
        vars:
          PREFIX: "test-alice-"
          MESSAGE: '{{.MESSAGE | default "match: hello local session"}}'

  send:nomatch:
    desc: 'Start a workflow NOT matching the filter -> cluster worker (MESSAGE=...)'
    cmds:
      - task: send
        vars:
          PREFIX: "test-other-"
          MESSAGE: '{{.MESSAGE | default "nomatch: hello cluster worker"}}'

  send:
    desc: 'Start a workflow with explicit routing (PREFIX=... MESSAGE=...)'
    silent: true
    vars:
      PREFIX: '{{.PREFIX | default "test-alice-"}}'
      MESSAGE: '{{.MESSAGE | default "Test message"}}'
    cmds:
      - |
        WF_ID="{{.PREFIX}}$(date +%s)"
        INPUT=$(printf '%s' "{{.MESSAGE}}" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')
        POD_IP=$(kubectl get pod -n {{.TEMPORAL_NAMESPACE}} -l app=temporal -o jsonpath='{.items[0].status.podIP}')
        kubectl exec -n {{.TEMPORAL_NAMESPACE}} deploy/temporal -- \
          tctl --address "${POD_IP}:7233" --namespace {{.TEMPORAL_NS}} workflow start \
            --taskqueue {{.TASK_QUEUE}} \
            --workflow_type CheckoutWorkflow \
            --workflow_id "$WF_ID" \
            --input "$INPUT" >/dev/null
        case "$WF_ID" in
          test-alice-*) echo "started CheckoutWorkflow $WF_ID input='{{.MESSAGE}}' (-> local session)";;
          *)            echo "started CheckoutWorkflow $WF_ID input='{{.MESSAGE}}' (-> stays in cluster)";;
        esac

  mtls:deploy:
    desc: Front Temporal with an mTLS nginx proxy and point the operator at it
    preconditions:
      - sh: kubectl get deploy/temporal -n {{.TEMPORAL_NAMESPACE}} >/dev/null 2>&1
        msg: "Temporal test env not deployed. Run `task temporal:deploy` first."
    cmds:
      - "{{.ROOT_DIR}}/scripts/temporal-mtls-certs.sh {{.MTLS_CERTS_DIR}}"
      - |
        kubectl create secret generic temporal-mtls-server -n {{.TEMPORAL_NAMESPACE}} \
          --from-file=tls.crt={{.MTLS_CERTS_DIR}}/server.crt \
          --from-file=tls.key={{.MTLS_CERTS_DIR}}/server.key \
          --from-file=ca.crt={{.MTLS_CERTS_DIR}}/ca.crt \
          --dry-run=client -o yaml | kubectl apply -f -
      - |
        kubectl create secret generic temporal-mtls-client -n {{.NAMESPACE}} \
          --from-file=ca.crt={{.MTLS_CERTS_DIR}}/ca.crt \
          --from-file=tls.crt={{.MTLS_CERTS_DIR}}/client.crt \
          --from-file=tls.key={{.MTLS_CERTS_DIR}}/client.key \
          --dry-run=client -o yaml | kubectl apply -f -
      - kubectl apply -f {{.OVERLAY}}/temporal-mtls-front.yaml
      # Restart so a re-run with regenerated certs picks up the new secret.
      - kubectl rollout restart deploy/temporal-mtls -n {{.TEMPORAL_NAMESPACE}}
      - kubectl rollout status deploy/temporal-mtls -n {{.TEMPORAL_NAMESPACE}} --timeout=120s
      - kubectl apply -f {{.OVERLAY}}/property-list-mtls.yaml
      - echo "Operator now reaches Temporal through the mTLS front. Restart temporal:run:local if a split is active."

  mtls:disable:
    desc: Point the operator back at the plain Temporal frontend
    cmds:
      - kubectl apply -f {{.OVERLAY}}/property-list.yaml
      - echo "Operator back on the plaintext frontend. Restart temporal:run:local if a split is active."

  mtls:verify:
    desc: Check the front rejects requests without the client cert and accepts them with it
    silent: true
    cmds:
      - |
        set -e
        PORT=17233

        # A stale port-forward from an earlier run (or a crashed one whose
        # trap never fired) keeps the port bound and silently swallows the new
        # forward, so every probe returns 000. Clear the port first.
        lsof -ti tcp:${PORT} 2>/dev/null | xargs kill 2>/dev/null || true
        sleep 1
        kubectl port-forward -n {{.TEMPORAL_NAMESPACE}} svc/temporal-mtls ${PORT}:7233 >/dev/null 2>&1 &
        PF_PID=$!
        trap "kill $PF_PID 2>/dev/null" EXIT

        # The with-cert probe doubles as the readiness gate for the forward:
        # retry until nginx answers instead of trusting a fixed sleep.
        WITH_CERT="000"
        for _ in $(seq 1 20); do
          WITH_CERT=$(curl -s --max-time 3 --http2-prior-knowledge "https://localhost:${PORT}/" \
            --cacert {{.MTLS_CERTS_DIR}}/ca.crt \
            --cert {{.MTLS_CERTS_DIR}}/client.crt \
            --key {{.MTLS_CERTS_DIR}}/client.key -o /dev/null -w "%{http_code}" || true)
          [ -n "$WITH_CERT" ] && [ "$WITH_CERT" != "000" ] && break
          sleep 0.5
        done
        case "$WITH_CERT" in
          400|000|"")
            echo "FAIL: connection with the client cert was rejected (HTTP ${WITH_CERT:-handshake failure})"
            echo "      (is the mTLS front healthy? kubectl get pods -n {{.TEMPORAL_NAMESPACE}} -l app=temporal-mtls)"
            exit 1;;
          *)
            echo "OK: connection WITH the client cert reaches the gRPC front (HTTP ${WITH_CERT})";;
        esac

        # Under TLS 1.3 nginx cannot abort the handshake for a missing client
        # cert; it rejects the request instead with HTTP 400 ("No required SSL
        # certificate was sent"). curl reports 000 when the handshake itself
        # fails (TLS 1.2 path), so both count as rejected. The forward is known
        # to be up at this point, so 000 here cannot mean "not reachable".
        NO_CERT=$(curl -s --max-time 3 --http2-prior-knowledge "https://localhost:${PORT}/" \
          --cacert {{.MTLS_CERTS_DIR}}/ca.crt -o /dev/null -w "%{http_code}" || true)
        case "$NO_CERT" in
          400|000|"")
            echo "OK: connection WITHOUT a client cert is rejected (HTTP ${NO_CERT:-handshake failure})";;
          *)
            echo "FAIL: expected rejection without a client cert, got HTTP ${NO_CERT}"; exit 1;;
        esac
        echo ""
        echo "Full end-to-end: task temporal:run:local + task temporal:send:match"

  logs:
    desc: Tail the cluster worker logs
    cmds:
      - kubectl logs -n {{.NAMESPACE}} -l app=temporal-worker --tail=100 -f

  logs:server:
    desc: Tail the Temporal server logs
    cmds:
      - kubectl logs -n {{.TEMPORAL_NAMESPACE}} -l app=temporal --tail=100 -f

  status:
    desc: Show worker, Temporal server and split state
    silent: true
    cmds:
      - echo "=== worker ==="
      - kubectl get pods -n {{.NAMESPACE}} -l app=temporal-worker 2>/dev/null || echo "not deployed"
      - echo ""
      - echo "=== temporal server ==="
      - kubectl get pods -n {{.TEMPORAL_NAMESPACE}} -l app=temporal 2>/dev/null || echo "not deployed"
      - echo ""
      - echo "=== split config ==="
      - kubectl get mirrordsplitconfigs -n {{.NAMESPACE}} 2>/dev/null || echo "none"
      - echo ""
      - echo "=== split sessions ==="
      - kubectl get mirrordclustersplitsession -A 2>/dev/null || echo "none"

  clean:
    desc: Remove the Temporal test env from the cluster
    cmds:
      - kubectl delete mirrordclustersplitsessions --all -A 2>/dev/null || true
      - kubectl delete mirrordclusterworkloadpatchrequests --all -A 2>/dev/null || true
      - kubectl delete -f {{.OVERLAY}}/split-config.yaml --ignore-not-found=true 2>/dev/null || true
      - kubectl delete -f {{.OVERLAY}}/property-list.yaml --ignore-not-found=true 2>/dev/null || true
      - kubectl delete -f {{.OVERLAY}}/temporal-mtls-front.yaml --ignore-not-found=true 2>/dev/null || true
      - kubectl delete secret temporal-mtls-server -n {{.TEMPORAL_NAMESPACE}} --ignore-not-found=true 2>/dev/null || true
      - kubectl delete secret temporal-mtls-client -n {{.NAMESPACE}} --ignore-not-found=true 2>/dev/null || true
      - kubectl delete -f {{.OVERLAY}}/worker.yaml --ignore-not-found=true 2>/dev/null || true
      - kubectl delete -f {{.OVERLAY}}/temporal-ui.yaml --ignore-not-found=true 2>/dev/null || true
      - kubectl delete -f {{.OVERLAY}}/temporal-server.yaml --ignore-not-found=true 2>/dev/null || true
      - kubectl delete namespace {{.TEMPORAL_NAMESPACE}} --ignore-not-found=true

  _wait:server:
    internal: true
    cmds:
      - echo "Waiting for Temporal Postgres..."
      - kubectl wait --for=condition=ready pod -l app=temporal-postgres -n {{.TEMPORAL_NAMESPACE}} --timeout=120s
      - echo "Waiting for Temporal server (schema setup can take a minute)..."
      - kubectl wait --for=condition=ready pod -l app=temporal -n {{.TEMPORAL_NAMESPACE}} --timeout=300s

  _wait:ui:
    internal: true
    cmds:
      - echo "Waiting for Temporal UI..."
      - kubectl wait --for=condition=ready pod -l app=temporal-ui -n {{.TEMPORAL_NAMESPACE}} --timeout=120s

  _wait:worker:
    internal: true
    cmds:
      - echo "Waiting for Temporal worker..."
      - kubectl wait --for=condition=ready pod -l app=temporal-worker -n {{.NAMESPACE}} --timeout=120s

  _register:namespace:
    internal: true
    cmds:
      - |
        echo "Registering Temporal namespace {{.TEMPORAL_NS}}..."
        POD_IP=$(kubectl get pod -n {{.TEMPORAL_NAMESPACE}} -l app=temporal -o jsonpath='{.items[0].status.podIP}')
        kubectl exec -n {{.TEMPORAL_NAMESPACE}} deploy/temporal -- \
          tctl --address "${POD_IP}:7233" --namespace {{.TEMPORAL_NS}} namespace register --rd 72h 2>/dev/null || true
        echo "Namespace {{.TEMPORAL_NS}} ready"

  _apply:split-crds:
    internal: true
    cmds:
      - |
        echo "Applying MirrordSplitConfig CRD from operator chart..."
        helm template mirrord-operator {{.CHARTS_DIR}} \
          -f {{.ROOT_DIR}}/operator-values.yaml \
          -s templates/crd.yaml | kubectl apply --server-side --force-conflicts -f -
