version: "3"

# Local multicluster with RELEASED operators — no operator docker builds. Two
# topologies, switched by MC_NUM_CLUSTERS (set in .env or inline):
#
#   MC_NUM_CLUSTERS=2 (default): primary + remote-1; the primary is a workload
#     cluster AND the default cluster (operator-values-multicluster-2-clusters.yaml).
#   MC_NUM_CLUSTERS=3 (CI-like): management-only primary + remote-1 (default) +
#     remote-2 (operator-values-multicluster-3-clusters.yaml). Matches the
#     multicluster CI workflow topology.
#
#   MC_NUM_CLUSTERS=3 task multicluster:up      create the clusters + operators
#   task operator:dev CLUSTER=mirrord-primary   run YOUR local operator against a cluster
#   task multicluster:servicebus:secret CONN='Endpoint=sb://...'
#   task multicluster:servicebus:deploy         topic consumer on the REMOTE cluster
#   task multicluster:servicebus:run:local      local consumer via the PRIMARY operator
#   task multicluster:servicebus:send:match     tenant=test-user -> your local session
#   task multicluster:servicebus:send:nomatch   tenant=other     -> remote cluster consumer
#
# The heavy lifting (apiserver cert SANs, docker network cross-connect,
# hostNetwork/hostAliases patches, bearer-token credential secrets, the
# NUM_CLUSTERS branches) is proxied to the proven legacy tasks in
# tasks/Taskfile.multicluster.yml, which read the same MC_NUM_CLUSTERS.

vars:
  ROOT_DIR:
    sh: git rev-parse --show-toplevel
  PRIMARY: '{{.MC_PRIMARY | default "mirrord-primary"}}'
  REMOTE: '{{.MC_REMOTE_1 | default "mirrord-remote-1"}}'
  REMOTE2: '{{.MC_REMOTE_2 | default "mirrord-remote-2"}}'
  # Topology switch, see the header comment. The legacy taskfile branches on
  # the same variable, so it flows through cluster creation, credential
  # secrets, image loads and operator installs.
  MC_CLUSTERS: '{{.MC_NUM_CLUSTERS | default "2"}}'
  # The DEFAULT cluster (multicluster-config.yaml `defaultCluster`) is where
  # stateful ops live: preview pods, copy pods, db branches. Derived from the
  # topology; override with MC_DEFAULT_CTX if your install diverges.
  DEFAULT_CTX: '{{if .MC_DEFAULT_CTX}}{{.MC_DEFAULT_CTX}}{{else if eq .MC_CLUSTERS "3"}}mirrord-remote-1{{else}}mirrord-primary{{end}}'
  # Clusters that run workloads (consumers, preview pods, split-only copies).
  WORKLOAD_CTXS: '{{if eq .MC_CLUSTERS "3"}}mirrord-remote-1 mirrord-remote-2{{else}}mirrord-primary mirrord-remote-1{{end}}'
  # Every cluster in the topology.
  ALL_CTXS: '{{if eq .MC_CLUSTERS "3"}}mirrord-primary mirrord-remote-1 mirrord-remote-2{{else}}mirrord-primary mirrord-remote-1{{end}}'
  NAMESPACE: '{{.NAMESPACE | default "test-mirrord"}}'
  CONTAINER_RUNTIME: '{{.CONTAINER_RUNTIME | default "docker"}}'
  MIRRORD_BIN: '{{.MIRRORD_BIN | default "mirrord"}}'
  CHARTS_DIR: '{{.ROOT_DIR}}/../operator/public/charts/mirrord-operator'
  MIRRORD_DIR: '{{.MIRRORD_DIR | default (print .ROOT_DIR "/../mirrord")}}'
  # The same locally-built agent image the single-cluster flow uses.
  MC_AGENT_IMAGE: '{{.MC_AGENT_IMAGE | default "test"}}'
  SB_OVERLAY: '{{.ROOT_DIR}}/k8s/overlays/servicebus-emulator'
  MC_SB_MIRRORD_CONFIG: '{{.MC_SB_MIRRORD_CONFIG | default (print .ROOT_DIR "/k8s/overlays/servicebus-emulator/mirrord-topic.json")}}'
  SB_TOPIC: '{{.MC_SB_TOPIC | default "test-topic"}}'
  # Helm flags shared by every released-operator install/re-apply.
  MC_RELEASE_COMMON_FLAGS: "--set image.pullPolicy=IfNotPresent --set license.pemRef= --set operator.azureServiceBusSplitting=true"

tasks:
  up:
    desc: "Create the clusters + released operators (VERSION=latest|x.y.z, MC_NUM_CLUSTERS=2|3). No operator docker builds."
    preconditions:
      - sh: test -n "$RELEASE_LICENSE_KEY"
        msg: "RELEASE_LICENSE_KEY is required for released operators. Set it in .env"
    cmds:
      - task: _agent:ensure
      # minikube's docker driver cannot (re)provision a container attached to more than its
      # own network ("container addresses should have 2 values, got N") - drop the
      # cross-cluster mesh around cluster creation and restore it right after.
      - task: _mesh:detach
      - task -t {{.ROOT_DIR}}/Taskfile.legacy.yml multicluster:clusters:create MC_NUM_CLUSTERS={{.MC_CLUSTERS}}
      - task: _mesh:attach
      - task -t {{.ROOT_DIR}}/Taskfile.legacy.yml multicluster:agent:load AGENT_IMAGE={{.MC_AGENT_IMAGE}} MC_NUM_CLUSTERS={{.MC_CLUSTERS}}
      - task: _operators:install
        vars: { VERSION: '{{.VERSION | default "latest"}}' }
      - kubectl config use-context {{.PRIMARY}}
      - task: _up:summary

  _mesh:detach:
    internal: true
    # See the note in `up`: every cluster container must sit on ONLY its own docker network
    # while minikube provisions it. Best-effort - containers or attachments may not exist.
    cmds:
      - |
        docker network disconnect mirrord-remote-1 mirrord-primary >/dev/null 2>&1 || true
        docker network disconnect mirrord-remote-2 mirrord-primary >/dev/null 2>&1 || true
        docker network disconnect mirrord-primary mirrord-remote-1 >/dev/null 2>&1 || true
        docker network disconnect mirrord-primary mirrord-remote-2 >/dev/null 2>&1 || true
        echo "cross-cluster network mesh detached (minikube can provision now)"

  _mesh:attach:
    internal: true
    # The mesh gives every cluster an address on its peers' docker networks - it is what
    # makes cross-cluster reachability work (the shared localstack NodePort, the default
    # cluster's apiserver as seen from members). Without it, splits/branches/replicas all
    # fail with connection refused on 192.168.x.x addresses.
    cmds:
      - |
        docker network connect mirrord-remote-1 mirrord-primary >/dev/null 2>&1 || true
        docker network connect mirrord-primary mirrord-remote-1 >/dev/null 2>&1 || true
        if [ "{{.MC_CLUSTERS}}" = "3" ]; then
          docker network connect mirrord-remote-2 mirrord-primary >/dev/null 2>&1 || true
          docker network connect mirrord-primary mirrord-remote-2 >/dev/null 2>&1 || true
        fi
        echo "cross-cluster network mesh attached"

  _agent:ensure:
    internal: true
    # The agent image must exist in the local docker daemon so it can be
    # loaded into both clusters. Build it from ../mirrord if it's missing
    # (agent builds are fine — only operator image builds are avoided).
    cmds:
      - |
        if ! {{.CONTAINER_RUNTIME}} image inspect {{.MC_AGENT_IMAGE}} >/dev/null 2>&1; then
          echo "Agent image '{{.MC_AGENT_IMAGE}}' not in docker — building from {{.MIRRORD_DIR}}..."
          cd {{.MIRRORD_DIR}} && {{.CONTAINER_RUNTIME}} build -f mirrord/agent/Dockerfile -t {{.MC_AGENT_IMAGE}} .
        fi

  _operators:install:
    internal: true
    # Released operators on both clusters via the proven legacy install
    # (image load into both clusters + primary multiCluster install + remote
    # member install + credential secrets). Everything is baked into ONE helm
    # install per cluster: a post-install `helm upgrade` would re-render the
    # chart's sysctls and collide with the hostNetwork patch the installer
    # applies (sysctls + hostNetwork are mutually exclusive). That's also why
    # azureServiceBusSplitting rides along here instead of a second pass —
    # the legacy values files predate it.
    vars:
      VERSION: '{{.VERSION | default "latest"}}'
    cmds:
      - |
        VERSION="{{.VERSION}}"
        if [ "$VERSION" = "latest" ]; then
          helm repo add metalbear https://metalbear-co.github.io/charts >/dev/null 2>&1 || true
          helm repo update metalbear >/dev/null
          VERSION=$(helm search repo metalbear/mirrord-operator | awk 'NR==2 {print $2}')
          echo "Latest released operator: $VERSION"
        fi
        task -t {{.ROOT_DIR}}/Taskfile.legacy.yml multicluster:operator:release:load:images VERSION=$VERSION MC_NUM_CLUSTERS={{.MC_CLUSTERS}}
        task -t {{.ROOT_DIR}}/Taskfile.legacy.yml multicluster:operator:install:all \
          AGENT_IMAGE={{.MC_AGENT_IMAGE}} \
          MC_NUM_CLUSTERS={{.MC_CLUSTERS}} \
          EXTRA_HELM_ARGS="--set operator.image=ghcr.io/metalbear-co/operator --set operator.imageTag=$VERSION {{.MC_RELEASE_COMMON_FLAGS}} --set-string license.key=$RELEASE_LICENSE_KEY"
      # The legacy installer puts the operators on hostNetwork, which breaks
      # operator:dev stealing (loopback bypass) — undo it. See operator:podnetwork.
      - task: operator:podnetwork

  _up:summary:
    internal: true
    silent: true
    cmds:
      - |
        echo ""
        echo "Multicluster is up (topology: {{.MC_CLUSTERS}} clusters):"
        echo "  primary: {{.PRIMARY}} (multiCluster enabled)"
        echo "  default: {{.DEFAULT_CTX}} (preview pods, copy pods, db branches)"
        echo "  workload clusters: {{.WORKLOAD_CTXS}}"
        echo ""
        echo "Per-cluster operator:dev configs (edit freely):"
        for CTX in {{.ALL_CTXS}}; do echo "  .mirrord/operator-dev.$CTX.yaml"; done
        echo ""
        echo "Next:"
        echo "  task multicluster:operator:primary            # your local operator against primary"
        echo "  task multicluster:operator:remote-1           # ...or against a member"
        echo "  task multicluster:sqs:deploy                  # SQS preview test env"

  operator:primary:
    desc: Run YOUR local operator under mirrord against the PRIMARY cluster (= operator:dev CLUSTER=mirrord-primary)
    interactive: true
    cmds:
      - task: _secrets:ensure-fresh
      - task: :operator:dev
        vars: { CLUSTER: "{{.PRIMARY}}" }

  operator:remote:
    desc: Run YOUR local operator under mirrord against the REMOTE cluster (= operator:dev CLUSTER=mirrord-remote-1)
    aliases: [operator:remote-1]
    interactive: true
    cmds:
      - task: _secrets:ensure-fresh
      - task: :operator:dev
        vars: { CLUSTER: "{{.REMOTE}}" }

  operator:remote-2:
    desc: Run YOUR local operator under mirrord against the SECOND remote (3-cluster topology only)
    interactive: true
    preconditions:
      - sh: kubectl config get-contexts {{.REMOTE2}} >/dev/null 2>&1
        msg: "No {{.REMOTE2}} context — create the 3-cluster topology first: MC_NUM_CLUSTERS=3 task multicluster:up"
    cmds:
      - task: _secrets:ensure-fresh
      - task: :operator:dev
        vars: { CLUSTER: "{{.REMOTE2}}" }

  _secrets:ensure-fresh:
    internal: true
    # The remote-cluster bearer token is minted by multicluster:up with a short
    # lifetime, and the in-cluster refresh can only renew a token that is still
    # valid — so after any idle gap the stored token is dead and every
    # cross-cluster call 401s (broadcast sync, preview split fan-out, sessions).
    # Re-mint it here when it's missing or about to expire, so operators started
    # by operator:primary / operator:remote-1 always begin with working creds.
    silent: true
    vars:
      TOKEN_DURATION: '{{.TOKEN_DURATION | default "1h"}}'
      # Refresh when the stored token has less than this many seconds left.
      MIN_TTL_SECS: '{{.MIN_TTL_SECS | default "300"}}'
    cmds:
      - |
        set -uo pipefail
        REMOTES="{{.REMOTE}}"
        [ "{{.MC_CLUSTERS}}" = "3" ] && REMOTES="{{.REMOTE}} {{.REMOTE2}}"

        NEEDS_REFRESH=0
        for R in $REMOTES; do
          TOKEN=$(kubectl --context {{.PRIMARY}} get secret mirrord-cluster-$R -n mirrord \
            -o jsonpath='{.data.bearerToken}' 2>/dev/null | base64 -d || true)
          if [ -n "$TOKEN" ]; then
            EXP=$(printf '%s' "$TOKEN" | python3 -c 'import base64,json,sys; t=sys.stdin.read().split(".")[1]; t+="="*(-len(t)%4); print(json.loads(base64.urlsafe_b64decode(t)).get("exp",0))' 2>/dev/null || echo 0)
            LEFT=$((EXP - $(date +%s)))
            if [ "$LEFT" -gt {{.MIN_TTL_SECS}} ]; then
              echo "$R token ok (${LEFT}s left)"
            else
              echo "$R token expired or expiring (${LEFT}s left) — re-minting..."
              NEEDS_REFRESH=1
            fi
          else
            echo "$R credential secret missing — creating..."
            NEEDS_REFRESH=1
          fi
        done

        if [ "$NEEDS_REFRESH" = "1" ]; then
          task -t {{.ROOT_DIR}}/Taskfile.legacy.yml multicluster:secrets:create TOKEN_DURATION={{.TOKEN_DURATION}} MC_NUM_CLUSTERS={{.MC_CLUSTERS}}
          # The deployed primary operator caches credentials at startup, so bounce
          # it to stop its sync controllers 401ing with the stale token. The local
          # operator:dev process starting right after this reads the fresh secret.
          if kubectl --context {{.PRIMARY}} get deploy mirrord-operator -n mirrord >/dev/null 2>&1; then
            echo "restarting deployed primary operator to pick up the fresh token..."
            kubectl --context {{.PRIMARY}} delete pod -n mirrord -l app.kubernetes.io/name=mirrord-operator --force --grace-period=0 2>/dev/null || true
            kubectl --context {{.PRIMARY}} wait --for=condition=available deployment/mirrord-operator -n mirrord --timeout=120s || true
          fi
        fi

  operator:podnetwork:
    desc: "Move both operators off hostNetwork onto the pod network (keeps cross-cluster reachability via hostAliases + NAT). Required for operator:dev: with hostNetwork, apiserver->operator traffic rides loopback on the single node and BYPASSES the mirrord steal, so local sessions never receive anything."
    cmds:
      - |
        set -euo pipefail
        HOST_ALIASES="["
        SEP=""
        for CTX in {{.ALL_CTXS}}; do
          IP=$(docker inspect $CTX --format '{{`{{range $k, $v := .NetworkSettings.Networks}}{{if eq $k "mirrord-primary"}}{{$v.IPAddress}}{{end}}{{end}}`}}')
          HOST_ALIASES="$HOST_ALIASES$SEP{\"ip\":\"$IP\",\"hostnames\":[\"$CTX\"]}"
          SEP=","
          echo "hostAlias: $CTX=$IP"
        done
        HOST_ALIASES="$HOST_ALIASES]"
        for CTX in {{.ALL_CTXS}}; do
          echo "=== $CTX: switching operator to pod network ==="
          # The chart's sysctl (stripped when hostNetwork was added) is needed
          # again so the pod can bind 443 as non-root on the pod network.
          kubectl --context "$CTX" patch deployment mirrord-operator -n mirrord --type=strategic -p "{
            \"spec\":{\"template\":{\"spec\":{
              \"hostNetwork\":null,
              \"dnsPolicy\":\"ClusterFirst\",
              \"hostAliases\":$HOST_ALIASES,
              \"securityContext\":{\"sysctls\":[{\"name\":\"net.ipv4.ip_unprivileged_port_start\",\"value\":\"443\"}]}
            }}}}"
          kubectl --context "$CTX" delete pods -n mirrord -l app.kubernetes.io/name=mirrord-operator --force --grace-period=0 2>/dev/null || true
          kubectl --context "$CTX" delete pods -n mirrord -l app=mirrord-operator --force --grace-period=0 2>/dev/null || true
          kubectl --context "$CTX" wait --for=condition=available deployment/mirrord-operator -n mirrord --timeout=180s
        done
        echo ""
        echo "Checking primary -> remote connectivity..."
        sleep 5
        kubectl --context {{.PRIMARY}} get mirrordoperators operator -o jsonpath='{.status}' 2>/dev/null | head -c 400 || true
        echo ""

  operator:deploy:
    desc: "Deploy YOUR locally built mirrord-operator:custom into every cluster (unique tag, tar-based load, OPERATOR_IMAGE + default-apiserver env, verifies the pods run the fresh image)"
    cmds:
      - DEPLOY_OPERATOR=1 DEPLOY_ONLY=1 {{.ROOT_DIR}}/scripts/mc-preview-replica-e2e.sh

  operator:use:
    desc: "Multicluster twin of operator:use - deploy an operator to ALL clusters. VERSION=latest|x.y.z|pick (released, cached under .versions so no registry needed on reuse) or VERSION=custom (your local mirrord-operator:custom build)."
    vars:
      VERSION: '{{.VERSION | default "latest"}}'
    preconditions:
      - sh: test -n "$RELEASE_LICENSE_KEY"
        msg: "RELEASE_LICENSE_KEY is required. Set it in .env"
    cmds:
      - |
        set -euo pipefail
        VERSION="{{.VERSION}}"
        if [ "$VERSION" = "custom" ]; then
          task multicluster:operator:install:custom MC_NUM_CLUSTERS={{.MC_CLUSTERS}}
          exit 0
        fi

        CACHE="{{.ROOT_DIR}}/.versions/operator"
        mkdir -p "$CACHE"
        helm repo add metalbear https://metalbear-co.github.io/charts >/dev/null 2>&1 || true
        helm repo update metalbear >/dev/null 2>&1 || true

        if [ "$VERSION" = "latest" ]; then
          VERSION=$(helm search repo metalbear/mirrord-operator | awk 'NR==2 {print $2}')
          echo "Latest released operator: $VERSION"
        elif [ "$VERSION" = "pick" ]; then
          VERSION=$(helm search repo metalbear/mirrord-operator --versions | awk 'NR>1 {print $2}' \
            | fzf --height=40% --reverse --border --border-label=" multicluster:operator:use " \
                  --prompt="version> " --header="Pick an operator release. Esc to cancel.")
          [ -n "$VERSION" ] || { echo "Cancelled."; exit 0; }
        fi
        IMG="ghcr.io/metalbear-co/operator:$VERSION"
        echo "Using operator $VERSION on: {{.ALL_CTXS}}"

        # Same cache as single-cluster operator:use - a version downloaded once installs
        # forever after without registry access (ghcr timeouts have bitten before).
        if [ -f "$CACHE/$VERSION.tar" ]; then
          echo "Using cached image $CACHE/$VERSION.tar"
          {{.CONTAINER_RUNTIME}} load -i "$CACHE/$VERSION.tar" 2>/dev/null || true
        else
          echo "Downloading $IMG (cached to .versions for offline reuse)..."
          {{.CONTAINER_RUNTIME}} pull "$IMG"
          {{.CONTAINER_RUNTIME}} save "$IMG" -o "$CACHE/$VERSION.tar"
        fi

        for P in {{.ALL_CTXS}}; do
          echo "Loading image into $P..."
          minikube -p "$P" ssh "docker rmi $IMG --force" 2>/dev/null || true
          minikube -p "$P" image load "$IMG"
        done

        task -t {{.ROOT_DIR}}/Taskfile.legacy.yml multicluster:operator:install:all \
          AGENT_IMAGE={{.MC_AGENT_IMAGE}} \
          MC_NUM_CLUSTERS={{.MC_CLUSTERS}} \
          EXTRA_HELM_ARGS="--set operator.image=ghcr.io/metalbear-co/operator --set operator.imageTag=$VERSION {{.MC_RELEASE_COMMON_FLAGS}} --set-string license.key=$RELEASE_LICENSE_KEY"
      # The legacy installer puts the operators on hostNetwork - undo it, same as `up` does.
      - task: operator:podnetwork

  operator:install:release:
    desc: "Install the RELEASED operator (VERSION=latest|x.y.z) on all EXISTING clusters - e.g. to baseline released behavior after testing a custom build. Needs ghcr.io reachable."
    preconditions:
      - sh: test -n "$RELEASE_LICENSE_KEY"
        msg: "RELEASE_LICENSE_KEY is required. Set it in .env"
    cmds:
      - task: _operators:install
        vars: { VERSION: '{{.VERSION | default "latest"}}' }

  operator:install:custom:
    desc: "FIRST install of YOUR locally built operator (OPERATOR_IMAGE, default mirrord-operator:custom) on all clusters - no ghcr pull. Use when multicluster:up cannot reach ghcr or you want a custom build from the start; afterwards use operator:deploy for rebuilds."
    preconditions:
      - sh: test -n "$RELEASE_LICENSE_KEY"
        msg: "RELEASE_LICENSE_KEY is required. Set it in .env"
      - sh: '{{.CONTAINER_RUNTIME}} image inspect {{.OPERATOR_IMAGE | default "mirrord-operator:custom"}} >/dev/null 2>&1'
        msg: "Local operator image not found - build or retag it first, e.g. docker tag <your-tag> mirrord-operator:custom"
    vars:
      OPERATOR_IMAGE: '{{.OPERATOR_IMAGE | default "mirrord-operator:custom"}}'
    cmds:
      - task -t {{.ROOT_DIR}}/Taskfile.legacy.yml multicluster:operator:load:images OPERATOR_IMAGE={{.OPERATOR_IMAGE}} MC_NUM_CLUSTERS={{.MC_CLUSTERS}}
      - |
        IMAGE="{{.OPERATOR_IMAGE}}"
        task -t {{.ROOT_DIR}}/Taskfile.legacy.yml multicluster:operator:install:all \
          AGENT_IMAGE={{.MC_AGENT_IMAGE}} \
          MC_NUM_CLUSTERS={{.MC_CLUSTERS}} \
          EXTRA_HELM_ARGS="--set operator.image=${IMAGE%:*} --set operator.imageTag=${IMAGE##*:} {{.MC_RELEASE_COMMON_FLAGS}} --set-string license.key=$RELEASE_LICENSE_KEY"
      # The legacy installer puts the operators on hostNetwork - undo it, same as `up` does.
      - task: operator:podnetwork

  operator:apply:
    desc: "Re-apply the multicluster values files (multicluster/*.yaml) to BOTH deployed operators after editing them. Keeps the currently deployed released version; also refreshes remote credentials."
    preconditions:
      - sh: test -n "$RELEASE_LICENSE_KEY"
        msg: "RELEASE_LICENSE_KEY is required. Set it in .env"
      - sh: kubectl --context {{.PRIMARY}} get deploy mirrord-operator -n mirrord >/dev/null 2>&1
        msg: "No operator on {{.PRIMARY}} — run 'task multicluster:up' first"
    cmds:
      - |
        IMG=$(kubectl --context {{.PRIMARY}} get deploy mirrord-operator -n mirrord -o jsonpath='{.spec.template.spec.containers[0].image}')
        echo "Re-applying multicluster values with operator image $IMG"
        task -t {{.ROOT_DIR}}/Taskfile.legacy.yml multicluster:operator:install:all \
          AGENT_IMAGE={{.MC_AGENT_IMAGE}} \
          EXTRA_HELM_ARGS="--set operator.image=${IMG%:*} --set operator.imageTag=${IMG##*:} {{.MC_RELEASE_COMMON_FLAGS}} --set-string license.key=$RELEASE_LICENSE_KEY"
      # The legacy installer re-adds hostNetwork — undo it (see operator:podnetwork).
      - task: operator:podnetwork

  crds:
    desc: Apply local-chart CRDs to BOTH clusters
    cmds:
      - task: :operator:crds
        vars: { CLUSTER: "{{.PRIMARY}}" }
      - task: :operator:crds
        vars: { CLUSTER: "{{.REMOTE}}" }

  status:
    desc: Show operators, remote connectivity and split state on both clusters
    silent: true
    cmds:
      - echo "=== operator pods ==="
      - 'echo "[{{.PRIMARY}}]" && kubectl --context {{.PRIMARY}} get pods -n mirrord 2>/dev/null || echo "  not reachable"'
      - 'echo "[{{.REMOTE}}]" && kubectl --context {{.REMOTE}} get pods -n mirrord 2>/dev/null || echo "  not reachable"'
      - echo ""
      - echo "=== remote cluster credentials (on primary) ==="
      - kubectl --context {{.PRIMARY}} get secrets -n mirrord -l operator.metalbear.co/remote-cluster-credentials=true 2>/dev/null || echo "none"
      - echo ""
      - echo "=== connectivity (mirrordoperators on primary) ==="
      - kubectl --context {{.PRIMARY}} get mirrordoperators operator -o jsonpath='{.status}' 2>/dev/null | head -c 800 || echo "no status"
      - echo ""
      - echo ""
      - echo "=== split sessions ==="
      - 'echo "[{{.PRIMARY}}]" && kubectl --context {{.PRIMARY}} get mirrordclustersplitsession -A 2>/dev/null || echo "  none"'
      - 'echo "[{{.REMOTE}}]" && kubectl --context {{.REMOTE}} get mirrordclustersplitsession -A 2>/dev/null || echo "  none"'

  logs:
    desc: Tail the PRIMARY operator logs (CLUSTER=... overrides)
    vars:
      CLUSTER: '{{.CLUSTER | default ""}}'
    cmds:
      - kubectl --context {{.CLUSTER | default .PRIMARY}} logs -n mirrord -l app.kubernetes.io/name=mirrord-operator --tail=100 -f

  secrets:refresh:
    desc: Refresh the remote-cluster bearer tokens (they expire; default 10m)
    cmds:
      - task -t {{.ROOT_DIR}}/Taskfile.legacy.yml multicluster:secrets:refresh:restart

  destroy:
    desc: Delete both minikube clusters
    cmds:
      - task -t {{.ROOT_DIR}}/Taskfile.legacy.yml multicluster:clusters:delete

  # ── Azure Service Bus topic test (real Azure, local clusters) ─────────────
  # Consumer runs on the REMOTE cluster; your mirrord session connects through
  # the PRIMARY operator, which proxies to the remote (its default cluster).
  # The split filter is tenant=^test on subscription split id `test-topic-sub`
  # (k8s/overlays/servicebus-emulator/mirrord-topic.json + split-config-topic-azure.yaml).

  servicebus:secret:
    desc: "Store the Azure connection string on BOTH clusters. CONN='Endpoint=sb://...' explicitly, or set AZURE_SB_RG + AZURE_SB_NAMESPACE in .env to auto-fetch via az."
    silent: true
    vars:
      AZ_RG: '{{.AZURE_SB_RG | default ""}}'
      AZ_NS: '{{.AZURE_SB_NAMESPACE | default ""}}'
    cmds:
      - |
        CONN='{{.CONN}}'

        # No CONN given: fetch the RootManageSharedAccessKey connection string
        # with the az CLI, and make sure the topic + subscription the consumer
        # expects (test-topic / test-sub) exist in the namespace.
        if [ -z "$CONN" ]; then
          if [ -z "{{.AZ_RG}}" ] || [ -z "{{.AZ_NS}}" ] || ! az account show >/dev/null 2>&1; then
            echo "Either pass the connection string:"
            echo "  task multicluster:servicebus:secret CONN='Endpoint=sb://<ns>.servicebus.windows.net/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=...'"
            echo "  (Azure Portal -> Service Bus namespace -> Shared access policies -> RootManageSharedAccessKey -> Primary Connection String)"
            echo ""
            echo "Or let az fetch it: set AZURE_SB_RG + AZURE_SB_NAMESPACE in .env and run 'az login'."
            exit 1
          fi
          echo "Fetching connection string for namespace {{.AZ_NS}} (rg {{.AZ_RG}})..."
          CONN=$(az servicebus namespace authorization-rule keys list \
            --resource-group {{.AZ_RG}} --namespace-name {{.AZ_NS}} \
            --name RootManageSharedAccessKey --query primaryConnectionString -o tsv)
          echo "Ensuring topic '{{.SB_TOPIC}}' + subscription 'test-sub' exist..."
          az servicebus topic create --resource-group {{.AZ_RG}} --namespace-name {{.AZ_NS}} \
            --name {{.SB_TOPIC}} -o none 2>/dev/null || true
          az servicebus topic subscription create --resource-group {{.AZ_RG}} --namespace-name {{.AZ_NS}} \
            --topic-name {{.SB_TOPIC}} --name test-sub -o none 2>/dev/null || true
        fi

        for CTX in {{.PRIMARY}} {{.REMOTE}}; do
          kubectl --context "$CTX" create namespace {{.NAMESPACE}} --dry-run=client -o yaml | kubectl --context "$CTX" apply -f - >/dev/null
          kubectl --context "$CTX" create secret generic servicebus-azure-conn -n {{.NAMESPACE}} \
            --from-literal=connection_string="$CONN" \
            --dry-run=client -o yaml | kubectl --context "$CTX" apply -f - >/dev/null
          echo "Secret servicebus-azure-conn updated on $CTX"
        done

  servicebus:deploy:
    desc: "Deploy the topic consumer (real Azure SB). CLUSTERS=remote|primary|both (default: remote). Creates the secret via az if missing."
    vars:
      CLUSTERS: '{{.CLUSTERS | default "remote"}}'
    cmds:
      - |
        if ! kubectl --context {{.REMOTE}} get secret servicebus-azure-conn -n {{.NAMESPACE}} >/dev/null 2>&1; then
          echo "Azure connection secret missing — creating it..."
          task multicluster:servicebus:secret
        fi
      - "{{.CONTAINER_RUNTIME}} build -t servicebus-consumer:local {{.ROOT_DIR}}/apps/servicebus-consumer"
      - |
        case "{{.CLUSTERS}}" in
          remote)  CTXS="{{.REMOTE}}";;
          primary) CTXS="{{.PRIMARY}}";;
          both)    CTXS="{{.PRIMARY}} {{.REMOTE}}";;
          *) echo "CLUSTERS must be remote|primary|both (got '{{.CLUSTERS}}')"; exit 1;;
        esac
        for CTX in $CTXS; do
          echo "=== deploying topic consumer to $CTX ==="
          minikube -p "$CTX" image load servicebus-consumer:local
          kubectl --context "$CTX" create namespace {{.NAMESPACE}} --dry-run=client -o yaml | kubectl --context "$CTX" apply -f -
          kubectl --context "$CTX" apply -f {{.SB_OVERLAY}}/property-list-azure.yaml
          kubectl --context "$CTX" apply -f {{.SB_OVERLAY}}/consumer-topic-azure.yaml
          kubectl --context "$CTX" apply -f {{.SB_OVERLAY}}/split-config-topic-azure.yaml
          kubectl --context "$CTX" rollout restart deploy/servicebus-topic-consumer -n {{.NAMESPACE}}
          kubectl --context "$CTX" rollout status deploy/servicebus-topic-consumer -n {{.NAMESPACE}} --timeout=120s
        done

  servicebus:run:local:
    desc: Run the topic consumer locally under mirrord via the PRIMARY operator (Ctrl-C to stop)
    interactive: true
    dir: apps/servicebus-consumer
    cmds:
      - go build -o /tmp/servicebus-consumer-topic main.go
      - |
        # If operator:dev is running on this machine, label our resources with
        # its isolation marker so YOUR operator handles the session.
        if [ -z "${OPERATOR_ISOLATION_MARKER:-}" ] && pgrep -qf 'target/debug/operator-service'; then
          export OPERATOR_ISOLATION_MARKER=local-dev
          echo "operator:dev detected -> OPERATOR_ISOLATION_MARKER=local-dev"
        fi
        MIRRORD_KUBE_CONTEXT={{.PRIMARY}} MIRRORD_CHECK_VERSION=false \
          {{.MIRRORD_BIN}} exec -f {{.MC_SB_MIRRORD_CONFIG}} -- /tmp/servicebus-consumer-topic

  servicebus:send:match:
    desc: 'Publish a topic message matching the filter -> local session (MESSAGE=...)'
    cmds:
      - task: servicebus:send
        vars:
          TENANT: "test-user"
          TYPE: "premium"
          MESSAGE: '{{.MESSAGE | default "match: hello local session (mc azure)"}}'

  servicebus:send:nomatch:
    desc: 'Publish a topic message NOT matching the filter -> remote cluster consumer (MESSAGE=...)'
    cmds:
      - task: servicebus:send
        vars:
          TENANT: "other"
          TYPE: "basic"
          MESSAGE: '{{.MESSAGE | default "nomatch: hello remote consumer (mc azure)"}}'

  servicebus:send:
    desc: 'Publish to the Azure topic with explicit routing (TENANT=... TYPE=... MESSAGE=...)'
    silent: true
    vars:
      TENANT: '{{.TENANT | default "test-user"}}'
      TYPE: '{{.TYPE | default "standard"}}'
      MESSAGE: '{{.MESSAGE | default "Test message"}}'
    preconditions:
      - sh: kubectl --context {{.REMOTE}} get secret servicebus-azure-conn -n {{.NAMESPACE}} >/dev/null 2>&1
        msg: "Secret missing on {{.REMOTE}}. Create it first: task multicluster:servicebus:secret CONN='Endpoint=sb://...'"
    cmds:
      - |
        CONN=$(kubectl --context {{.REMOTE}} get secret servicebus-azure-conn -n {{.NAMESPACE}} -o jsonpath='{.data.connection_string}' | base64 -d)
        BODY='{"order_id":"ORD-001","tenant":"{{.TENANT}}","type":"{{.TYPE}}","message":"{{.MESSAGE}}"}'
        kubectl --context {{.REMOTE}} run sb-sender-$RANDOM --rm -i --restart=Never \
          --image=servicebus-consumer:local \
          --image-pull-policy=Never \
          --namespace={{.NAMESPACE}} \
          --env="SEND_MODE=true" \
          --env="SERVICEBUS_CONNECTION_STRING=$CONN" \
          --env="SEND_TOPIC={{.SB_TOPIC}}" \
          --env="MESSAGE_BODY=$BODY" \
          --env="MESSAGE_PROPERTIES=tenant={{.TENANT}},type={{.TYPE}}" \
          -- /app/consumer >/dev/null 2>&1
        case "{{.TENANT}}" in
          test*) echo "published '{{.MESSAGE}}' to {{.SB_TOPIC}} (tenant={{.TENANT}} -> local session)";;
          *)     echo "published '{{.MESSAGE}}' to {{.SB_TOPIC}} (tenant={{.TENANT}} -> remote consumer)";;
        esac

  # ── Preview environment (real Azure SB topics, multicluster) ──────────────
  # Instead of running the consumer locally, the operator spins up a PREVIEW
  # POD from an image on the target's cluster (the remote, via the primary's
  # default-cluster routing) and routes filter-matching messages to it.
  # Config: k8s/overlays/servicebus-emulator/mirrord-preview-topic.json
  # (feature.preview + split filter tenant=^test on test-topic-sub).
  #
  #   task multicluster:servicebus:deploy            # target consumer first
  #   task multicluster:servicebus:preview:start     # preview pod on the remote
  #   task multicluster:servicebus:send:match        # -> preview pod
  #   task multicluster:servicebus:send:nomatch      # -> deployed consumer
  #   task multicluster:servicebus:preview:logs / status / stop

  servicebus:preview:start:
    desc: "Start a preview env (NAME=prev-1 gives it its OWN filter tenant=^prev-1 so you can run several and target each; without NAME uses the default ^test filter)"
    interactive: true
    vars:
      NAME: '{{.NAME | default ""}}'
      PREVIEW_KEY: '{{.PREVIEW_KEY | default "mc-asb-preview"}}'
      PREVIEW_IMAGE: '{{.PREVIEW_IMAGE | default "servicebus-consumer:local"}}'
      PREVIEW_TIMEOUT: '{{.PREVIEW_TIMEOUT | default "300"}}'
      MC_SB_PREVIEW_CONFIG: '{{.MC_SB_PREVIEW_CONFIG | default (print .ROOT_DIR "/k8s/overlays/servicebus-emulator/mirrord-preview-topic.json")}}'
    preconditions:
      - sh: kubectl --context {{.REMOTE}} get deploy servicebus-topic-consumer -n {{.NAMESPACE}} >/dev/null 2>&1
        msg: "Target consumer missing on {{.REMOTE}} — run 'task multicluster:servicebus:deploy' first"
    cmds:
      - |
        CFG="{{.MC_SB_PREVIEW_CONFIG}}"
        KEY="{{.PREVIEW_KEY}}"
        # NAME=prev-1: generate a per-preview config whose split filter only
        # matches tenants starting with that name. Each named preview then
        # receives ONLY its own messages (task multicluster:servicebus:send:to
        # NAME=prev-1), and previews don't compete with each other.
        if [ -n "{{.NAME}}" ]; then
          KEY="{{.NAME}}"
          CFG="/tmp/mirrord-preview-{{.NAME}}.json"
          python3 - <<'PY'
        import json
        c = json.load(open("{{.MC_SB_PREVIEW_CONFIG}}"))
        # Retarget every split entry, whatever its key is (a subscription id
        # like "test-topic-sub" or the "*" wildcard), so the config's queue key
        # stays authoritative and this helper doesn't need to know it.
        for split in c["feature"]["split_queues"].values():
            split["message_filter"] = {"tenant": "^{{.NAME}}-"}
        json.dump(c, open("/tmp/mirrord-preview-{{.NAME}}.json", "w"), indent=2)
        PY
          echo "preview '{{.NAME}}': filter tenant=^{{.NAME}}- (config $CFG)"
        fi
        # Same marker rule as run:local — with operator:dev running, the
        # preview session must be labeled so YOUR operator handles it.
        if [ -z "${OPERATOR_ISOLATION_MARKER:-}" ] && pgrep -qf 'target/debug/operator-service'; then
          export OPERATOR_ISOLATION_MARKER=local-dev
          echo "operator:dev detected -> OPERATOR_ISOLATION_MARKER=local-dev"
        fi
        MIRRORD_KUBE_CONTEXT={{.PRIMARY}} MIRRORD_CHECK_VERSION=false \
          {{.MIRRORD_BIN}} preview start \
            -f "$CFG" \
            -i "{{.PREVIEW_IMAGE}}" \
            -k "$KEY" \
            --timeout {{.PREVIEW_TIMEOUT}}

  servicebus:send:to:
    desc: 'Send a message to ONE named preview env (NAME=prev-1 [MESSAGE=...])'
    preconditions:
      - sh: test -n "{{.NAME}}"
        msg: "NAME is required, e.g. task multicluster:servicebus:send:to NAME=prev-1"
    cmds:
      - task: servicebus:send
        vars:
          TENANT: "{{.NAME}}-user"
          TYPE: "premium"
          MESSAGE: '{{.MESSAGE | default (print "hello preview " .NAME)}}'

  servicebus:preview:stop:
    desc: "Stop a preview env (NAME=prev-1, or PREVIEW_KEY for the default one)"
    vars:
      NAME: '{{.NAME | default ""}}'
      PREVIEW_KEY: '{{.PREVIEW_KEY | default "mc-asb-preview"}}'
    cmds:
      - |
        KEY="{{.NAME}}"
        [ -z "$KEY" ] && KEY="{{.PREVIEW_KEY}}"
        if [ -z "${OPERATOR_ISOLATION_MARKER:-}" ] && pgrep -qf 'target/debug/operator-service'; then
          export OPERATOR_ISOLATION_MARKER=local-dev
        fi
        MIRRORD_KUBE_CONTEXT={{.PRIMARY}} MIRRORD_CHECK_VERSION=false \
          {{.MIRRORD_BIN}} preview stop -k "$KEY" || true

  servicebus:preview:status:
    desc: Show preview sessions, preview pods and split state on both clusters
    silent: true
    cmds:
      - |
        for CTX in {{.PRIMARY}} {{.REMOTE}}; do
          echo "=== $CTX ==="
          echo "preview sessions:"
          kubectl --context "$CTX" get previewsessions -A 2>/dev/null || echo "  none"
          echo "preview pods:"
          kubectl --context "$CTX" get pods -n {{.NAMESPACE}} -l preview.metalbear.co/session-uid 2>/dev/null || echo "  none"
          echo "split sessions:"
          kubectl --context "$CTX" get mirrordclustersplitsessions -A 2>/dev/null || echo "  none"
          echo ""
        done

  servicebus:preview:logs:
    desc: Tail the preview pod logs (it runs on the DEFAULT cluster)
    cmds:
      - kubectl --context {{.DEFAULT_CTX}} logs -n {{.NAMESPACE}} -l preview.metalbear.co/session-uid --tail=100 -f

  servicebus:preview:clean:
    desc: Delete all preview sessions + preview pods on both clusters
    cmds:
      - |
        for CTX in {{.PRIMARY}} {{.REMOTE}}; do
          echo "=== cleaning previews on $CTX ==="
          kubectl --context "$CTX" delete previewsessions --all -A 2>/dev/null || true
          kubectl --context "$CTX" delete pods -n {{.NAMESPACE}} -l preview.metalbear.co/session-uid 2>/dev/null || true
        done

  servicebus:logs:
    desc: Tail the remote-cluster topic consumer logs
    cmds:
      - kubectl --context {{.REMOTE}} logs -n {{.NAMESPACE}} -l app=servicebus-topic-consumer --tail=100 -f

  servicebus:clean:
    desc: "Remove the topic consumer + CRDs (keeps secrets). CLUSTERS=remote|primary|both (default: both)"
    vars:
      CLUSTERS: '{{.CLUSTERS | default "both"}}'
    cmds:
      - |
        case "{{.CLUSTERS}}" in
          remote)  CTXS="{{.REMOTE}}";;
          primary) CTXS="{{.PRIMARY}}";;
          both)    CTXS="{{.PRIMARY}} {{.REMOTE}}";;
          *) echo "CLUSTERS must be remote|primary|both (got '{{.CLUSTERS}}')"; exit 1;;
        esac
        for CTX in $CTXS; do
          echo "=== cleaning topic consumer from $CTX ==="
          kubectl --context "$CTX" delete -f {{.SB_OVERLAY}}/split-config-topic-azure.yaml --ignore-not-found=true
          kubectl --context "$CTX" delete -f {{.SB_OVERLAY}}/property-list-azure.yaml --ignore-not-found=true
          kubectl --context "$CTX" delete -f {{.SB_OVERLAY}}/consumer-topic-azure.yaml --ignore-not-found=true
        done

  # ── Multi-topic mixed-case reproduction (real Azure SB) ───────────────────
  # Recreates a client's Azure SB config to study its subscription/rule churn:
  #   - two topics (test-topic, test-topic-2), and one subscription that exists
  #     in Azure with mixed case (Test-sub-2) while the config is all lowercase,
  #   - the app subscription is resolved from env `Service.ServiceName` with
  #     fallback `dummy`; the consumer never sets that env, so every queue
  #     resolves its app subscription to `dummy` (a sub that does not exist),
  #   - a wildcard `split_queues: "*"` with a `cot-context-intercept-id` filter.
  # Use it to watch dangling $Default subs, mirrord-session -> $Default flips,
  # and per-topic extra subscriptions.
  #
  #   task multicluster:servicebus:multi:secret        create both topics/subs (mixed case)
  #   task multicluster:servicebus:multi:deploy        2-topic consumer + split config
  #   task multicluster:servicebus:multi:preview:start NAME=prev-1
  #   task multicluster:servicebus:multi:send TOPIC=test-topic KEY=prev-1
  #   task multicluster:servicebus:multi:azure:subs    list Azure subs + rules per topic
  #   task multicluster:servicebus:multi:status / logs / preview:stop / clean

  servicebus:multi:secret:
    desc: "Ensure both Azure topics/subs for the multi-topic repro exist (test-topic/test-sub + test-topic-2/Test-sub-2, mixed case) and store the connection secret on both clusters."
    silent: true
    vars:
      AZ_RG: '{{.AZURE_SB_RG | default ""}}'
      AZ_NS: '{{.AZURE_SB_NAMESPACE | default ""}}'
    cmds:
      # Reuse the base secret task: it fetches/stores the connection string and
      # creates the first topic/sub (test-topic/test-sub).
      - task: servicebus:secret
        vars: { CONN: '{{.CONN}}' }
      - |
        # Second topic with an intentionally mixed-case subscription. The client's
        # real Azure has mixed case while the config only uses lowercase, so
        # recreating that split is the whole point of this repro.
        if [ -n "{{.AZ_RG}}" ] && [ -n "{{.AZ_NS}}" ] && az account show >/dev/null 2>&1; then
          echo "Ensuring topic 'test-topic-2' + subscription 'Test-sub-2' (mixed case) exist..."
          az servicebus topic create --resource-group {{.AZ_RG}} --namespace-name {{.AZ_NS}} \
            --name test-topic-2 -o none 2>/dev/null || true
          az servicebus topic subscription create --resource-group {{.AZ_RG}} --namespace-name {{.AZ_NS}} \
            --topic-name test-topic-2 --name Test-sub-2 -o none 2>/dev/null || true
        else
          echo "NOTE: create topic 'test-topic-2' + subscription 'Test-sub-2' (mixed case) manually,"
          echo "      or set AZURE_SB_RG + AZURE_SB_NAMESPACE in .env, run 'az login', and re-run to auto-create."
        fi

  servicebus:multi:deploy:
    desc: "Deploy the 2-topic mixed-case consumer + split config (real Azure SB). CLUSTERS=remote|primary|both (default: remote)."
    vars:
      CLUSTERS: '{{.CLUSTERS | default "remote"}}'
    cmds:
      - |
        if ! kubectl --context {{.REMOTE}} get secret servicebus-azure-conn -n {{.NAMESPACE}} >/dev/null 2>&1; then
          echo "Azure connection secret missing - creating it..."
          task multicluster:servicebus:multi:secret
        fi
      - |
        case "{{.CLUSTERS}}" in
          remote)  CTXS="{{.REMOTE}}";;
          primary) CTXS="{{.PRIMARY}}";;
          both)    CTXS="{{.PRIMARY}} {{.REMOTE}}";;
          *) echo "CLUSTERS must be remote|primary|both (got '{{.CLUSTERS}}')"; exit 1;;
        esac
        for CTX in $CTXS; do
          echo "=== deploying multi-topic consumer to $CTX ==="
          # Build straight on the node: `minikube image load` silently skips a
          # tag that already exists and is in use, which leaves the pod running
          # stale code.
          minikube -p "$CTX" image build -t servicebus-consumer:local {{.ROOT_DIR}}/apps/servicebus-consumer
          kubectl --context "$CTX" create namespace {{.NAMESPACE}} --dry-run=client -o yaml | kubectl --context "$CTX" apply -f -
          kubectl --context "$CTX" apply -f {{.SB_OVERLAY}}/property-list-azure.yaml
          kubectl --context "$CTX" apply -f {{.SB_OVERLAY}}/consumer-topic-multi.yaml
          kubectl --context "$CTX" apply -f {{.SB_OVERLAY}}/split-config-multi.yaml
          kubectl --context "$CTX" rollout restart deploy/servicebus-multi-consumer -n {{.NAMESPACE}}
          kubectl --context "$CTX" rollout status deploy/servicebus-multi-consumer -n {{.NAMESPACE}} --timeout=120s
        done

  servicebus:multi:preview:start:
    desc: "Start a multi-topic preview env. NAME=prev-1 pins the cot-context-intercept-id filter to s*prev-1$ and uses prev-1 as the session key so several previews don't compete."
    interactive: true
    vars:
      NAME: '{{.NAME | default ""}}'
      PREVIEW_KEY: '{{.PREVIEW_KEY | default "mc-multi-preview"}}'
      PREVIEW_IMAGE: '{{.PREVIEW_IMAGE | default "servicebus-consumer:local"}}'
      PREVIEW_TIMEOUT: '{{.PREVIEW_TIMEOUT | default "300"}}'
      MULTI_PREVIEW_CONFIG: '{{.ROOT_DIR}}/k8s/overlays/servicebus-emulator/mirrord-preview-multi.json'
    preconditions:
      - sh: kubectl --context {{.REMOTE}} get deploy servicebus-multi-consumer -n {{.NAMESPACE}} >/dev/null 2>&1
        msg: "Multi-topic consumer missing on {{.REMOTE}} - run 'task multicluster:servicebus:multi:deploy' first"
    cmds:
      - |
        CFG="{{.MULTI_PREVIEW_CONFIG}}"
        KEY="{{.PREVIEW_KEY}}"
        if [ -n "{{.NAME}}" ]; then
          KEY="{{.NAME}}"
          CFG="/tmp/mirrord-preview-multi-{{.NAME}}.json"
          python3 - <<'PY'
        import json
        c = json.load(open("{{.MULTI_PREVIEW_CONFIG}}"))
        # Keep the client's property name; only pin it to this preview's key so
        # several previews don't compete, matching the base servicebus flow.
        for split in c["feature"]["split_queues"].values():
            split["message_filter"] = {"cot-context-intercept-id": "s*{{.NAME}}$"}
        json.dump(c, open("/tmp/mirrord-preview-multi-{{.NAME}}.json", "w"), indent=2)
        PY
          echo "preview '{{.NAME}}': filter cot-context-intercept-id=s*{{.NAME}}$ (config $CFG)"
        fi
        if [ -z "${OPERATOR_ISOLATION_MARKER:-}" ] && pgrep -qf 'target/debug/operator-service'; then
          export OPERATOR_ISOLATION_MARKER=local-dev
          echo "operator:dev detected -> OPERATOR_ISOLATION_MARKER=local-dev"
        fi
        MIRRORD_KUBE_CONTEXT={{.PRIMARY}} MIRRORD_CHECK_VERSION=false \
          {{.MIRRORD_BIN}} preview start \
            -f "$CFG" \
            -i "{{.PREVIEW_IMAGE}}" \
            -k "$KEY" \
            --timeout {{.PREVIEW_TIMEOUT}}

  servicebus:multi:preview:stop:
    desc: "Stop a multi-topic preview env (NAME=prev-1, or PREVIEW_KEY for the default one)"
    vars:
      NAME: '{{.NAME | default ""}}'
      PREVIEW_KEY: '{{.PREVIEW_KEY | default "mc-multi-preview"}}'
    cmds:
      - |
        KEY="{{.NAME}}"
        [ -z "$KEY" ] && KEY="{{.PREVIEW_KEY}}"
        if [ -z "${OPERATOR_ISOLATION_MARKER:-}" ] && pgrep -qf 'target/debug/operator-service'; then
          export OPERATOR_ISOLATION_MARKER=local-dev
        fi
        MIRRORD_KUBE_CONTEXT={{.PRIMARY}} MIRRORD_CHECK_VERSION=false \
          {{.MIRRORD_BIN}} preview stop -k "$KEY" || true

  servicebus:multi:send:
    desc: "Publish to one topic (TOPIC=test-topic|test-topic-2 KEY=prev-1 [MESSAGE=...]). KEY sets the cot-context-intercept-id so it matches that preview's filter; omit KEY to hit the deployed consumer."
    silent: true
    vars:
      TOPIC: '{{.TOPIC | default "test-topic"}}'
      KEY: '{{.KEY | default ""}}'
      MESSAGE: '{{.MESSAGE | default "multi-topic repro message"}}'
    preconditions:
      - sh: kubectl --context {{.REMOTE}} get secret servicebus-azure-conn -n {{.NAMESPACE}} >/dev/null 2>&1
        msg: "Secret missing on {{.REMOTE}}. Run: task multicluster:servicebus:multi:secret"
    cmds:
      - |
        CONN=$(kubectl --context {{.REMOTE}} get secret servicebus-azure-conn -n {{.NAMESPACE}} -o jsonpath='{.data.connection_string}' | base64 -d)
        INTERCEPT="{{.KEY}}"
        BODY='{"order_id":"ORD-001","message":"{{.MESSAGE}}"}'
        PROPS=""
        [ -n "$INTERCEPT" ] && PROPS="cot-context-intercept-id=$INTERCEPT"
        kubectl --context {{.REMOTE}} run sb-multi-sender-$RANDOM --rm -i --restart=Never \
          --image=servicebus-consumer:local \
          --image-pull-policy=Never \
          --namespace={{.NAMESPACE}} \
          --env="SEND_MODE=true" \
          --env="SERVICEBUS_CONNECTION_STRING=$CONN" \
          --env="SEND_TOPIC={{.TOPIC}}" \
          --env="MESSAGE_BODY=$BODY" \
          --env="MESSAGE_PROPERTIES=$PROPS" \
          -- /app/consumer >/dev/null 2>&1
        if [ -n "$INTERCEPT" ]; then
          echo "published to {{.TOPIC}} (cot-context-intercept-id=$INTERCEPT -> preview '$INTERCEPT')"
        else
          echo "published to {{.TOPIC}} (no intercept id -> deployed consumer)"
        fi

  servicebus:multi:azure:subs:
    desc: "List Azure subscriptions + their rules for both repro topics (needs az + AZURE_SB_RG/AZURE_SB_NAMESPACE). This is where the $Default vs mirrord-session state shows up."
    silent: true
    vars:
      AZ_RG: '{{.AZURE_SB_RG | default ""}}'
      AZ_NS: '{{.AZURE_SB_NAMESPACE | default ""}}'
    cmds:
      - |
        if [ -z "{{.AZ_RG}}" ] || [ -z "{{.AZ_NS}}" ] || ! az account show >/dev/null 2>&1; then
          echo "Set AZURE_SB_RG + AZURE_SB_NAMESPACE in .env and run 'az login' first."; exit 1
        fi
        for T in test-topic test-topic-2; do
          echo "=== topic $T ==="
          for S in $(az servicebus topic subscription list -g {{.AZ_RG}} --namespace-name {{.AZ_NS}} --topic-name "$T" --query "[].name" -o tsv); do
            RULES=$(az servicebus topic subscription rule list -g {{.AZ_RG}} --namespace-name {{.AZ_NS}} \
              --topic-name "$T" --subscription-name "$S" --query "[].name" -o tsv | tr '\n' ',' | sed 's/,$//')
            echo "  $S  [rules: $RULES]"
          done
          echo ""
        done

  servicebus:multi:status:
    desc: Show multi-topic preview sessions, preview pods and split state on both clusters
    silent: true
    cmds:
      - |
        for CTX in {{.PRIMARY}} {{.REMOTE}}; do
          echo "=== $CTX ==="
          echo "preview sessions:"
          kubectl --context "$CTX" get previewsessions -A 2>/dev/null || echo "  none"
          echo "split sessions:"
          kubectl --context "$CTX" get mirrordclustersplitsessions -A 2>/dev/null || echo "  none"
          echo "preview pods:"
          kubectl --context "$CTX" get pods -n {{.NAMESPACE}} -l preview.metalbear.co/session-uid 2>/dev/null || echo "  none"
          echo ""
        done

  servicebus:multi:logs:
    desc: Tail the deployed multi-topic consumer logs (remote cluster)
    cmds:
      - kubectl --context {{.REMOTE}} logs -n {{.NAMESPACE}} -l app=servicebus-multi-consumer --tail=100 -f

  servicebus:multi:clean:
    desc: "Remove the multi-topic consumer + split config (keeps secrets + Azure topics). CLUSTERS=remote|primary|both (default: both)."
    vars:
      CLUSTERS: '{{.CLUSTERS | default "both"}}'
    cmds:
      - |
        case "{{.CLUSTERS}}" in
          remote)  CTXS="{{.REMOTE}}";;
          primary) CTXS="{{.PRIMARY}}";;
          both)    CTXS="{{.PRIMARY}} {{.REMOTE}}";;
          *) echo "CLUSTERS must be remote|primary|both (got '{{.CLUSTERS}}')"; exit 1;;
        esac
        for CTX in $CTXS; do
          echo "=== cleaning multi-topic consumer from $CTX ==="
          kubectl --context "$CTX" delete -f {{.SB_OVERLAY}}/split-config-multi.yaml --ignore-not-found=true
          kubectl --context "$CTX" delete -f {{.SB_OVERLAY}}/consumer-topic-multi.yaml --ignore-not-found=true
        done

  # ── Preview environment (SQS via shared LocalStack, multicluster) ─────────
  # Same flow as the servicebus preview tasks, but on SQS: one LocalStack on
  # the DEFAULT cluster (the primary in the current install — see DEFAULT_CTX),
  # shared by every cluster over the docker network; the sqs-consumer deployed
  # on BOTH workload clusters; and a preview pod spun up from an image on the
  # default cluster. The other clusters get split-only PreviewSession copies
  # so filter-matching messages (attribute `type`) reach the preview pod no
  # matter which cluster's consumer would have polled them; everything else
  # stays with the deployed consumers.
  # Config: k8s/overlays/multicluster-sqs/mirrord-preview.json
  #
  #   task multicluster:sqs:deploy                # localstack + consumers + registry
  #   task multicluster:sqs:preview:start         # preview pod (filter type=^premium$)
  #   task multicluster:sqs:preview:start NAME=prev-1   # own filter type=^prev-1
  #   task multicluster:sqs:send:match            # type=premium -> preview pod
  #   task multicluster:sqs:send:nomatch          # type=basic   -> deployed consumer
  #   task multicluster:sqs:send:to NAME=prev-1   # -> that named preview only
  #   task multicluster:sqs:preview:logs / status / stop / clean

  sqs:deploy:
    desc: "Deploy the shared-LocalStack SQS test env: LocalStack on the DEFAULT cluster (primary unless MC_DEFAULT_CTX overrides), sqs-consumer on BOTH clusters, queue registry on primary"
    cmds:
      - task: _sqs:deploy:localstack
      # Point BOTH operators' SQS clients at this LocalStack. The endpoint is
      # baked into the operator deployments (and operator:dev inherits it via
      # mirrord's env), so a LocalStack that moved clusters leaves stale
      # endpoints behind — the split then fails with "connection reset".
      - task: _sqs:operator:env
      - task: _sqs:deploy:consumers
      # Registry on the primary; the broadcast sync controller replicates it to
      # the members. 2-cluster: the primary is a workload cluster, so the plain
      # namespaced variant lives in the test namespace directly. 3-cluster: the
      # primary is management-only, so the CR goes into the operator namespace
      # with the target-namespace annotation.
      - |
        if [ "{{.MC_CLUSTERS}}" = "3" ]; then
          kubectl --context {{.PRIMARY}} apply -f {{.ROOT_DIR}}/k8s/overlays/multicluster-sqs/queue-registry-operator-ns.yaml
        else
          kubectl --context {{.PRIMARY}} apply -f {{.ROOT_DIR}}/k8s/overlays/multicluster-sqs/queue-registry.yaml
        fi

  _sqs:operator:env:
    internal: true
    cmds:
      - |
        set -euo pipefail
        LOCALSTACK_IP=$(docker inspect {{.DEFAULT_CTX}} --format '{{`{{index .NetworkSettings.Networks "mirrord-primary" "IPAddress"}}`}}')
        LOCALSTACK_URL="http://${LOCALSTACK_IP}:31566"
        for CTX in {{.ALL_CTXS}}; do
          echo "=== $CTX: pointing the operator at $LOCALSTACK_URL ==="
          kubectl --context "$CTX" set env deployment/mirrord-operator -n mirrord \
            OPERATOR_SQS_SPLITTING=true \
            AWS_ENDPOINT_URL="$LOCALSTACK_URL" \
            AWS_REGION=us-east-1 \
            AWS_ACCESS_KEY_ID=test \
            AWS_SECRET_ACCESS_KEY=test
          kubectl --context "$CTX" rollout status deployment/mirrord-operator -n mirrord --timeout=120s
        done

  _sqs:deploy:localstack:
    internal: true
    # One LocalStack, on the DEFAULT cluster, shared by every cluster over the
    # docker network via NodePort 31566 (mimics one AWS SQS in production).
    cmds:
      - |
        set -euo pipefail
        echo "=== {{.DEFAULT_CTX}}: deploying shared LocalStack ==="
        kubectl --context {{.DEFAULT_CTX}} create namespace localstack --dry-run=client -o yaml | kubectl --context {{.DEFAULT_CTX}} apply -f -
        kubectl --context {{.DEFAULT_CTX}} create configmap localstack-init \
          --from-file=init.sh={{.ROOT_DIR}}/k8s/overlays/multicluster-sqs/init.sh \
          -n localstack --dry-run=client -o yaml | kubectl --context {{.DEFAULT_CTX}} apply -f -
        kubectl --context {{.DEFAULT_CTX}} apply -f {{.ROOT_DIR}}/k8s/overlays/multicluster-sqs/localstack-single.yaml -n localstack
        kubectl --context {{.DEFAULT_CTX}} wait --for=condition=available deploy/localstack -n localstack --timeout=120s

        echo "Creating shared test-queue..."
        kubectl --context {{.DEFAULT_CTX}} exec -n localstack deploy/localstack -- \
          awslocal sqs create-queue --queue-name test-queue \
            --attributes ReceiveMessageWaitTimeSeconds=5,VisibilityTimeout=30 \
          2>/dev/null || true
        kubectl --context {{.DEFAULT_CTX}} exec -n localstack deploy/localstack -- \
          awslocal sqs list-queues

  _sqs:deploy:consumers:
    internal: true
    # The consumer runs on BOTH workload clusters — that's the whole point of
    # the multicluster preview test: a message polled by EITHER cluster's
    # consumer must still reach the preview pod when it matches the filter.
    cmds:
      - "{{.CONTAINER_RUNTIME}} build -t sqs-consumer:latest {{.ROOT_DIR}}/apps/sqs-consumer"
      - |
        set -euo pipefail
        # LocalStack is a NodePort on the DEFAULT cluster; use its IP on the
        # shared "mirrord-primary" docker network so every cluster reaches it.
        LOCALSTACK_IP=$(docker inspect {{.DEFAULT_CTX}} --format '{{`{{index .NetworkSettings.Networks "mirrord-primary" "IPAddress"}}`}}')
        LOCALSTACK_URL="http://${LOCALSTACK_IP}:31566"
        echo "LocalStack URL: $LOCALSTACK_URL"

        for CTX in {{.WORKLOAD_CTXS}}; do
          echo "=== $CTX: deploying sqs-consumer ==="
          minikube -p "$CTX" image load sqs-consumer:latest 2>/dev/null || true
          kubectl --context "$CTX" create namespace test-multicluster --dry-run=client -o yaml | kubectl --context "$CTX" apply -f -
          cat <<EOF | kubectl --context "$CTX" apply -f -
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: sqs-consumer
          namespace: test-multicluster
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: sqs-consumer
          template:
            metadata:
              labels:
                app: sqs-consumer
            spec:
              containers:
              - name: sqs-consumer
                image: sqs-consumer:latest
                imagePullPolicy: Never
                env:
                - name: QUEUE_NAME
                  value: "test-queue"
                - name: AWS_ACCESS_KEY_ID
                  value: "test"
                - name: AWS_SECRET_ACCESS_KEY
                  value: "test"
                - name: AWS_REGION
                  value: "us-east-1"
                - name: AWS_ENDPOINT_URL
                  value: "$LOCALSTACK_URL"
                - name: CLUSTER_ID
                  value: "$CTX"
        EOF
          kubectl --context "$CTX" rollout status deploy/sqs-consumer -n test-multicluster --timeout=120s
        done
        echo ""
        echo "sqs-consumer running on: {{.WORKLOAD_CTXS}}, all polling $LOCALSTACK_URL"

  sqs:preview:start:
    desc: "Start an SQS preview env (NAME=prev-1 gives it its OWN filter type=^prev-1 so you can run several and target each; without NAME uses the default ^premium$ filter)"
    interactive: true
    vars:
      NAME: '{{.NAME | default ""}}'
      PREVIEW_KEY: '{{.PREVIEW_KEY | default "mc-sqs-preview"}}'
      PREVIEW_IMAGE: '{{.PREVIEW_IMAGE | default "sqs-consumer:latest"}}'
      PREVIEW_TIMEOUT: '{{.PREVIEW_TIMEOUT | default "300"}}'
      MC_SQS_PREVIEW_CONFIG: '{{.MC_SQS_PREVIEW_CONFIG | default (print .ROOT_DIR "/k8s/overlays/multicluster-sqs/mirrord-preview.json")}}'
    preconditions:
      # The preview target resolves on the DEFAULT cluster — that's where the
      # pod template is copied from and the preview pod runs.
      - sh: kubectl --context {{.DEFAULT_CTX}} get deploy sqs-consumer -n test-multicluster >/dev/null 2>&1
        msg: "Target sqs-consumer missing on {{.DEFAULT_CTX}} (the default cluster) — run 'task multicluster:sqs:deploy' first"
    cmds:
      - |
        CFG="{{.MC_SQS_PREVIEW_CONFIG}}"
        KEY="{{.PREVIEW_KEY}}"
        # NAME=prev-1: generate a per-preview config whose split filter only
        # matches type values starting with that name. Each named preview then
        # receives ONLY its own messages (task multicluster:sqs:send:to
        # NAME=prev-1), and previews don't compete with each other.
        if [ -n "{{.NAME}}" ]; then
          KEY="{{.NAME}}"
          CFG="/tmp/mirrord-preview-sqs-{{.NAME}}.json"
          python3 - <<'PY'
        import json
        c = json.load(open("{{.MC_SQS_PREVIEW_CONFIG}}"))
        # Retarget every split entry, whatever its key is, so the config's
        # queue key stays authoritative and this helper doesn't need to know it.
        for split in c["feature"]["split_queues"].values():
            split["message_filter"] = {"type": "^{{.NAME}}-"}
        json.dump(c, open("/tmp/mirrord-preview-sqs-{{.NAME}}.json", "w"), indent=2)
        PY
          echo "preview '{{.NAME}}': filter type=^{{.NAME}}- (config $CFG)"
        fi
        # Same marker rule as the servicebus flow — with operator:dev running,
        # the preview session must be labeled so YOUR operator handles it.
        if [ -z "${OPERATOR_ISOLATION_MARKER:-}" ] && pgrep -qf 'target/debug/operator-service'; then
          export OPERATOR_ISOLATION_MARKER=local-dev
          echo "operator:dev detected -> OPERATOR_ISOLATION_MARKER=local-dev"
        fi
        MIRRORD_KUBE_CONTEXT={{.PRIMARY}} MIRRORD_CHECK_VERSION=false \
          {{.MIRRORD_BIN}} preview start \
            -f "$CFG" \
            -i "{{.PREVIEW_IMAGE}}" \
            -k "$KEY" \
            --timeout {{.PREVIEW_TIMEOUT}}

  sqs:preview:stop:
    desc: "Stop an SQS preview env (NAME=prev-1, or PREVIEW_KEY for the default one)"
    vars:
      NAME: '{{.NAME | default ""}}'
      PREVIEW_KEY: '{{.PREVIEW_KEY | default "mc-sqs-preview"}}'
    cmds:
      - |
        KEY="{{.NAME}}"
        [ -z "$KEY" ] && KEY="{{.PREVIEW_KEY}}"
        if [ -z "${OPERATOR_ISOLATION_MARKER:-}" ] && pgrep -qf 'target/debug/operator-service'; then
          export OPERATOR_ISOLATION_MARKER=local-dev
        fi
        MIRRORD_KUBE_CONTEXT={{.PRIMARY}} MIRRORD_CHECK_VERSION=false \
          {{.MIRRORD_BIN}} preview stop -k "$KEY" || true

  sqs:send:match:
    desc: 'Send an SQS message matching the default filter -> preview pod (MESSAGE=...)'
    cmds:
      - task: sqs:send
        vars:
          TYPE: "premium"
          MESSAGE: '{{.MESSAGE | default "match: hello preview pod (mc sqs)"}}'

  sqs:send:nomatch:
    desc: 'Send an SQS message NOT matching the filter -> deployed consumer (MESSAGE=...)'
    cmds:
      - task: sqs:send
        vars:
          TYPE: "basic"
          MESSAGE: '{{.MESSAGE | default "nomatch: hello deployed consumer (mc sqs)"}}'

  sqs:send:to:
    desc: 'Send a message to ONE named preview env (NAME=prev-1 [MESSAGE=...])'
    preconditions:
      - sh: test -n "{{.NAME}}"
        msg: "NAME is required, e.g. task multicluster:sqs:send:to NAME=prev-1"
    cmds:
      - task: sqs:send
        vars:
          TYPE: "{{.NAME}}-user"
          MESSAGE: '{{.MESSAGE | default (print "hello preview " .NAME)}}'

  sqs:send:
    desc: 'Send to the shared test-queue with explicit routing (TYPE=... MESSAGE=...)'
    silent: true
    vars:
      TYPE: '{{.TYPE | default "premium"}}'
      MESSAGE: '{{.MESSAGE | default "Test message"}}'
    preconditions:
      - sh: kubectl --context {{.DEFAULT_CTX}} get deploy localstack -n localstack >/dev/null 2>&1
        msg: "LocalStack missing on {{.DEFAULT_CTX}}. Run: task multicluster:sqs:deploy"
    cmds:
      - |
        BODY='{"order_id":"ORD-001","type":"{{.TYPE}}","message":"{{.MESSAGE}}"}'
        kubectl --context {{.DEFAULT_CTX}} exec -n localstack deploy/localstack -- \
          awslocal sqs send-message \
            --queue-url http://localhost:4566/000000000000/test-queue \
            --message-body "$BODY" \
            --message-attributes '{"type":{"DataType":"String","StringValue":"{{.TYPE}}"}}' >/dev/null
        case "{{.TYPE}}" in
          premium|prev*|*-user) echo "sent '{{.MESSAGE}}' to test-queue (type={{.TYPE}} -> preview pod)";;
          *)                    echo "sent '{{.MESSAGE}}' to test-queue (type={{.TYPE}} -> deployed consumer)";;
        esac

  sqs:preview:status:
    desc: Show SQS preview sessions, preview pods and split state on both clusters
    silent: true
    cmds:
      - |
        for CTX in {{.ALL_CTXS}}; do
          echo "=== $CTX ==="
          echo "preview sessions:"
          kubectl --context "$CTX" get previewsessions -A 2>/dev/null || echo "  none"
          echo "preview pods:"
          kubectl --context "$CTX" get pods -n test-multicluster -l preview.metalbear.co/session-uid 2>/dev/null || echo "  none"
          echo "split sessions:"
          kubectl --context "$CTX" get mirrordclustersplitsessions -A 2>/dev/null || echo "  none"
          echo ""
        done

  sqs:preview:logs:
    desc: Tail the SQS preview pod logs (it runs on the DEFAULT cluster)
    cmds:
      - kubectl --context {{.DEFAULT_CTX}} logs -n test-multicluster -l preview.metalbear.co/session-uid --tail=100 -f

  sqs:consumer:logs:
    desc: "Tail the deployed sqs-consumer logs (CLUSTER=... overrides; defaults to the remote — the interesting one for cross-cluster splits)"
    vars:
      CLUSTER: '{{.CLUSTER | default ""}}'
    cmds:
      - kubectl --context {{.CLUSTER | default .REMOTE}} logs -n test-multicluster -l app=sqs-consumer --tail=100 -f

  sqs:preview:clean:
    desc: Delete all SQS preview sessions + preview pods on both clusters
    cmds:
      - |
        for CTX in {{.ALL_CTXS}}; do
          echo "=== cleaning previews on $CTX ==="
          kubectl --context "$CTX" delete previewsessions --all -A 2>/dev/null || true
          kubectl --context "$CTX" delete pods -n test-multicluster -l preview.metalbear.co/session-uid 2>/dev/null || true
        done

  # ------------------------------------------------------------------------
  # HTTP preview across clusters.
  #
  # Deploys the same echo-app on EVERY workload cluster (each answering
  # "Hello from <cluster>"), then starts a preview targeting deploy/echo-app.
  # The preview pod answers "Hello from preview-pod", so every response tells
  # you exactly who served it:
  #
  #   task multicluster:http:deploy          echo-app on all workload clusters
  #   task multicluster:http:preview:start   preview on the DEFAULT cluster
  #   task multicluster:http:send:default    header request via the default
  #                                          cluster -> "Hello from preview-pod"
  #   task multicluster:http:send:remote     header request via a remote
  #                                          cluster -> "Hello from <remote>"
  #                                          (previews do NOT intercept HTTP on
  #                                          non-default clusters - the current
  #                                          multicluster gap this proves)
  #   task multicluster:http:test            scripted end-to-end of the above
  #   task multicluster:http:preview:stop / http:clean
  http:deploy:
    desc: Build the echo-app and deploy it on EVERY workload cluster (CLUSTER_ID = the cluster's name)
    cmds:
      - "{{.CONTAINER_RUNTIME}} build -t echo-app:latest {{.ROOT_DIR}}/apps/echo-app"
      - |
        for CTX in {{.WORKLOAD_CTXS}}; do
          echo "=== $CTX ==="
          minikube -p "$CTX" image load echo-app:latest
          kubectl --context "$CTX" create namespace {{.NAMESPACE}} --dry-run=client -o yaml \
            | kubectl --context "$CTX" apply -f -
          kubectl --context "$CTX" apply -n {{.NAMESPACE}} -f - <<YAML
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: echo-app
          labels:
            app: echo-app
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: echo-app
          template:
            metadata:
              labels:
                app: echo-app
            spec:
              containers:
              - name: echo
                image: echo-app:latest
                imagePullPolicy: Never
                ports:
                - containerPort: 8080
                env:
                - name: CLUSTER_ID
                  value: "$CTX"
                - name: PORT
                  value: "8080"
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: echo-app
        spec:
          selector:
            app: echo-app
          ports:
          - port: 8080
            targetPort: 8080
        YAML
          kubectl --context "$CTX" wait --for=condition=available deploy/echo-app \
            -n {{.NAMESPACE}} --timeout=120s
        done

  http:preview:start:
    desc: Start a preview env targeting echo-app (pods land on the DEFAULT cluster; answers "Hello from preview-pod")
    interactive: true
    vars:
      PREVIEW_KEY: '{{.PREVIEW_KEY | default "mc-http-preview"}}'
      PREVIEW_IMAGE: '{{.PREVIEW_IMAGE | default "echo-app:latest"}}'
      PREVIEW_TIMEOUT: '{{.PREVIEW_TIMEOUT | default "300"}}'
    preconditions:
      - sh: kubectl --context {{.DEFAULT_CTX}} get deploy echo-app -n {{.NAMESPACE}} >/dev/null 2>&1
        msg: "echo-app missing on {{.DEFAULT_CTX}} - run 'task multicluster:http:deploy' first"
    cmds:
      - |
        # Same marker rule as the other preview tasks - with operator:dev
        # running, the session must be labeled so YOUR operator handles it.
        if [ -z "${OPERATOR_ISOLATION_MARKER:-}" ] && pgrep -qf 'target/debug/operator-service'; then
          export OPERATOR_ISOLATION_MARKER=local-dev
          echo "operator:dev detected -> OPERATOR_ISOLATION_MARKER=local-dev"
        fi
        MIRRORD_KUBE_CONTEXT={{.PRIMARY}} MIRRORD_CHECK_VERSION=false \
          {{.MIRRORD_BIN}} preview start \
            -f {{.ROOT_DIR}}/apps/echo-app/mirrord-preview-mc.json \
            -i "{{.PREVIEW_IMAGE}}" \
            -k "{{.PREVIEW_KEY}}" \
            --timeout {{.PREVIEW_TIMEOUT}}

  http:send:
    desc: "Send one X-Preview request through a chosen cluster's echo-app (CTX=<kube-context>)"
    vars:
      PREVIEW_KEY: '{{.PREVIEW_KEY | default "mc-http-preview"}}'
    preconditions:
      - sh: test -n "{{.CTX}}"
        msg: "CTX is required, e.g. task multicluster:http:send CTX=mirrord-remote-1"
    cmds:
      - |
        echo "sending 'X-Preview: {{.PREVIEW_KEY}}' request via {{.CTX}}..."
        RESPONSE=$(kubectl --context {{.CTX}} exec -n {{.NAMESPACE}} deploy/echo-app -- \
          wget -q -O- -T 60 --header="X-Preview: {{.PREVIEW_KEY}}" \
          http://echo-app:8080/echo?from=mc-test 2>/dev/null | head -1)
        echo "response: $RESPONSE"

  http:send:default:
    desc: Header request via the DEFAULT cluster - should be answered by the preview ("Hello from preview-pod")
    cmds:
      - task: http:send
        vars: { CTX: '{{.DEFAULT_CTX}}', PREVIEW_KEY: '{{.PREVIEW_KEY | default "mc-http-preview"}}' }

  http:send:remote:
    desc: Header request via a REMOTE workload cluster - answered by the ORIGINAL remote app (previews don't intercept HTTP there)
    vars:
      PREVIEW_KEY: '{{.PREVIEW_KEY | default "mc-http-preview"}}'
    cmds:
      - |
        REMOTE_CTX=""
        for CTX in {{.WORKLOAD_CTXS}}; do
          [ "$CTX" != "{{.DEFAULT_CTX}}" ] && REMOTE_CTX="$CTX" && break
        done
        if [ -z "$REMOTE_CTX" ]; then
          echo "no non-default workload cluster in this topology (WORKLOAD_CTXS={{.WORKLOAD_CTXS}})"
          exit 1
        fi
        echo "sending 'X-Preview: {{.PREVIEW_KEY}}' request via $REMOTE_CTX..."
        RESPONSE=$(kubectl --context "$REMOTE_CTX" exec -n {{.NAMESPACE}} deploy/echo-app -- \
          wget -q -O- -T 60 --header="X-Preview: {{.PREVIEW_KEY}}" \
          http://echo-app:8080/echo?from=mc-test 2>/dev/null | head -1)
        echo "response: $RESPONSE"

  http:test:
    desc: End-to-end - prove HTTP reaches the preview via the DEFAULT cluster but bypasses it via a REMOTE cluster (needs http:deploy + http:preview:start)
    vars:
      PREVIEW_KEY: '{{.PREVIEW_KEY | default "mc-http-preview"}}'
    cmds:
      - |
        set -euo pipefail

        SESSION=$(kubectl --context {{.PRIMARY}} get previewsessions -A \
          -o jsonpath='{.items[?(@.spec.key=="{{.PREVIEW_KEY}}")].metadata.name}' | awk '{print $1}')
        if [ -z "$SESSION" ]; then
          echo "no preview session for key '{{.PREVIEW_KEY}}' - run 'task multicluster:http:preview:start' first"
          exit 1
        fi
        echo "preview session: $SESSION (pods on {{.DEFAULT_CTX}})"

        REMOTE_CTX=""
        for CTX in {{.WORKLOAD_CTXS}}; do
          [ "$CTX" != "{{.DEFAULT_CTX}}" ] && REMOTE_CTX="$CTX" && break
        done
        [ -n "$REMOTE_CTX" ] || { echo "no non-default workload cluster in this topology"; exit 1; }

        send() {
          kubectl --context "$1" exec -n {{.NAMESPACE}} deploy/echo-app -- \
            wget -q -O- -T 60 --header="X-Preview: {{.PREVIEW_KEY}}" \
            http://echo-app:8080/echo?from=mc-test 2>/dev/null | head -1
        }

        echo
        echo "==> via the DEFAULT cluster ({{.DEFAULT_CTX}}) - the steal lives here:"
        DEFAULT_RESPONSE=$(send {{.DEFAULT_CTX}})
        echo "    $DEFAULT_RESPONSE"
        case "$DEFAULT_RESPONSE" in
          *preview-pod*) echo "    OK: answered by the preview" ;;
          *) echo "    FAIL: expected the preview to answer on the default cluster"; exit 1 ;;
        esac

        echo
        echo "==> via the REMOTE cluster ($REMOTE_CTX) - no steal exists here:"
        REMOTE_RESPONSE=$(send "$REMOTE_CTX")
        echo "    $REMOTE_RESPONSE"
        case "$REMOTE_RESPONSE" in
          *preview-pod*)
            echo "    UNEXPECTED: the preview answered via the remote cluster -"
            echo "    cross-cluster HTTP interception works now; update this test's expectation!"
            exit 1 ;;
          *"$REMOTE_CTX"*)
            echo "    EXPECTED (current limitation): the ORIGINAL app on $REMOTE_CTX answered -"
            echo "    previews only intercept HTTP on the default cluster." ;;
          *) echo "    FAIL: unexpected response"; exit 1 ;;
        esac

        echo
        echo "Done. Stop the preview with: task multicluster:http:preview:stop"

  http:preview:stop:
    desc: Stop the HTTP preview env
    vars:
      PREVIEW_KEY: '{{.PREVIEW_KEY | default "mc-http-preview"}}'
    cmds:
      - |
        if [ -z "${OPERATOR_ISOLATION_MARKER:-}" ] && pgrep -qf 'target/debug/operator-service'; then
          export OPERATOR_ISOLATION_MARKER=local-dev
        fi
        MIRRORD_KUBE_CONTEXT={{.PRIMARY}} MIRRORD_CHECK_VERSION=false \
          {{.MIRRORD_BIN}} preview stop -k "{{.PREVIEW_KEY}}" || true

  http:clean:
    desc: Remove the echo-app from every workload cluster
    cmds:
      - |
        for CTX in {{.WORKLOAD_CTXS}}; do
          kubectl --context "$CTX" delete deploy/echo-app svc/echo-app \
            -n {{.NAMESPACE}} --ignore-not-found=true
        done


  # ===========================================================================
  # probe:* — interactive per-cluster replica preview demo. ONE app (preview-probe)
  # doing HTTP steal + SQS split + PG branch, replicated to every workload cluster.
  # Poke each cluster by hand to see replicas serve their OWN traffic.
  #
  #   task multicluster:probe:up               # build + deploy + start the preview
  #   task multicluster:probe:http:primary     # baggage GET on the primary -> its replica
  #   task multicluster:probe:http:remote      # baggage GET on the remote  -> its replica
  #   task multicluster:probe:sqs:match        # matched msg -> a replica consumes it
  #   task multicluster:probe:sqs:nomatch      # unmatched   -> the deployed consumer
  #   task multicluster:probe:db:remote        # remote replica insert+select via the proxy
  #   task multicluster:probe:db:primary       # primary replica insert+select (direct)
  #   task multicluster:probe:status / :logs CTX=... / :down
  # ===========================================================================
  probe:build:
    desc: "Build the preview-probe image (HTTP + SQS + PG in one app) and load it into all clusters"
    vars:
      IMG: '{{.PROBE_IMAGE | default "preview-probe:mc"}}'
    cmds:
      - docker build --platform linux/arm64 -t {{.IMG}} {{.ROOT_DIR}}/apps/preview-probe
      - for: { var: ALL_CTXS, split: " " }
        cmd: minikube -p "{{.ITEM}}" image load {{.IMG}}

  probe:deploy:
    desc: "Deploy the demo: LocalStack+queue (sqs:deploy), pg-source on the default cluster, combo-app on every cluster, queue registry"
    vars:
      IMG: '{{.PROBE_IMAGE | default "preview-probe:mc"}}'
      PROBE_DIR: '{{.ROOT_DIR}}/k8s/overlays/multicluster-probe'
    cmds:
      - task: sqs:deploy
      # The standalone sqs-consumer reads the same queue and would steal the split's matched
      # messages - park it (probe:down restores it).
      - for: { var: WORKLOAD_CTXS, split: " " }
        cmd: kubectl --context "{{.ITEM}}" -n test-multicluster scale deploy/sqs-consumer --replicas=0 >/dev/null 2>&1 || true
      - kubectl --context {{.DEFAULT_CTX}} -n test-multicluster apply -f {{.PROBE_DIR}}/pg-source.yaml
      - kubectl --context {{.DEFAULT_CTX}} -n test-multicluster rollout status deploy/pg-source --timeout=120s
      - |
        AWS_EP=$(kubectl --context {{.DEFAULT_CTX}} -n test-multicluster get deploy sqs-consumer -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="AWS_ENDPOINT_URL")].value}')
        for CTX in {{.WORKLOAD_CTXS}}; do
          sed -e "s|__IMG__|{{.IMG}}|g" -e "s|__CLUSTER__|$CTX|g" -e "s|__AWS_EP__|$AWS_EP|g" \
            {{.PROBE_DIR}}/combo-app.yaml | kubectl --context "$CTX" -n test-multicluster apply -f -
          kubectl --context "$CTX" -n test-multicluster rollout status deploy/combo-app --timeout=120s
        done
      - kubectl --context {{.DEFAULT_CTX}} -n test-multicluster apply -f {{.PROBE_DIR}}/split-config.yaml
      - echo "deployed. next -> task multicluster:probe:preview:start"

  probe:preview:start:
    desc: "Start ONE combined preview: HTTP steal + SQS split (type=^premium$) + PG branch, replicated to every cluster"
    interactive: true
    vars:
      KEY: '{{.KEY | default "prev-combo"}}'
      IMG: '{{.PROBE_IMAGE | default "preview-probe:mc"}}'
    cmds:
      - |
        if [ -z "${OPERATOR_ISOLATION_MARKER:-}" ] && pgrep -qf 'target/debug/operator-service'; then
          export OPERATOR_ISOLATION_MARKER=local-dev
          echo "operator:dev detected -> OPERATOR_ISOLATION_MARKER=local-dev"
        fi
        printf '%s\n' '{' \
          '  "target": { "path": "deployment/combo-app", "namespace": "test-multicluster" },' \
          '  "operator": true,' \
          '  "feature": {' \
          '    "preview": { "ttl_mins": 60, "creation_timeout_secs": 300 },' \
          '    "network": { "incoming": { "mode": "steal" } },' \
          '    "split_queues": { "test-queue": { "queue_type": "SQS", "message_filter": { "type": "^premium$" } } },' \
          '    "db_branches": [ { "id": "combo-db", "type": "pg", "version": "16", "name": "source_db",' \
          '      "ttl_secs": 3600, "creation_timeout_secs": 180,' \
          '      "connection": { "url": { "type": "env", "variable": "DATABASE_URL" } },' \
          '      "copy": { "mode": "all" } } ]' \
          '  }' \
          '}' > /tmp/mirrord-probe-combo.json
        MIRRORD_KUBE_CONTEXT={{.PRIMARY}} MIRRORD_CHECK_VERSION=false \
          {{.MIRRORD_BIN}} preview start -f /tmp/mirrord-probe-combo.json -i {{.IMG}} -k {{.KEY}} --timeout 300
      - echo "preview '{{.KEY}}' started -> try probe:http:remote / probe:db:remote / probe:sqs:match"

  probe:http:
    desc: "HTTP request to a cluster's combo-app (CTX=mirrord-remote-1 [MSG=hi] [BAGGAGE=1]); baggage=1 targets that cluster's REPLICA"
    silent: true
    vars:
      CTX: '{{.CTX | default "mirrord-remote-1"}}'
      MSG: '{{.MSG | default "hello"}}'
      KEY: '{{.KEY | default "prev-combo"}}'
      BAGGAGE: '{{.BAGGAGE | default "1"}}'
    cmds:
      - |
        PORT=18800
        kubectl --context {{.CTX}} -n test-multicluster port-forward deploy/combo-app $PORT:80 >/dev/null 2>&1 &
        PF=$!; trap "kill $PF 2>/dev/null" EXIT
        for _ in $(seq 1 20); do curl -sf -m 2 http://127.0.0.1:$PORT/health >/dev/null 2>&1 && break; sleep 1; done
        MARK="{{.MSG}}-$(date +%s)"
        if [ "{{.BAGGAGE}}" = 1 ]; then
          echo "-> baggage GET on {{.CTX}} (expect: served by {{.CTX}}'s REPLICA)"
          echo "   response: $(curl -s -H "baggage: mirrord-session={{.KEY}}" http://127.0.0.1:$PORT/log/$MARK)"
          sleep 2
          echo "   {{.CTX}} replica log line:"
          kubectl --context {{.CTX}} -n test-multicluster logs -l preview.metalbear.co/session-uid,app=combo-app --tail=300 2>/dev/null | grep "$MARK" | sed 's/^/     /' || echo "     (not yet - run again)"
        else
          echo "-> plain GET on {{.CTX}} (expect: served by the DEPLOYED app)"
          echo "   response: $(curl -s http://127.0.0.1:$PORT/log/$MARK)"
        fi

  probe:http:primary:
    desc: "Baggage HTTP on the PRIMARY cluster -> its own replica"
    cmds: [{ task: probe:http, vars: { CTX: '{{.PRIMARY}}', BAGGAGE: "1" } }]

  probe:http:remote:
    desc: "Baggage HTTP on the REMOTE cluster -> its own replica"
    cmds: [{ task: probe:http, vars: { CTX: '{{.REMOTE}}', BAGGAGE: "1" } }]

  probe:db:
    desc: "Insert+select on the branch via a cluster's REPLICA app (CTX=mirrord-remote-1); remote goes through the branch proxy"
    silent: true
    vars:
      CTX: '{{.CTX | default "mirrord-remote-1"}}'
      VAL: '{{.VAL | default "hello-branch"}}'
    cmds:
      - |
        RPOD=$(kubectl --context {{.CTX}} -n test-multicluster get pods -l preview.metalbear.co/session-uid,app=combo-app -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
        [ -n "$RPOD" ] || { echo "no replica pod on {{.CTX}} - is the preview started?"; exit 1; }
        PORT=18801
        kubectl --context {{.CTX}} -n test-multicluster port-forward "pod/$RPOD" $PORT:80 >/dev/null 2>&1 &
        PF=$!; trap "kill $PF 2>/dev/null" EXIT
        for _ in $(seq 1 30); do curl -sf -m 2 http://127.0.0.1:$PORT/health >/dev/null 2>&1 && break; sleep 1; done
        echo "-> {{.CTX}} replica DB host: $(curl -s http://127.0.0.1:$PORT/db/host)"
        VAL="{{.VAL}}-$(date +%s)"
        printf -- '-> INSERT %s : ' "$VAL"
        for _ in $(seq 1 15); do R=$(curl -sf -m 5 "http://127.0.0.1:$PORT/db/insert/$VAL" 2>/dev/null) && { echo "$R"; break; }; sleep 2; done
        echo "-> SELECT (branch contents, newest first):"
        curl -s http://127.0.0.1:$PORT/db/select | sed 's/^/   /'; echo

  probe:db:primary:
    desc: "Insert+select on the branch from the PRIMARY replica (direct pod IP)"
    cmds: [{ task: probe:db, vars: { CTX: '{{.PRIMARY}}' } }]

  probe:db:remote:
    desc: "Insert+select on the branch from the REMOTE replica (through the branch proxy)"
    cmds: [{ task: probe:db, vars: { CTX: '{{.REMOTE}}' } }]

  probe:sqs:send:
    desc: "Send an SQS message (TYPE=premium|basic MSG=...); premium is split to a replica, basic to the deployed consumer"
    silent: true
    vars:
      TYPE: '{{.TYPE | default "premium"}}'
      MSG: '{{.MSG | default "hello"}}'
    cmds:
      - |
        kubectl --context {{.DEFAULT_CTX}} exec -n localstack deploy/localstack -- \
          awslocal sqs send-message --queue-url http://localhost:4566/000000000000/test-queue \
            --message-body '{"type":"{{.TYPE}}","message":"{{.MSG}}"}' \
            --message-attributes '{"type":{"DataType":"String","StringValue":"{{.TYPE}}"}}' >/dev/null
        echo "sent type={{.TYPE}} '{{.MSG}}'  ->  watch: task multicluster:probe:logs CTX={{.REMOTE}}"

  probe:sqs:match:
    desc: "Send a MATCHED SQS message (type=premium) -> a replica consumes it"
    cmds: [{ task: probe:sqs:send, vars: { TYPE: "premium", MSG: '{{.MSG | default "match-to-a-replica"}}' } }]

  probe:sqs:nomatch:
    desc: "Send an UNMATCHED SQS message (type=basic) -> the deployed consumer"
    cmds: [{ task: probe:sqs:send, vars: { TYPE: "basic", MSG: '{{.MSG | default "nomatch-to-deployed"}}' } }]

  probe:sqs:burst:
    desc: "Send N numbered matched + N numbered unmatched SQS messages (N=5) - each body has a unique number so you can see the distribution"
    silent: true
    vars:
      N: '{{.N | default "5"}}'
    cmds:
      - |
        for i in $(seq 1 {{.N}}); do
          kubectl --context {{.DEFAULT_CTX}} exec -n localstack deploy/localstack --             awslocal sqs send-message --queue-url http://localhost:4566/000000000000/test-queue               --message-body "{\"type\":\"premium\",\"n\":$i}"               --message-attributes '{"type":{"DataType":"String","StringValue":"premium"}}' >/dev/null
          kubectl --context {{.DEFAULT_CTX}} exec -n localstack deploy/localstack --             awslocal sqs send-message --queue-url http://localhost:4566/000000000000/test-queue               --message-body "{\"type\":\"basic\",\"n\":$i}"               --message-attributes '{"type":{"DataType":"String","StringValue":"basic"}}' >/dev/null
        done
        echo "sent {{.N}} premium (n=1..{{.N}}) + {{.N}} basic (n=1..{{.N}})"
        echo "watch the split: task multicluster:probe:sqs:tally"

  probe:sqs:tally:
    desc: "Show which cluster's REPLICA consumed which premium n, and which DEPLOYED app got which basic n"
    silent: true
    cmds:
      - |
        echo "MATCHED (premium) -> replicas:"
        for CTX in {{.WORKLOAD_CTXS}}; do
          NS=$(kubectl --context "$CTX" -n test-multicluster logs -l preview.metalbear.co/session-uid,app=combo-app --tail=1000 2>/dev/null | grep 'type=premium' | grep -oE '"n":[0-9]+' | grep -oE '[0-9]+' | sort -n | uniq | tr '\n' ' ')
          printf '  %-20s n = %s\n' "$CTX" "$NS"
        done
        echo "UNMATCHED (basic) -> deployed apps:"
        for CTX in {{.WORKLOAD_CTXS}}; do
          NS=$(kubectl --context "$CTX" -n test-multicluster logs -l 'app=combo-app,!preview.metalbear.co/session-uid' --tail=1000 2>/dev/null | grep 'type=basic' | grep -oE '"n":[0-9]+' | grep -oE '[0-9]+' | sort -n | uniq | tr '\n' ' ')
          printf '  %-20s n = %s\n' "$CTX" "$NS"
        done

  probe:status:
    desc: "Show the preview copies, replica pods, split state and branch proxy on every cluster"
    silent: true
    cmds:
      - |
        for CTX in {{.ALL_CTXS}}; do
          echo "=== $CTX ==="
          echo "preview copies:"
          kubectl --context "$CTX" -n test-multicluster get previewsessions -o custom-columns='NAME:.metadata.name,PHASE:.status.phase,REPLICA:.metadata.labels.operator\.metalbear\.co/preview-replica' 2>/dev/null | sed 's/^/  /' || echo "  none"
          echo "replica pods:"
          kubectl --context "$CTX" -n test-multicluster get pods -l preview.metalbear.co/session-uid,app=combo-app --no-headers 2>/dev/null | sed 's/^/  /' || echo "  none"
          echo "branch proxy (remote clusters only):"
          kubectl --context "$CTX" -n test-multicluster get deploy 2>/dev/null | grep -- "-brdb-" | sed 's/^/  /' || echo "  (none - default cluster reaches the branch by pod IP)"
          echo ""
        done
        echo "=== queue splits (primary aggregates all clusters) ==="
        kubectl --context {{.PRIMARY}} get queuesplits -A 2>/dev/null | sed 's/^/  /' || echo "  none"

  probe:logs:
    desc: "Tail a cluster's REPLICA combo-app logs (CTX=mirrord-remote-1) - shows HTTP + DB + SQS lines, tagged by cluster"
    vars:
      CTX: '{{.CTX | default "mirrord-remote-1"}}'
    cmds:
      - kubectl --context {{.CTX}} -n test-multicluster logs -l preview.metalbear.co/session-uid,app=combo-app --tail=120 -f

  probe:preview:stop:
    desc: "Stop the combined preview (KEY=prev-combo)"
    vars:
      KEY: '{{.KEY | default "prev-combo"}}'
    cmds:
      - |
        if [ -z "${OPERATOR_ISOLATION_MARKER:-}" ] && pgrep -qf 'target/debug/operator-service'; then export OPERATOR_ISOLATION_MARKER=local-dev; fi
        MIRRORD_KUBE_CONTEXT={{.PRIMARY}} MIRRORD_CHECK_VERSION=false {{.MIRRORD_BIN}} preview stop -k {{.KEY}} || true

  probe:up:
    desc: "One-shot: build image + deploy + start the combined preview"
    cmds:
      - task: probe:build
      - task: probe:deploy
      - task: probe:preview:start

  probe:down:
    desc: "Tear down: stop the preview, remove combo-app/pg-source/registry, restore sqs-consumer"
    vars:
      KEY: '{{.KEY | default "prev-combo"}}'
    cmds:
      - task: probe:preview:stop
        vars: { KEY: '{{.KEY}}' }
      - |
        kubectl --context {{.DEFAULT_CTX}} -n test-multicluster delete mirrordsplitconfig combo-split-config --ignore-not-found >/dev/null 2>&1 || true
        kubectl --context {{.DEFAULT_CTX}} -n test-multicluster delete deploy/pg-source svc/pg-source --ignore-not-found >/dev/null 2>&1 || true
        for CTX in {{.WORKLOAD_CTXS}}; do
          kubectl --context "$CTX" -n test-multicluster delete deploy/combo-app svc/combo-app --ignore-not-found >/dev/null 2>&1 || true
          kubectl --context "$CTX" -n test-multicluster scale deploy/sqs-consumer --replicas=1 >/dev/null 2>&1 || true
        done
        echo "torn down."
