version: "3"

# GENERIC database branching (RFC 0008).
#
#   task generic:deploy               deploy Valkey + InfluxDB + both apps into the cluster
#   task generic:run:local            run the Valkey app locally under mirrord (creates a generic branch)
#   task generic:seed                 seed keys into the source (cluster) Valkey
#   task generic:query:source         query the source Valkey
#   task generic:query:branch         query the branch Valkey
#   task generic:verify               RFC 0008 checks: MIRRORD_PARAM_* env + secretKeyRef passthrough
#   task generic:influx:run:local     run the InfluxDB app locally under mirrord (InfluxDB branch)
#
# The branched service is Valkey - Redis-compatible, but a different image than mirrord's
# built-in Redis dialect assumes, which is exactly the generic feature's use case. The setup
# exercises the full generic surface:
#   - user-supplied image + args with $(MIRRORD_PARAM_*) references
#   - Secret-backed password resolved off the target pod (secretKeyRef passthrough -
#     the operator never reads the value)
#   - a custom `cache_name` extra param
#   - composite VALKEY_ADDR=host:port var rewritten in place via value_pattern
# The InfluxDB variant (the RFC's canonical example) adds env-based bootstrap
# (DOCKER_INFLUXDB_INIT_*), a direct Kubernetes Secret param source, a URL-shaped
# var rewritten by pattern, and the http_get readiness probe.
#
# Requires the operator to run with OPERATOR_GENERIC_BRANCHING=true
# (operator-values.yaml: genericBranching: true).
#
# Query examples (QUERY= takes any valkey-cli command):
#   task generic:query:source QUERY="KEYS *"
#   task generic:query:source QUERY="SET greeting 'written to source'"
#   task generic:query:branch QUERY="GET greeting"
#   task generic:query:branch QUERY="MGET greeting counter source"
#   task generic:influx:query:source
#   task generic:influx:query:branch

vars:
  ROOT_DIR:
    sh: git rev-parse --show-toplevel
  CLUSTER_NAME: '{{.CLUSTER_NAME | default "bearkube"}}'
  CONTAINER_RUNTIME: '{{.CONTAINER_RUNTIME | default "docker"}}'
  MIRRORD_BIN: '{{.MIRRORD_BIN | default "mirrord"}}'
  APP_DIR: '{{.ROOT_DIR}}/apps/generic-app'
  INFLUX_APP_DIR: '{{.ROOT_DIR}}/apps/influx-app'
  OPENSEARCH_APP_DIR: '{{.ROOT_DIR}}/apps/opensearch-app'
  OPENSEARCH_PASSWORD: 'Branch-Me-2024!'
  ES_APP_DIR: '{{.ROOT_DIR}}/apps/elasticsearch-app'
  ES_PASSWORD: 'Elastic-Branch-2024!'
  COCKROACH_APP_DIR: '{{.ROOT_DIR}}/apps/cockroach-app'
  CASSANDRA_APP_DIR: '{{.ROOT_DIR}}/apps/cassandra-app'
  AEROSPIKE_APP_DIR: '{{.ROOT_DIR}}/apps/aerospike-app'
  COUCHBASE_APP_DIR: '{{.ROOT_DIR}}/apps/couchbase-app'
  COUCHBASE_PASSWORD: 'branch-me-cb-2024'
  GENERIC_NAMESPACE: 'generic-test'
  VALKEY_PASSWORD: 'branch-me-if-you-can'
  INFLUX_TOKEN: 'sandbox-super-secret-token'
  INFLUX_ORG: 'metalbear'
  INFLUX_BUCKET: 'metrics'

tasks:
  deploy:
    desc: Deploy the generic test env (Valkey + InfluxDB + both apps)
    cmds:
      - "{{.CONTAINER_RUNTIME}} build -t generic-app:latest {{.APP_DIR}}"
      - minikube -p {{.CLUSTER_NAME}} image load generic-app:latest
      - "{{.CONTAINER_RUNTIME}} build -t influx-app:latest {{.INFLUX_APP_DIR}}"
      - minikube -p {{.CLUSTER_NAME}} image load influx-app:latest
      - "{{.CONTAINER_RUNTIME}} build -t opensearch-app:latest {{.OPENSEARCH_APP_DIR}}"
      - minikube -p {{.CLUSTER_NAME}} image load opensearch-app:latest
      - "{{.CONTAINER_RUNTIME}} build -t elasticsearch-app:latest {{.ES_APP_DIR}}"
      - minikube -p {{.CLUSTER_NAME}} image load elasticsearch-app:latest
      - "{{.CONTAINER_RUNTIME}} build -t cockroach-app:latest {{.COCKROACH_APP_DIR}}"
      - minikube -p {{.CLUSTER_NAME}} image load cockroach-app:latest
      - "{{.CONTAINER_RUNTIME}} build -t cassandra-app:latest {{.CASSANDRA_APP_DIR}}"
      - minikube -p {{.CLUSTER_NAME}} image load cassandra-app:latest
      - "{{.CONTAINER_RUNTIME}} build -t aerospike-app:latest {{.AEROSPIKE_APP_DIR}}"
      - minikube -p {{.CLUSTER_NAME}} image load aerospike-app:latest
      - "{{.CONTAINER_RUNTIME}} build -t couchbase-app:latest {{.COUCHBASE_APP_DIR}}"
      - minikube -p {{.CLUSTER_NAME}} image load couchbase-app:latest
      - kubectl apply -k {{.ROOT_DIR}}/k8s/generic
      # Generic branch pod resources (JVM services OOM on the 512Mi default) live in
      # configs/generic-branch-config.yaml, read locally by operator:dev via
      # OPERATOR_GENERIC_BRANCH_CONFIG in .mirrord/operator-dev.yaml - nothing to deploy.
      - task: _wait:valkey
      - task: _wait:app
      - task: _wait:influx
      - task: _wait:opensearch
      - task: _wait:elasticsearch
      - task: _wait:cockroach
      - task: _wait:cassandra
      - task: _wait:aerospike
      - task: _wait:couchbase

  run:local:
    desc: Run the Valkey app locally under mirrord (creates a generic branch; Ctrl-C to stop)
    interactive: true
    dir: apps/generic-app
    cmds:
      - go mod tidy && go build -o generic-app .
      - |
        # If operator:dev is running on this machine, label our resources with
        # its isolation marker so the LOCAL operator reconciles the branch —
        # unlabeled resources go to the deployed operator, which may not know
        # this branch type. An explicit OPERATOR_ISOLATION_MARKER always wins.
        if [ -z "${OPERATOR_ISOLATION_MARKER:-}" ] && pgrep -qf 'target/debug/operator-service'; then
          export OPERATOR_ISOLATION_MARKER=local-dev
          echo "operator:dev detected -> OPERATOR_ISOLATION_MARKER=local-dev"
        fi
        PORT=8080 {{.MIRRORD_BIN}} exec \
          -t deploy/generic-app \
          -n {{.GENERIC_NAMESPACE}} \
          -f mirrord-branch.json \
          -- ./generic-app

  seed:
    desc: Seed test data into the source (cluster) Valkey
    cmds:
      - |
        POD=$(kubectl get pod -n {{.GENERIC_NAMESPACE}} -l app=valkey-main -o jsonpath='{.items[0].metadata.name}')
        kubectl exec -n {{.GENERIC_NAMESPACE}} $POD -- valkey-cli -a '{{.VALKEY_PASSWORD}}' MSET \
          greeting "Hello from the SOURCE valkey!" \
          counter "42" \
          source "cluster"
        echo "Seeded 3 keys into the source Valkey"

  query:source:
    desc: 'Query the source (cluster) Valkey (default: key = value dump; QUERY= any valkey-cli command)'
    vars:
      QUERY: '{{.QUERY | default ""}}'
    cmds:
      - |
        set -f  # no globbing, so QUERY="KEYS *" passes the * through to valkey-cli
        POD=$(kubectl get pod -n {{.GENERIC_NAMESPACE}} -l app=valkey-main -o jsonpath='{.items[0].metadata.name}')
        echo ""
        echo "=== SOURCE VALKEY (cluster) ==="
        if [ -n "{{.QUERY}}" ]; then
          kubectl exec -n {{.GENERIC_NAMESPACE}} $POD -- valkey-cli -a '{{.VALKEY_PASSWORD}}' --no-auth-warning {{.QUERY}}
        else
          # No QUERY: dump keys WITH values (KEYS alone only lists names).
          kubectl exec -n {{.GENERIC_NAMESPACE}} $POD -- sh -c '
            KEYS=$(valkey-cli -a "{{.VALKEY_PASSWORD}}" --no-auth-warning KEYS "*")
            [ -z "$KEYS" ] && echo "(no keys)" && exit 0
            for k in $KEYS; do
              echo "  $k = $(valkey-cli -a "{{.VALKEY_PASSWORD}}" --no-auth-warning GET "$k")"
            done'
        fi

  query:branch:
    desc: 'Query the branch Valkey with the app''s password (default: key = value dump; QUERY= any valkey-cli command)'
    vars:
      QUERY: '{{.QUERY | default ""}}'
    cmds:
      - |
        set -f  # no globbing, so QUERY="KEYS *" passes the * through to valkey-cli
        CRD=$(kubectl get branchdatabases -n {{.GENERIC_NAMESPACE}} -o jsonpath='{range .items[?(@.spec.id=="valkey-generic-branch")]}{.metadata.name}{end}')
        POD=$(kubectl get pod -n {{.GENERIC_NAMESPACE}} -l db-owner-name=$CRD -o name 2>/dev/null | head -1)
        if [ -z "$POD" ]; then echo "No Valkey branch pod found. Run 'task generic:run:local' first."; exit 1; fi
        echo ""
        echo "=== BRANCH VALKEY ($POD) ==="
        echo '(authenticating with the SAME password the app uses - the MIRRORD_PARAM_PASSWORD bootstrap)'
        if [ -n "{{.QUERY}}" ]; then
          kubectl exec -n {{.GENERIC_NAMESPACE}} ${POD#pod/} -- valkey-cli -a '{{.VALKEY_PASSWORD}}' --no-auth-warning {{.QUERY}}
        else
          # No QUERY: dump keys WITH values (KEYS alone only lists names).
          kubectl exec -n {{.GENERIC_NAMESPACE}} ${POD#pod/} -- sh -c '
            KEYS=$(valkey-cli -a "{{.VALKEY_PASSWORD}}" --no-auth-warning KEYS "*")
            [ -z "$KEYS" ] && echo "(empty - a fresh branch starts with no keys)" && exit 0
            for k in $KEYS; do
              echo "  $k = $(valkey-cli -a "{{.VALKEY_PASSWORD}}" --no-auth-warning GET "$k")"
            done'
        fi

  verify:
    desc: "Verify the branch: MIRRORD_PARAM_* env, secretKeyRef passthrough, empty start"
    cmds:
      - task: verify:params
      - task: query:branch

  verify:connected:
    desc: "Prove the mirrord-run app (localhost:8080) talks to the BRANCH, not the source (IP + server run_id match)"
    silent: true
    cmds:
      - |
        set -e
        # Where does the app think it's connecting?
        APP_ADDR=$(curl -s --max-time 5 localhost:8080/info | sed -n 's/^VALKEY_ADDR = //p')
        APP_HOST=${APP_ADDR%:*}
        # The Valkey instance run_id the app is ACTUALLY talking to (unique per server process).
        APP_RUN_ID=$(curl -s --max-time 5 localhost:8080/info | sed -n 's/^run_id://p' | tr -d '\r')
        if [ -z "$APP_ADDR" ]; then echo "App not reachable on localhost:8080 - is 'task generic:run:local' running?"; exit 1; fi

        CRD=$(kubectl get branchdatabases -n {{.GENERIC_NAMESPACE}} -o jsonpath='{range .items[?(@.spec.id=="valkey-generic-branch")]}{.metadata.name}{end}')
        BRANCH_POD=$(kubectl get pod -n {{.GENERIC_NAMESPACE}} -l db-owner-name=$CRD -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
        BRANCH_IP=$(kubectl get pod -n {{.GENERIC_NAMESPACE}} $BRANCH_POD -o jsonpath='{.status.podIP}' 2>/dev/null)
        SOURCE_IP=$(kubectl get pod -n {{.GENERIC_NAMESPACE}} -l app=valkey-main -o jsonpath='{.items[0].status.podIP}')
        BRANCH_RUN_ID=$(kubectl exec -n {{.GENERIC_NAMESPACE}} $BRANCH_POD -- valkey-cli -a '{{.VALKEY_PASSWORD}}' --no-auth-warning INFO server 2>/dev/null | sed -n 's/^run_id://p' | tr -d '\r')

        echo "app connects to : $APP_ADDR (run_id ${APP_RUN_ID:-?})"
        echo "branch pod      : $BRANCH_POD @ ${BRANCH_IP:-?} (run_id ${BRANCH_RUN_ID:-?})"
        echo "source pod      : valkey-main @ $SOURCE_IP"
        echo ""
        if [ -n "$BRANCH_IP" ] && [ "$APP_HOST" = "$BRANCH_IP" ] && [ -n "$APP_RUN_ID" ] && [ "$APP_RUN_ID" = "$BRANCH_RUN_ID" ]; then
          echo "CONNECTED TO BRANCH ✓  (IP matches the branch pod AND the server run_id is identical)"
        elif [ "$APP_HOST" = "$SOURCE_IP" ] || [ "$APP_HOST" = "valkey-main" ]; then
          echo "CONNECTED TO SOURCE ✗  - redirection did not happen"
          exit 1
        else
          echo "INCONCLUSIVE - compare the values above manually"
          exit 1
        fi

  verify:params:
    desc: Show the branch pod's MIRRORD_PARAM_* env (password must be a secretKeyRef, not a value)
    cmds:
      - |
        CRD=$(kubectl get branchdatabases -n {{.GENERIC_NAMESPACE}} -o jsonpath='{range .items[?(@.spec.id=="valkey-generic-branch")]}{.metadata.name}{end}')
        POD=$(kubectl get pod -n {{.GENERIC_NAMESPACE}} -l db-owner-name=$CRD -o name 2>/dev/null | head -1)
        if [ -z "$POD" ]; then echo "No Valkey branch pod found. Run 'task generic:run:local' first."; exit 1; fi
        echo "=== Branch pod: $POD ==="
        echo ""
        echo "--- image + args ---"
        kubectl get -n {{.GENERIC_NAMESPACE}} $POD -o jsonpath='{.spec.containers[0].image}{"\n"}{.spec.containers[0].args}{"\n"}'
        echo ""
        echo "--- env (MIRRORD_PARAM_PASSWORD must show secretKeyRef, no plaintext) ---"
        kubectl get -n {{.GENERIC_NAMESPACE}} $POD -o jsonpath='{.spec.containers[0].env}' | python3 -m json.tool

  branches:
    desc: Show BranchDatabase CRDs + branch status via the CLI
    cmds:
      - kubectl get branchdatabases -n {{.GENERIC_NAMESPACE}} -o wide 2>/dev/null || echo "No BranchDatabase CRDs"
      - '{{.MIRRORD_BIN}} db-branches -n {{.GENERIC_NAMESPACE}} status 2>/dev/null || true'

  logs:
    desc: Tail the generic app logs
    cmds:
      - kubectl logs -n {{.GENERIC_NAMESPACE}} -l app=generic-app --tail=100 -f

  logs:branch:
    desc: Tail the branch Valkey pod logs
    cmds:
      - |
        CRD=$(kubectl get branchdatabases -n {{.GENERIC_NAMESPACE}} -o jsonpath='{range .items[?(@.spec.id=="valkey-generic-branch")]}{.metadata.name}{end}')
        POD=$(kubectl get pod -n {{.GENERIC_NAMESPACE}} -l db-owner-name=$CRD -o name 2>/dev/null | head -1)
        if [ -z "$POD" ]; then echo "No Valkey branch pod found."; exit 1; fi
        kubectl logs -n {{.GENERIC_NAMESPACE}} ${POD#pod/} --tail=100 -f

  status:
    desc: Show generic test environment status
    silent: true
    cmds:
      - echo "=== Source Valkey ==="
      - kubectl get pods -n {{.GENERIC_NAMESPACE}} -l app=valkey-main 2>/dev/null || echo "Not deployed"
      - echo ""
      - echo "=== App ==="
      - kubectl get pods -n {{.GENERIC_NAMESPACE}} -l app=generic-app 2>/dev/null || echo "Not deployed"
      - echo ""
      - echo "=== Branch pods ==="
      - kubectl get pods -n {{.GENERIC_NAMESPACE}} -l db-owner-name 2>/dev/null || echo "None"
      - echo ""
      - echo "=== BranchDatabase CRDs ==="
      - kubectl get branchdatabases -n {{.GENERIC_NAMESPACE}} 2>/dev/null || echo "None"

  clean:
    desc: Remove the generic test env from the cluster
    cmds:
      - kubectl delete branchdatabases -n {{.GENERIC_NAMESPACE}} --all --ignore-not-found=true 2>/dev/null || true
      - kubectl delete -k {{.ROOT_DIR}}/k8s/generic --ignore-not-found=true

  # --- InfluxDB variant (the RFC's canonical example) -------------------------------------
  # Exercises the surface the Valkey test doesn't: env-based bootstrap (DOCKER_INFLUXDB_INIT_*),
  # a DIRECT Kubernetes Secret param source (token comes from influx-creds, not from the pod
  # env), a URL-shaped var rewritten by pattern, and the http_get readiness probe.

  influx:run:local:
    desc: Run the InfluxDB app locally under mirrord (creates an InfluxDB branch; Ctrl-C to stop)
    interactive: true
    dir: apps/influx-app
    cmds:
      - go build -o influx-app .
      - |
        # If operator:dev is running on this machine, label our resources with
        # its isolation marker so the LOCAL operator reconciles the branch —
        # unlabeled resources go to the deployed operator, which may not know
        # this branch type. An explicit OPERATOR_ISOLATION_MARKER always wins.
        if [ -z "${OPERATOR_ISOLATION_MARKER:-}" ] && pgrep -qf 'target/debug/operator-service'; then
          export OPERATOR_ISOLATION_MARKER=local-dev
          echo "operator:dev detected -> OPERATOR_ISOLATION_MARKER=local-dev"
        fi
        PORT=8090 {{.MIRRORD_BIN}} exec \
          -t deploy/influx-app \
          -n {{.GENERIC_NAMESPACE}} \
          -f mirrord-branch.json \
          -- ./influx-app

  influx:seed:
    desc: Write a point into the SOURCE InfluxDB
    cmds:
      - |
        POD=$(kubectl get pod -n {{.GENERIC_NAMESPACE}} -l app=influxdb-main -o jsonpath='{.items[0].metadata.name}')
        kubectl exec -n {{.GENERIC_NAMESPACE}} $POD -- influx write \
          --org {{.INFLUX_ORG}} --bucket {{.INFLUX_BUCKET}} --token '{{.INFLUX_TOKEN}}' \
          "sandbox,writer=cluster value=42"
        echo "Seeded 1 point into the source InfluxDB"

  influx:query:source:
    desc: Query the SOURCE InfluxDB (last hour of points)
    cmds:
      - |
        POD=$(kubectl get pod -n {{.GENERIC_NAMESPACE}} -l app=influxdb-main -o jsonpath='{.items[0].metadata.name}')
        echo ""
        echo "=== SOURCE INFLUXDB (cluster) ==="
        kubectl exec -n {{.GENERIC_NAMESPACE}} $POD -- influx query \
          --org {{.INFLUX_ORG}} --token '{{.INFLUX_TOKEN}}' \
          'from(bucket:"{{.INFLUX_BUCKET}}") |> range(start:-1h)'

  influx:query:branch:
    desc: Query the BRANCH InfluxDB with the app's token (proves the setup-mode bootstrap)
    cmds:
      - |
        CRD=$(kubectl get branchdatabases -n {{.GENERIC_NAMESPACE}} -o jsonpath='{range .items[?(@.spec.id=="influx-generic-branch")]}{.metadata.name}{end}')
        POD=$(kubectl get pod -n {{.GENERIC_NAMESPACE}} -l db-owner-name=$CRD -o name 2>/dev/null | head -1)
        if [ -z "$POD" ]; then echo "No InfluxDB branch pod found. Run 'task generic:influx:run:local' first."; exit 1; fi
        echo ""
        echo "=== BRANCH INFLUXDB ($POD) ==="
        echo '(same org/bucket/token the app already uses - bootstrapped via MIRRORD_PARAM_*)'
        kubectl exec -n {{.GENERIC_NAMESPACE}} ${POD#pod/} -- influx query \
          --org {{.INFLUX_ORG}} --token '{{.INFLUX_TOKEN}}' \
          'from(bucket:"{{.INFLUX_BUCKET}}") |> range(start:-1h)' || echo "(no points yet - branch starts empty)"

  # --- OpenSearch variant ------------------------------------------------------------------
  # A heavyweight JVM service with HTTPS + security bootstrap. Exercises what the others
  # don't: the `exec` readiness probe (curl with the bootstrapped password INSIDE the branch
  # container), dotted env keys (`discovery.type`), and the admin resources override
  # (`genericBranchConfig.dbPod.resources` - the 512Mi default limit would OOM OpenSearch).

  opensearch:run:local:
    desc: Run the OpenSearch app locally under mirrord (creates an OpenSearch branch; Ctrl-C to stop)
    interactive: true
    dir: apps/opensearch-app
    cmds:
      - go build -o opensearch-app .
      - |
        if [ -z "${OPERATOR_ISOLATION_MARKER:-}" ] && pgrep -qf 'target/debug/operator-service'; then
          export OPERATOR_ISOLATION_MARKER=local-dev
          echo "operator:dev detected -> OPERATOR_ISOLATION_MARKER=local-dev"
        fi
        PORT=8095 {{.MIRRORD_BIN}} exec \
          -t deploy/opensearch-app \
          -n {{.GENERIC_NAMESPACE}} \
          -f mirrord-branch.json \
          -- ./opensearch-app

  opensearch:seed:
    desc: Index a doc into the SOURCE OpenSearch
    cmds:
      - |
        POD=$(kubectl get pod -n {{.GENERIC_NAMESPACE}} -l app=opensearch-main -o jsonpath='{.items[0].metadata.name}')
        kubectl exec -n {{.GENERIC_NAMESPACE}} $POD -- curl -sk -u 'admin:{{.OPENSEARCH_PASSWORD}}' \
          -X POST 'https://localhost:9200/sandbox/_doc?refresh=true' \
          -H 'Content-Type: application/json' \
          -d '{"writer":"cluster","msg":"seeded into the SOURCE opensearch"}'
        echo ""
        echo "Seeded 1 doc into the source OpenSearch"

  opensearch:query:source:
    desc: List docs in the SOURCE OpenSearch 'sandbox' index
    cmds:
      - |
        POD=$(kubectl get pod -n {{.GENERIC_NAMESPACE}} -l app=opensearch-main -o jsonpath='{.items[0].metadata.name}')
        echo ""
        echo "=== SOURCE OPENSEARCH (cluster) ==="
        kubectl exec -n {{.GENERIC_NAMESPACE}} $POD -- curl -sk -u 'admin:{{.OPENSEARCH_PASSWORD}}' \
          'https://localhost:9200/sandbox/_search?q=*&size=50&pretty' || echo "(no sandbox index)"

  opensearch:query:branch:
    desc: List docs in the BRANCH OpenSearch with the app's password (proves the security bootstrap)
    cmds:
      - |
        CRD=$(kubectl get branchdatabases -n {{.GENERIC_NAMESPACE}} -o jsonpath='{range .items[?(@.spec.id=="opensearch-generic-branch")]}{.metadata.name}{end}')
        POD=$(kubectl get pod -n {{.GENERIC_NAMESPACE}} -l db-owner-name=$CRD -o name 2>/dev/null | head -1)
        if [ -z "$POD" ]; then echo "No OpenSearch branch pod found. Run 'task generic:opensearch:run:local' first."; exit 1; fi
        echo ""
        echo "=== BRANCH OPENSEARCH ($POD) ==="
        echo '(authenticating with the SAME password the app uses - the MIRRORD_PARAM_PASSWORD bootstrap)'
        kubectl exec -n {{.GENERIC_NAMESPACE}} ${POD#pod/} -- curl -sk -u 'admin:{{.OPENSEARCH_PASSWORD}}' \
          'https://localhost:9200/sandbox/_search?q=*&size=50&pretty' || echo "(no sandbox index yet - a fresh branch starts empty)"

  _wait:opensearch:
    internal: true
    cmds:
      - echo "Waiting for OpenSearch + app (JVM boot takes a while)..."
      - kubectl wait --for=condition=ready pod -l app=opensearch-main -n {{.GENERIC_NAMESPACE}} --timeout=300s || true
      - kubectl wait --for=condition=ready pod -l app=opensearch-app -n {{.GENERIC_NAMESPACE}} --timeout=120s || true

  # --- Elasticsearch variant ---------------------------------------------------------------
  # ES 8 with security enabled (basic auth, TLS off for sandbox simplicity). Bootstrap via
  # the image's ELASTIC_PASSWORD mechanism = $(MIRRORD_PARAM_PASSWORD); identity proof via
  # per-cluster cluster_uuid. Local app on :8085.

  es:run:local:
    desc: Run the Elasticsearch app locally under mirrord (creates an ES branch; Ctrl-C to stop)
    interactive: true
    dir: apps/elasticsearch-app
    cmds:
      - go build -o elasticsearch-app .
      - |
        if [ -z "${OPERATOR_ISOLATION_MARKER:-}" ] && pgrep -qf 'target/debug/operator-service'; then
          export OPERATOR_ISOLATION_MARKER=local-dev
          echo "operator:dev detected -> OPERATOR_ISOLATION_MARKER=local-dev"
        fi
        PORT=8085 {{.MIRRORD_BIN}} exec \
          -t deploy/elasticsearch-app \
          -n {{.GENERIC_NAMESPACE}} \
          -f mirrord-branch.json \
          -- ./elasticsearch-app

  es:seed:
    desc: Index a doc into the SOURCE Elasticsearch
    cmds:
      - |
        POD=$(kubectl get pod -n {{.GENERIC_NAMESPACE}} -l app=elasticsearch-main -o jsonpath='{.items[0].metadata.name}')
        kubectl exec -n {{.GENERIC_NAMESPACE}} $POD -- curl -s -u 'elastic:{{.ES_PASSWORD}}' \
          -X POST 'http://localhost:9200/sandbox/_doc?refresh=true' \
          -H 'Content-Type: application/json' \
          -d '{"writer":"cluster","msg":"seeded into the SOURCE elasticsearch"}'
        echo ""
        echo "Seeded 1 doc into the source Elasticsearch"

  es:query:source:
    desc: List docs in the SOURCE Elasticsearch 'sandbox' index
    cmds:
      - |
        POD=$(kubectl get pod -n {{.GENERIC_NAMESPACE}} -l app=elasticsearch-main -o jsonpath='{.items[0].metadata.name}')
        echo ""
        echo "=== SOURCE ELASTICSEARCH (cluster) ==="
        kubectl exec -n {{.GENERIC_NAMESPACE}} $POD -- curl -s -u 'elastic:{{.ES_PASSWORD}}' \
          'http://localhost:9200/sandbox/_search?q=*&size=50&pretty' || echo "(no sandbox index)"

  es:query:branch:
    desc: List docs in the BRANCH Elasticsearch with the app's password (proves the ELASTIC_PASSWORD bootstrap)
    cmds:
      - |
        CRD=$(kubectl get branchdatabases -n {{.GENERIC_NAMESPACE}} -o jsonpath='{range .items[?(@.spec.id=="elasticsearch-generic-branch")]}{.metadata.name}{end}')
        POD=$(kubectl get pod -n {{.GENERIC_NAMESPACE}} -l db-owner-name=$CRD -o name 2>/dev/null | head -1)
        if [ -z "$POD" ]; then echo "No Elasticsearch branch pod found. Run 'task generic:es:run:local' first."; exit 1; fi
        echo ""
        echo "=== BRANCH ELASTICSEARCH ($POD) ==="
        echo '(authenticating with the SAME password the app uses - the MIRRORD_PARAM_PASSWORD bootstrap)'
        kubectl exec -n {{.GENERIC_NAMESPACE}} ${POD#pod/} -- curl -s -u 'elastic:{{.ES_PASSWORD}}' \
          'http://localhost:9200/sandbox/_search?q=*&size=50&pretty' || echo "(no sandbox index yet - a fresh branch starts empty)"

  # --- CockroachDB variant -------------------------------------------------------------------
  # The MINIMAL generic config: insecure single-node, no credentials - just image + port +
  # args + host/port patterns on a postgres-style URL. Also demos an http_get readiness probe
  # on a DIFFERENT port (8080 admin UI) than the redirected SQL port (26257). Local app on :8070.

  cockroach:run:local:
    desc: Run the CockroachDB app locally under mirrord (creates a CockroachDB branch; Ctrl-C to stop)
    interactive: true
    dir: apps/cockroach-app
    cmds:
      - go mod tidy && go build -o cockroach-app .
      - |
        if [ -z "${OPERATOR_ISOLATION_MARKER:-}" ] && pgrep -qf 'target/debug/operator-service'; then
          export OPERATOR_ISOLATION_MARKER=local-dev
          echo "operator:dev detected -> OPERATOR_ISOLATION_MARKER=local-dev"
        fi
        PORT=8070 {{.MIRRORD_BIN}} exec \
          -t deploy/cockroach-app \
          -n {{.GENERIC_NAMESPACE}} \
          -f mirrord-branch.json \
          -- ./cockroach-app

  cockroach:seed:
    desc: Insert a row into the SOURCE CockroachDB
    cmds:
      - |
        POD=$(kubectl get pod -n {{.GENERIC_NAMESPACE}} -l app=cockroach-main -o jsonpath='{.items[0].metadata.name}')
        kubectl exec -n {{.GENERIC_NAMESPACE}} $POD -- ./cockroach sql --insecure -e \
          "CREATE TABLE IF NOT EXISTS sandbox (id SERIAL PRIMARY KEY, writer STRING, msg STRING, ts TIMESTAMPTZ DEFAULT now()); INSERT INTO sandbox (writer, msg) VALUES ('cluster', 'seeded into the SOURCE cockroach');"
        echo "Seeded 1 row into the source CockroachDB"

  cockroach:query:source:
    desc: List rows in the SOURCE CockroachDB 'sandbox' table
    cmds:
      - |
        POD=$(kubectl get pod -n {{.GENERIC_NAMESPACE}} -l app=cockroach-main -o jsonpath='{.items[0].metadata.name}')
        echo ""
        echo "=== SOURCE COCKROACHDB (cluster) ==="
        kubectl exec -n {{.GENERIC_NAMESPACE}} $POD -- ./cockroach sql --insecure -e "SELECT writer, msg, ts FROM sandbox ORDER BY ts;" || echo "(no sandbox table)"

  cockroach:query:branch:
    desc: List rows in the BRANCH CockroachDB
    cmds:
      - |
        CRD=$(kubectl get branchdatabases -n {{.GENERIC_NAMESPACE}} -o jsonpath='{range .items[?(@.spec.id=="cockroach-generic-branch")]}{.metadata.name}{end}')
        POD=$(kubectl get pod -n {{.GENERIC_NAMESPACE}} -l db-owner-name=$CRD -o name 2>/dev/null | head -1)
        if [ -z "$POD" ]; then echo "No CockroachDB branch pod found. Run 'task generic:cockroach:run:local' first."; exit 1; fi
        echo ""
        echo "=== BRANCH COCKROACHDB ($POD) ==="
        kubectl exec -n {{.GENERIC_NAMESPACE}} ${POD#pod/} -- ./cockroach sql --insecure -e "SELECT writer, msg, ts FROM sandbox ORDER BY ts;" || echo "(no sandbox table yet - a fresh branch starts empty)"

  _wait:elasticsearch:
    internal: true
    cmds:
      - echo "Waiting for Elasticsearch + app (JVM boot takes a while)..."
      - kubectl wait --for=condition=ready pod -l app=elasticsearch-main -n {{.GENERIC_NAMESPACE}} --timeout=300s || true
      - kubectl wait --for=condition=ready pod -l app=elasticsearch-app -n {{.GENERIC_NAMESPACE}} --timeout=120s || true

  _wait:cockroach:
    internal: true
    cmds:
      - echo "Waiting for CockroachDB + app..."
      - kubectl wait --for=condition=ready pod -l app=cockroach-main -n {{.GENERIC_NAMESPACE}} --timeout=180s || true
      - kubectl wait --for=condition=ready pod -l app=cockroach-app -n {{.GENERIC_NAMESPACE}} --timeout=120s || true

  # --- Cassandra variant ---------------------------------------------------------------------
  # CQL over the native binary protocol (gocql), default no-auth config, JVM heap tuned via
  # MAX_HEAP_SIZE, `exec` readiness via cqlsh. Local app on :8065.

  cassandra:run:local:
    desc: Run the Cassandra app locally under mirrord (creates a Cassandra branch; Ctrl-C to stop)
    interactive: true
    dir: apps/cassandra-app
    cmds:
      - go mod tidy && go build -o cassandra-app .
      - |
        if [ -z "${OPERATOR_ISOLATION_MARKER:-}" ] && pgrep -qf 'target/debug/operator-service'; then
          export OPERATOR_ISOLATION_MARKER=local-dev
          echo "operator:dev detected -> OPERATOR_ISOLATION_MARKER=local-dev"
        fi
        PORT=8065 {{.MIRRORD_BIN}} exec \
          -t deploy/cassandra-app \
          -n {{.GENERIC_NAMESPACE}} \
          -f mirrord-branch.json \
          -- ./cassandra-app

  cassandra:seed:
    desc: Insert a row into the SOURCE Cassandra
    cmds:
      - |
        POD=$(kubectl get pod -n {{.GENERIC_NAMESPACE}} -l app=cassandra-main -o jsonpath='{.items[0].metadata.name}')
        kubectl exec -n {{.GENERIC_NAMESPACE}} $POD -- cqlsh -e "CREATE KEYSPACE IF NOT EXISTS sandbox WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1}; CREATE TABLE IF NOT EXISTS sandbox.msgs (id uuid PRIMARY KEY, writer text, msg text, ts timestamp); INSERT INTO sandbox.msgs (id, writer, msg, ts) VALUES (uuid(), 'cluster', 'seeded into the SOURCE cassandra', toTimestamp(now()));"
        echo "Seeded 1 row into the source Cassandra"

  cassandra:query:source:
    desc: List rows in the SOURCE Cassandra sandbox.msgs table
    cmds:
      - |
        POD=$(kubectl get pod -n {{.GENERIC_NAMESPACE}} -l app=cassandra-main -o jsonpath='{.items[0].metadata.name}')
        echo ""
        echo "=== SOURCE CASSANDRA (cluster) ==="
        kubectl exec -n {{.GENERIC_NAMESPACE}} $POD -- cqlsh -e "SELECT writer, msg, ts FROM sandbox.msgs;" || echo "(no sandbox keyspace)"

  cassandra:query:branch:
    desc: List rows in the BRANCH Cassandra
    cmds:
      - |
        CRD=$(kubectl get branchdatabases -n {{.GENERIC_NAMESPACE}} -o jsonpath='{range .items[?(@.spec.id=="cassandra-generic-branch")]}{.metadata.name}{end}')
        POD=$(kubectl get pod -n {{.GENERIC_NAMESPACE}} -l db-owner-name=$CRD -o name 2>/dev/null | head -1)
        if [ -z "$POD" ]; then echo "No Cassandra branch pod found. Run 'task generic:cassandra:run:local' first."; exit 1; fi
        echo ""
        echo "=== BRANCH CASSANDRA ($POD) ==="
        kubectl exec -n {{.GENERIC_NAMESPACE}} ${POD#pod/} -- cqlsh -e "SELECT writer, msg, ts FROM sandbox.msgs;" || echo "(no sandbox keyspace yet - a fresh branch starts empty)"

  # --- Aerospike variant -----------------------------------------------------------------------
  # Native binary wire protocol (aerospike-client-go), CE default `test` namespace, no auth,
  # default TCP readiness probe - near-minimal config. The server image ships no CLI tools,
  # so seeding/queries go through the IN-CLUSTER app pod (which talks to the source).
  # Local app on :8060.

  aerospike:run:local:
    desc: Run the Aerospike app locally under mirrord (creates an Aerospike branch; Ctrl-C to stop)
    interactive: true
    dir: apps/aerospike-app
    cmds:
      - go mod tidy && go build -o aerospike-app .
      - |
        if [ -z "${OPERATOR_ISOLATION_MARKER:-}" ] && pgrep -qf 'target/debug/operator-service'; then
          export OPERATOR_ISOLATION_MARKER=local-dev
          echo "operator:dev detected -> OPERATOR_ISOLATION_MARKER=local-dev"
        fi
        PORT=8060 {{.MIRRORD_BIN}} exec \
          -t deploy/aerospike-app \
          -n {{.GENERIC_NAMESPACE}} \
          -f mirrord-branch.json \
          -- ./aerospike-app

  aerospike:seed:
    desc: Put a record into the SOURCE Aerospike (via the in-cluster app)
    cmds:
      - |
        POD=$(kubectl get pod -n {{.GENERIC_NAMESPACE}} -l app=aerospike-app -o jsonpath='{.items[0].metadata.name}')
        kubectl exec -n {{.GENERIC_NAMESPACE}} $POD -- wget -qO- 'http://localhost:8080/write?writer=cluster&msg=seeded-into-the-SOURCE-aerospike'
        echo "Seeded via the in-cluster app (writes to the source)"

  aerospike:query:source:
    desc: Read the record from the SOURCE Aerospike (via the in-cluster app)
    cmds:
      - |
        POD=$(kubectl get pod -n {{.GENERIC_NAMESPACE}} -l app=aerospike-app -o jsonpath='{.items[0].metadata.name}')
        echo ""
        echo "=== SOURCE AEROSPIKE (via in-cluster app) ==="
        kubectl exec -n {{.GENERIC_NAMESPACE}} $POD -- wget -qO- 'http://localhost:8080/read'

  # --- Couchbase variant -----------------------------------------------------------------------
  # The hardest bootstrap class: NO env mechanism - the branch `command` wraps the entrypoint
  # and runs `couchbase-cli cluster-init` + `bucket-create` with $MIRRORD_PARAM_PASSWORD.
  # Also demos HOST-ONLY redirection for a multi-port service (mgmt 8091 + query 8093 both
  # follow the rewritten COUCHBASE_HOST). Local app on :8055.

  couchbase:run:local:
    desc: Run the Couchbase app locally under mirrord (creates a Couchbase branch; Ctrl-C to stop)
    interactive: true
    dir: apps/couchbase-app
    cmds:
      - go build -o couchbase-app .
      - |
        if [ -z "${OPERATOR_ISOLATION_MARKER:-}" ] && pgrep -qf 'target/debug/operator-service'; then
          export OPERATOR_ISOLATION_MARKER=local-dev
          echo "operator:dev detected -> OPERATOR_ISOLATION_MARKER=local-dev"
        fi
        PORT=8055 {{.MIRRORD_BIN}} exec \
          -t deploy/couchbase-app \
          -n {{.GENERIC_NAMESPACE}} \
          -f mirrord-branch.json \
          -- ./couchbase-app

  couchbase:seed:
    desc: Upsert a doc into the SOURCE Couchbase
    cmds:
      - |
        POD=$(kubectl get pod -n {{.GENERIC_NAMESPACE}} -l app=couchbase-main -o jsonpath='{.items[0].metadata.name}')
        kubectl exec -n {{.GENERIC_NAMESPACE}} $POD -- curl -s -u 'Administrator:{{.COUCHBASE_PASSWORD}}' \
          http://localhost:8093/query/service \
          -H 'Content-Type: application/json' \
          -d '{"statement": "UPSERT INTO `sandbox` (KEY, VALUE) VALUES (\"k1\", {\"writer\": \"cluster\", \"msg\": \"seeded into the SOURCE couchbase\"})"}'
        echo ""
        echo "Seeded doc k1 into the source Couchbase"

  couchbase:query:source:
    desc: Fetch doc k1 from the SOURCE Couchbase
    cmds:
      - |
        POD=$(kubectl get pod -n {{.GENERIC_NAMESPACE}} -l app=couchbase-main -o jsonpath='{.items[0].metadata.name}')
        echo ""
        echo "=== SOURCE COUCHBASE (cluster) ==="
        kubectl exec -n {{.GENERIC_NAMESPACE}} $POD -- curl -s -u 'Administrator:{{.COUCHBASE_PASSWORD}}' \
          http://localhost:8093/query/service \
          -H 'Content-Type: application/json' \
          -d '{"statement": "SELECT sandbox.* FROM `sandbox` USE KEYS [\"k1\"]"}'

  couchbase:query:branch:
    desc: Fetch doc k1 from the BRANCH Couchbase with the app's password (proves the cluster-init bootstrap)
    cmds:
      - |
        CRD=$(kubectl get branchdatabases -n {{.GENERIC_NAMESPACE}} -o jsonpath='{range .items[?(@.spec.id=="couchbase-generic-branch")]}{.metadata.name}{end}')
        POD=$(kubectl get pod -n {{.GENERIC_NAMESPACE}} -l db-owner-name=$CRD -o name 2>/dev/null | head -1)
        if [ -z "$POD" ]; then echo "No Couchbase branch pod found. Run 'task generic:couchbase:run:local' first."; exit 1; fi
        echo ""
        echo "=== BRANCH COUCHBASE ($POD) ==="
        kubectl exec -n {{.GENERIC_NAMESPACE}} ${POD#pod/} -- curl -s -u 'Administrator:{{.COUCHBASE_PASSWORD}}' \
          http://localhost:8093/query/service \
          -H 'Content-Type: application/json' \
          -d '{"statement": "SELECT sandbox.* FROM `sandbox` USE KEYS [\"k1\"]"}'

  _wait:cassandra:
    internal: true
    cmds:
      - echo "Waiting for Cassandra + app (JVM boot takes a while)..."
      - kubectl wait --for=condition=ready pod -l app=cassandra-main -n {{.GENERIC_NAMESPACE}} --timeout=300s || true
      - kubectl wait --for=condition=ready pod -l app=cassandra-app -n {{.GENERIC_NAMESPACE}} --timeout=120s || true

  _wait:aerospike:
    internal: true
    cmds:
      - echo "Waiting for Aerospike + app..."
      - kubectl wait --for=condition=ready pod -l app=aerospike-main -n {{.GENERIC_NAMESPACE}} --timeout=180s || true
      - kubectl wait --for=condition=ready pod -l app=aerospike-app -n {{.GENERIC_NAMESPACE}} --timeout=120s || true

  _wait:couchbase:
    internal: true
    cmds:
      - echo "Waiting for Couchbase + app (cluster-init takes a while)..."
      - kubectl wait --for=condition=ready pod -l app=couchbase-main -n {{.GENERIC_NAMESPACE}} --timeout=300s || true
      - kubectl wait --for=condition=ready pod -l app=couchbase-app -n {{.GENERIC_NAMESPACE}} --timeout=120s || true

  # ----------------------------------------------------------------------------------------

  _wait:valkey:
    internal: true
    cmds:
      - echo "Waiting for Valkey..."
      - kubectl wait --for=condition=ready pod -l app=valkey-main -n {{.GENERIC_NAMESPACE}} --timeout=120s || true

  _wait:app:
    internal: true
    cmds:
      - echo "Waiting for generic app..."
      - kubectl wait --for=condition=ready pod -l app=generic-app -n {{.GENERIC_NAMESPACE}} --timeout=120s || true

  _wait:influx:
    internal: true
    cmds:
      - echo "Waiting for InfluxDB + app..."
      - kubectl wait --for=condition=ready pod -l app=influxdb-main -n {{.GENERIC_NAMESPACE}} --timeout=180s || true
      - kubectl wait --for=condition=ready pod -l app=influx-app -n {{.GENERIC_NAMESPACE}} --timeout=120s || true
