version: "3"

# Azure Service Bus queue splitting (emulator).
#
#   task servicebus:deploy         deploy the SB emulator + consumer into the cluster
#   task servicebus:run:local      run the consumer locally under mirrord (starts the split)
#   task servicebus:send:match     message with tenant=test-user -> your local session
#   task servicebus:send:nomatch   message with tenant=other     -> cluster consumer
#
# The split filter lives in k8s/overlays/servicebus-emulator/mirrord.json
# (application property `tenant` matching ^test). The emulator is only
# reachable in-cluster, so messages are sent through a one-shot sender pod
# running the consumer image in SEND_MODE.

vars:
  ROOT_DIR:
    sh: git rev-parse --show-toplevel
  NAMESPACE: '{{.NAMESPACE | default "test-mirrord"}}'
  CLUSTER_NAME: '{{.CLUSTER_NAME | default "bearkube"}}'
  CONTAINER_RUNTIME: '{{.CONTAINER_RUNTIME | default "docker"}}'
  MIRRORD_BIN: '{{.MIRRORD_BIN | default "mirrord"}}'
  APP_DIR: '{{.ROOT_DIR}}/apps/servicebus-consumer'
  OVERLAY: '{{.ROOT_DIR}}/k8s/overlays/servicebus-emulator'
  SB_MIRRORD_CONFIG: '{{.SB_MIRRORD_CONFIG | default (print .ROOT_DIR "/k8s/overlays/servicebus-emulator/mirrord.json")}}'
  EMULATOR_NAMESPACE: "servicebus-emulator"
  # Overridable via SB_QUEUE in .env (module-prefixed name so it can't
  # collide with other modules' globals).
  QUEUE: '{{.SB_QUEUE | default "test-queue"}}'
  CONN_STR: "Endpoint=sb://servicebus-emulator.servicebus-emulator.svc.cluster.local;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true"

tasks:
  deploy:
    desc: Deploy the Service Bus test env (emulator + consumer)
    cmds:
      - "{{.CONTAINER_RUNTIME}} build -t servicebus-consumer:local {{.APP_DIR}}"
      - minikube -p {{.CLUSTER_NAME}} image load servicebus-consumer:local
      - kubectl create namespace {{.NAMESPACE}} --dry-run=client -o yaml | kubectl apply -f -
      - kubectl apply -f {{.OVERLAY}}/namespace.yaml
      - task: _deploy:emulator
      - kubectl apply -f {{.OVERLAY}}/consumer.yaml
      - task: _wait:consumer
      - kubectl apply -f {{.OVERLAY}}/property-list.yaml
      - kubectl apply -f {{.OVERLAY}}/split-config.yaml

  run:local:
    desc: Run the consumer locally under mirrord (starts queue splitting; Ctrl-C to stop)
    interactive: true
    dir: apps/servicebus-consumer
    cmds:
      - go build -o /tmp/servicebus-consumer main.go
      - "{{.MIRRORD_BIN}} exec -f {{.SB_MIRRORD_CONFIG}} -- /tmp/servicebus-consumer"

  send:match:
    desc: 'Send a message matching the split filter -> local session (MESSAGE=...)'
    cmds:
      - task: send
        vars:
          TENANT: "test-user"
          TYPE: "premium"
          MESSAGE: '{{.MESSAGE | default "match: hello local session"}}'

  send:nomatch:
    desc: 'Send a message NOT matching the filter -> cluster consumer (MESSAGE=...)'
    cmds:
      - task: send
        vars:
          TENANT: "other"
          TYPE: "basic"
          MESSAGE: '{{.MESSAGE | default "nomatch: hello cluster consumer"}}'

  send:
    desc: 'Send a message with explicit routing (TENANT=... TYPE=... MESSAGE=...)'
    silent: true
    vars:
      TENANT: '{{.TENANT | default "test-user"}}'
      TYPE: '{{.TYPE | default "standard"}}'
      MESSAGE: '{{.MESSAGE | default "Test message"}}'
    cmds:
      - |
        BODY='{"order_id":"ORD-001","tenant":"{{.TENANT}}","type":"{{.TYPE}}","message":"{{.MESSAGE}}"}'
        kubectl run sb-sender-$RANDOM --rm -i --restart=Never \
          --image=servicebus-consumer:local \
          --image-pull-policy=Never \
          --namespace={{.EMULATOR_NAMESPACE}} \
          --env="SEND_MODE=true" \
          --env="SERVICEBUS_CONNECTION_STRING={{.CONN_STR}}" \
          --env="SEND_QUEUE={{.QUEUE}}" \
          --env="MESSAGE_BODY=$BODY" \
          --env="MESSAGE_PROPERTIES=tenant={{.TENANT}},type={{.TYPE}}" \
          -- /app/consumer >/dev/null 2>&1
        case "{{.TENANT}}" in
          test*) echo "sent '{{.MESSAGE}}' (tenant={{.TENANT}} -> local session)";;
          *)     echo "sent '{{.MESSAGE}}' (tenant={{.TENANT}} -> stays in cluster)";;
        esac

  logs:
    desc: Tail the cluster consumer logs
    cmds:
      - kubectl logs -n {{.NAMESPACE}} -l app=servicebus-consumer --tail=100 -f

  logs:emulator:
    desc: Tail the Service Bus emulator logs
    cmds:
      - kubectl logs -n {{.EMULATOR_NAMESPACE}} servicebus-emulator --tail=100 -f

  status:
    desc: Show consumer, emulator and split state
    silent: true
    cmds:
      - echo "=== consumer ==="
      - kubectl get pods -n {{.NAMESPACE}} -l app=servicebus-consumer 2>/dev/null || echo "not deployed"
      - echo ""
      - echo "=== emulator ==="
      - kubectl get pods -n {{.EMULATOR_NAMESPACE}} 2>/dev/null || echo "not deployed"
      - echo ""
      - echo "=== split config ==="
      - kubectl get mirrordsplitconfigs -n {{.NAMESPACE}} 2>/dev/null || echo "none"
      - echo ""
      - echo "=== split sessions ==="
      - kubectl get mirrordclustersplitsession -A 2>/dev/null || echo "none"

  clean:
    desc: Remove the Service Bus test env from the cluster
    cmds:
      - kubectl delete mirrordclustersplitsessions --all -A 2>/dev/null || true
      - kubectl delete mirrordclusterexternalresources --all -A 2>/dev/null || true
      - kubectl delete mirrordclusterworkloadpatchrequests --all -A 2>/dev/null || true
      - kubectl delete -f {{.OVERLAY}}/split-config.yaml --ignore-not-found=true
      - kubectl delete -f {{.OVERLAY}}/property-list.yaml --ignore-not-found=true
      - kubectl delete -f {{.OVERLAY}}/consumer.yaml --ignore-not-found=true
      - kubectl delete -f {{.OVERLAY}}/servicebus-emulator.yaml --ignore-not-found=true
      - kubectl delete namespace {{.EMULATOR_NAMESPACE}} --ignore-not-found=true

  # ── Real Azure Service Bus (cloud) ──────────────────────────────────────
  # Same flow, but against a real Azure namespace instead of the emulator.
  # The app AND the operator read the connection string from the
  # `servicebus-azure-conn` secret, so the SAS key never lands in a file.
  #
  #   task servicebus:azure:secret CONN='Endpoint=sb://<ns>.servicebus.windows.net/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=...'
  #   task servicebus:azure:deploy
  #   task servicebus:azure:run:local
  #   task servicebus:azure:send:match / azure:send:nomatch [MESSAGE=...]
  #
  # The topic/subscription variant is still available under
  # `task legacy:servicebus:azure:deploy:topic` etc.

  azure:secret:
    desc: "Store the real Azure connection string secret (CONN='Endpoint=sb://...')"
    silent: true
    cmds:
      - |
        if [ -z "{{.CONN}}" ]; then
          echo "Pass the connection string:"
          echo "  task servicebus:azure:secret CONN='Endpoint=sb://<ns>.servicebus.windows.net/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=...'"
          exit 1
        fi
        kubectl create namespace {{.NAMESPACE}} --dry-run=client -o yaml | kubectl apply -f - >/dev/null
        kubectl create secret generic servicebus-azure-conn -n {{.NAMESPACE}} \
          --from-literal=connection_string='{{.CONN}}' \
          --dry-run=client -o yaml | kubectl apply -f -
        echo "Secret servicebus-azure-conn updated in {{.NAMESPACE}}"

  azure:deploy:
    desc: Deploy the consumer wired to REAL Azure Service Bus (run azure:secret first)
    preconditions:
      - sh: kubectl get secret servicebus-azure-conn -n {{.NAMESPACE}} >/dev/null 2>&1
        msg: "Secret servicebus-azure-conn not found. Create it first: task servicebus:azure:secret CONN='Endpoint=sb://...'"
    cmds:
      - "{{.CONTAINER_RUNTIME}} build -t servicebus-consumer:local {{.APP_DIR}}"
      - minikube -p {{.CLUSTER_NAME}} image load servicebus-consumer:local
      - kubectl apply -f {{.OVERLAY}}/property-list-azure.yaml
      - kubectl apply -f {{.OVERLAY}}/consumer-azure.yaml
      - kubectl apply -f {{.OVERLAY}}/split-config-azure.yaml
      # Force a new pod so a rebuilt image is picked up (imagePullPolicy: Never).
      - kubectl rollout restart deploy/servicebus-consumer -n {{.NAMESPACE}}
      - kubectl rollout status deploy/servicebus-consumer -n {{.NAMESPACE}} --timeout=120s

  azure:run:local:
    desc: Run the consumer locally under mirrord against real Azure (Ctrl-C to stop)
    interactive: true
    dir: apps/servicebus-consumer
    cmds:
      - go build -o /tmp/servicebus-consumer main.go
      - "{{.MIRRORD_BIN}} exec -f {{.SB_MIRRORD_CONFIG}} -- /tmp/servicebus-consumer"

  azure:send:match:
    desc: 'Azure: send a message matching the filter -> local session (MESSAGE=...)'
    cmds:
      - task: azure:send
        vars:
          TENANT: "test-user"
          TYPE: "premium"
          MESSAGE: '{{.MESSAGE | default "match: hello local session (azure)"}}'

  azure:send:nomatch:
    desc: 'Azure: send a message NOT matching the filter -> cluster consumer (MESSAGE=...)'
    cmds:
      - task: azure:send
        vars:
          TENANT: "other"
          TYPE: "basic"
          MESSAGE: '{{.MESSAGE | default "nomatch: hello cluster consumer (azure)"}}'

  azure:send:
    desc: 'Azure: send with explicit routing (TENANT=... TYPE=... MESSAGE=...)'
    preconditions:
      - sh: kubectl get secret servicebus-azure-conn -n {{.NAMESPACE}} >/dev/null 2>&1
        msg: "Secret servicebus-azure-conn not found. Create it first: task servicebus:azure:secret CONN='Endpoint=sb://...'"
    vars:
      AZURE_CONN:
        sh: kubectl get secret servicebus-azure-conn -n {{.NAMESPACE}} -o jsonpath='{.data.connection_string}' 2>/dev/null | base64 -d
    cmds:
      # Reuses the emulator `send` helper: the one-shot sender pod just runs in
      # the app namespace with the real connection string instead.
      - task: send
        vars:
          TENANT: '{{.TENANT | default "test-user"}}'
          TYPE: '{{.TYPE | default "standard"}}'
          MESSAGE: '{{.MESSAGE | default "Test message"}}'
          CONN_STR: "{{.AZURE_CONN}}"
          EMULATOR_NAMESPACE: "{{.NAMESPACE}}"

  azure:status:
    desc: Show real-Azure consumer + split state
    silent: true
    cmds:
      - echo "=== secret ==="
      - kubectl get secret servicebus-azure-conn -n {{.NAMESPACE}} 2>/dev/null || echo "missing — task servicebus:azure:secret"
      - echo ""
      - echo "=== consumer ==="
      - kubectl get pods -n {{.NAMESPACE}} -l app=servicebus-consumer 2>/dev/null || echo "not deployed"
      - echo ""
      - echo "=== split config ==="
      - kubectl get mirrordsplitconfigs -n {{.NAMESPACE}} 2>/dev/null || echo "none"
      - echo ""
      - echo "=== split sessions ==="
      - kubectl get mirrordclustersplitsession -A 2>/dev/null || echo "none"

  azure:clean:
    desc: Remove the real-Azure consumer + CRDs (keeps the secret)
    cmds:
      - kubectl delete -f {{.OVERLAY}}/split-config-azure.yaml --ignore-not-found=true
      - kubectl delete -f {{.OVERLAY}}/property-list-azure.yaml --ignore-not-found=true
      - kubectl delete -f {{.OVERLAY}}/consumer-azure.yaml --ignore-not-found=true

  # ── Multi-topic mixed-case reproduction (real Azure SB, single cluster) ────
  # Same repro as the multicluster `multicluster:servicebus:multi:*` tasks, on
  # one cluster so you can drive it through the preview flow here:
  #   - two topics (test-topic, test-topic-2), one mixed-case subscription
  #     (Test-sub-2) while the config stays lowercase,
  #   - the app subscription resolves from env `Service.ServiceName` with
  #     fallback `dummy`; the consumer never sets that env, so every queue
  #     resolves its app subscription to `dummy` (a sub that does not exist),
  #   - a wildcard `split_queues: "*"` with a `cot-context-intercept-id` filter.
  # Needs a real Azure namespace (emulator has no management API for this).
  #
  #   task servicebus:multi:secret CONN='Endpoint=sb://...'   (or set AZURE_SB_RG/NS)
  #   task servicebus:multi:deploy
  #   task servicebus:multi:preview:start NAME=prev-1
  #   task servicebus:multi:send TOPIC=test-topic KEY=prev-1
  #   task servicebus:multi:azure:subs
  #   task servicebus:multi:status / logs / preview:stop / clean

  multi:secret:
    desc: "Ensure both Azure topics/subs (test-topic/test-sub + test-topic-2/Test-sub-2, mixed case) exist and store the connection secret. CONN='Endpoint=sb://...' or set AZURE_SB_RG + AZURE_SB_NAMESPACE."
    silent: true
    vars:
      AZ_RG: '{{.AZURE_SB_RG | default ""}}'
      AZ_NS: '{{.AZURE_SB_NAMESPACE | default ""}}'
    cmds:
      - |
        CONN='{{.CONN}}'
        if [ -z "$CONN" ]; then
          if [ -z "{{.AZ_RG}}" ] || [ -z "{{.AZ_NS}}" ] || ! az account show >/dev/null 2>&1; then
            echo "Pass CONN='Endpoint=sb://<ns>.servicebus.windows.net/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=...'"
            echo "or set AZURE_SB_RG + AZURE_SB_NAMESPACE in .env and run 'az login'."
            exit 1
          fi
          CONN=$(az servicebus namespace authorization-rule keys list \
            --resource-group {{.AZ_RG}} --namespace-name {{.AZ_NS}} \
            --name RootManageSharedAccessKey --query primaryConnectionString -o tsv)
        fi
        # Create both topics/subs when az is available. Test-sub-2 is mixed case
        # on purpose - the client's Azure has mixed case, the config does not.
        if [ -n "{{.AZ_RG}}" ] && [ -n "{{.AZ_NS}}" ] && az account show >/dev/null 2>&1; then
          echo "Ensuring topics/subs exist (test-topic/test-sub, test-topic-2/Test-sub-2)..."
          az servicebus topic create -g {{.AZ_RG}} --namespace-name {{.AZ_NS}} --name test-topic -o none 2>/dev/null || true
          az servicebus topic subscription create -g {{.AZ_RG}} --namespace-name {{.AZ_NS}} --topic-name test-topic --name test-sub -o none 2>/dev/null || true
          az servicebus topic create -g {{.AZ_RG}} --namespace-name {{.AZ_NS}} --name test-topic-2 -o none 2>/dev/null || true
          az servicebus topic subscription create -g {{.AZ_RG}} --namespace-name {{.AZ_NS}} --topic-name test-topic-2 --name Test-sub-2 -o none 2>/dev/null || true
        else
          echo "NOTE: ensure test-topic/test-sub and test-topic-2/Test-sub-2 (mixed case) exist in Azure."
        fi
        kubectl create namespace {{.NAMESPACE}} --dry-run=client -o yaml | kubectl apply -f - >/dev/null
        kubectl create secret generic servicebus-azure-conn -n {{.NAMESPACE}} \
          --from-literal=connection_string="$CONN" \
          --dry-run=client -o yaml | kubectl apply -f -
        echo "Secret servicebus-azure-conn updated in {{.NAMESPACE}}"

  multi:deploy:
    desc: "Deploy the 2-topic mixed-case consumer + split config (real Azure SB, single cluster). Creates the connection secret from az + AZURE_SB_RG/AZURE_SB_NAMESPACE (in .env), or pass CONN='Endpoint=sb://...'."
    cmds:
      # Ensure the connection secret exists first. `multi:secret` derives it from
      # `az` when AZURE_SB_RG/AZURE_SB_NAMESPACE are set (see .env), so a plain
      # `az login` is enough; passing CONN=... still works as a fallback.
      - task: multi:secret
      # Build straight on the node: `minikube image load` silently skips a tag
      # that already exists and is in use, which leaves the pod running stale
      # code (the whole app crash-loops on "No queues ... configured").
      - minikube -p {{.CLUSTER_NAME}} image build -t servicebus-consumer:local {{.APP_DIR}}
      - kubectl apply -f {{.OVERLAY}}/property-list-azure.yaml
      - kubectl apply -f {{.OVERLAY}}/consumer-topic-multi.yaml
      - kubectl apply -f {{.OVERLAY}}/split-config-multi.yaml
      - kubectl rollout restart deploy/servicebus-multi-consumer -n {{.NAMESPACE}}
      - kubectl rollout status deploy/servicebus-multi-consumer -n {{.NAMESPACE}} --timeout=120s

  multi:preview:start:
    desc: "Start a multi-topic preview env (single cluster). NAME=prev-1 pins the cot-context-intercept-id filter to s*prev-1$ and the session key to prev-1."
    interactive: true
    vars:
      NAME: '{{.NAME | default ""}}'
      PREVIEW_KEY: '{{.PREVIEW_KEY | default "sc-multi-preview"}}'
      PREVIEW_IMAGE: '{{.PREVIEW_IMAGE | default "servicebus-consumer:local"}}'
      PREVIEW_TIMEOUT: '{{.PREVIEW_TIMEOUT | default "300"}}'
      MULTI_PREVIEW_CONFIG: '{{.OVERLAY}}/mirrord-preview-multi.json'
    preconditions:
      - sh: kubectl get deploy servicebus-multi-consumer -n {{.NAMESPACE}} >/dev/null 2>&1
        msg: "Multi-topic consumer missing - run 'task servicebus:multi:deploy' first"
    cmds:
      - |
        CFG="{{.MULTI_PREVIEW_CONFIG}}"
        KEY="{{.PREVIEW_KEY}}"
        if [ -n "{{.NAME}}" ]; then
          KEY="{{.NAME}}"
          CFG="/tmp/mirrord-preview-multi-sc-{{.NAME}}.json"
          python3 - <<'PY'
        import json
        c = json.load(open("{{.MULTI_PREVIEW_CONFIG}}"))
        # Keep the client's property name; only pin it to this preview's key.
        for split in c["feature"]["split_queues"].values():
            split["message_filter"] = {"cot-context-intercept-id": "s*{{.NAME}}$"}
        json.dump(c, open("/tmp/mirrord-preview-multi-sc-{{.NAME}}.json", "w"), indent=2)
        PY
          echo "preview '{{.NAME}}': filter cot-context-intercept-id=s*{{.NAME}}$ (config $CFG)"
        fi
        if [ -z "${OPERATOR_ISOLATION_MARKER:-}" ] && pgrep -qf 'target/debug/operator-service'; then
          export OPERATOR_ISOLATION_MARKER=local-dev
          echo "operator:dev detected -> OPERATOR_ISOLATION_MARKER=local-dev"
        fi
        MIRRORD_CHECK_VERSION=false \
          {{.MIRRORD_BIN}} preview start \
            -f "$CFG" \
            -i "{{.PREVIEW_IMAGE}}" \
            -k "$KEY" \
            --timeout {{.PREVIEW_TIMEOUT}}

  multi:preview:stop:
    desc: "Stop a multi-topic preview env (single cluster). NAME=prev-1, or PREVIEW_KEY for the default one."
    vars:
      NAME: '{{.NAME | default ""}}'
      PREVIEW_KEY: '{{.PREVIEW_KEY | default "sc-multi-preview"}}'
    cmds:
      - |
        KEY="{{.NAME}}"
        [ -z "$KEY" ] && KEY="{{.PREVIEW_KEY}}"
        if [ -z "${OPERATOR_ISOLATION_MARKER:-}" ] && pgrep -qf 'target/debug/operator-service'; then
          export OPERATOR_ISOLATION_MARKER=local-dev
        fi
        MIRRORD_CHECK_VERSION=false {{.MIRRORD_BIN}} preview stop -k "$KEY" || true

  multi:send:
    desc: "Publish to one topic (TOPIC=test-topic|test-topic-2 KEY=prev-1 [MESSAGE=...]). KEY sets cot-context-intercept-id so it matches that preview; omit KEY to hit the deployed consumer."
    silent: true
    preconditions:
      - sh: kubectl get secret servicebus-azure-conn -n {{.NAMESPACE}} >/dev/null 2>&1
        msg: "Secret missing. Run: task servicebus:multi:secret"
    vars:
      TOPIC: '{{.TOPIC | default "test-topic"}}'
      KEY: '{{.KEY | default ""}}'
      MESSAGE: '{{.MESSAGE | default "multi-topic repro message"}}'
    cmds:
      - |
        CONN=$(kubectl get secret servicebus-azure-conn -n {{.NAMESPACE}} -o jsonpath='{.data.connection_string}' | base64 -d)
        INTERCEPT="{{.KEY}}"
        BODY='{"order_id":"ORD-001","message":"{{.MESSAGE}}"}'
        PROPS=""
        [ -n "$INTERCEPT" ] && PROPS="cot-context-intercept-id=$INTERCEPT"
        kubectl run sb-multi-sender-$RANDOM --rm -i --restart=Never \
          --image=servicebus-consumer:local \
          --image-pull-policy=Never \
          --namespace={{.NAMESPACE}} \
          --env="SEND_MODE=true" \
          --env="SERVICEBUS_CONNECTION_STRING=$CONN" \
          --env="SEND_TOPIC={{.TOPIC}}" \
          --env="MESSAGE_BODY=$BODY" \
          --env="MESSAGE_PROPERTIES=$PROPS" \
          -- /app/consumer >/dev/null 2>&1
        if [ -n "$INTERCEPT" ]; then
          echo "published to {{.TOPIC}} (cot-context-intercept-id=$INTERCEPT -> preview '$INTERCEPT')"
        else
          echo "published to {{.TOPIC}} (no intercept id -> deployed consumer)"
        fi

  multi:azure:subs:
    desc: "List Azure subscriptions + their rules for both repro topics (needs az + AZURE_SB_RG/AZURE_SB_NAMESPACE). This is where the $Default vs mirrord-session state shows up."
    silent: true
    vars:
      AZ_RG: '{{.AZURE_SB_RG | default ""}}'
      AZ_NS: '{{.AZURE_SB_NAMESPACE | default ""}}'
    cmds:
      - |
        if [ -z "{{.AZ_RG}}" ] || [ -z "{{.AZ_NS}}" ] || ! az account show >/dev/null 2>&1; then
          echo "Set AZURE_SB_RG + AZURE_SB_NAMESPACE in .env and run 'az login' first."; exit 1
        fi
        for T in test-topic test-topic-2; do
          echo "=== topic $T ==="
          for S in $(az servicebus topic subscription list -g {{.AZ_RG}} --namespace-name {{.AZ_NS}} --topic-name "$T" --query "[].name" -o tsv); do
            RULES=$(az servicebus topic subscription rule list -g {{.AZ_RG}} --namespace-name {{.AZ_NS}} \
              --topic-name "$T" --subscription-name "$S" --query "[].name" -o tsv | tr '\n' ',' | sed 's/,$//')
            echo "  $S  [rules: $RULES]"
          done
          echo ""
        done

  multi:status:
    desc: Show the multi-topic consumer, preview sessions and split state (single cluster)
    silent: true
    cmds:
      - echo "=== consumer ==="
      - kubectl get pods -n {{.NAMESPACE}} -l app=servicebus-multi-consumer 2>/dev/null || echo "not deployed"
      - echo ""
      - echo "=== preview sessions ==="
      - kubectl get previewsessions -A 2>/dev/null || echo "none"
      - echo ""
      - echo "=== split sessions ==="
      - kubectl get mirrordclustersplitsession -A 2>/dev/null || echo "none"

  multi:logs:
    desc: Tail the deployed multi-topic consumer logs (single cluster)
    cmds:
      - kubectl logs -n {{.NAMESPACE}} -l app=servicebus-multi-consumer --tail=100 -f

  multi:clean:
    desc: Remove the multi-topic consumer + split config (keeps the secret + Azure topics)
    cmds:
      - kubectl delete previewsessions --all -A 2>/dev/null || true
      - kubectl delete -f {{.OVERLAY}}/split-config-multi.yaml --ignore-not-found=true
      - kubectl delete -f {{.OVERLAY}}/consumer-topic-multi.yaml --ignore-not-found=true

  # ── Shared-subscription-env reproduction (REAL Azure SB, single cluster) ──
  # Reproduces the client bug where one env var (their Service.ServiceName)
  # names the app's subscription on EVERY topic. The operator creates a
  # different per-session mirrord-s-* subscription per topic but can only
  # write ONE name into the env var, and the app's auto-provisioning then
  # creates that name on the other topics itself - unfiltered, unowned,
  # leaked. Uses the same secret + test-topic/test-topic-2 as the multi:*
  # repro (the deployed consumer auto-creates its `test-service` sub).
  #
  #   task servicebus:multi:secret CONN='Endpoint=sb://...'   (once)
  #   task servicebus:sharedsub:deploy         consumer + split config on the real topics
  #   task servicebus:sharedsub:run:local      consumer under mirrord, filters on BOTH topics
  #   task servicebus:sharedsub:subs           list subscriptions + rules on both topics
  #   task servicebus:sharedsub:send TOPIC=test-topic-2 TENANT=other
  #   task servicebus:sharedsub:clean
  #
  # Or run the whole demonstration in one go: scripts/asb-shared-sub-repro.sh

  sharedsub:deploy:
    desc: "Deploy the shared-subscription-env repro on REAL Azure SB (run servicebus:multi:secret first)"
    preconditions:
      - sh: kubectl get secret servicebus-azure-conn -n {{.NAMESPACE}} >/dev/null 2>&1
        msg: "Secret servicebus-azure-conn not found. Run: task servicebus:multi:secret CONN='Endpoint=sb://...'"
    cmds:
      - minikube -p {{.CLUSTER_NAME}} image build -t servicebus-consumer:local {{.APP_DIR}}
      - kubectl apply -f {{.OVERLAY}}/property-list-azure.yaml
      - kubectl apply -f {{.OVERLAY}}/consumer-topic-shared.yaml
      - kubectl apply -f {{.OVERLAY}}/split-config-shared.yaml
      - kubectl rollout restart deploy/servicebus-shared-consumer -n {{.NAMESPACE}}
      - kubectl rollout status deploy/servicebus-shared-consumer -n {{.NAMESPACE}} --timeout=180s

  sharedsub:run:local:
    desc: "Run the consumer locally under mirrord with filters on BOTH topics (Ctrl-C to stop)"
    interactive: true
    dir: apps/servicebus-consumer
    cmds:
      - go build -o /tmp/servicebus-consumer main.go
      - "{{.MIRRORD_BIN}} exec -f {{.OVERLAY}}/mirrord-shared-sub.json -- /tmp/servicebus-consumer"

  sharedsub:subs:
    desc: "List subscriptions + rules on both repro topics (data-plane management API, works without az)"
    silent: true
    preconditions:
      - sh: kubectl get secret servicebus-azure-conn -n {{.NAMESPACE}} >/dev/null 2>&1
        msg: "Secret servicebus-azure-conn not found. Run: task servicebus:multi:secret"
    vars:
      AZURE_CONN:
        sh: kubectl get secret servicebus-azure-conn -n {{.NAMESPACE}} -o jsonpath='{.data.connection_string}' 2>/dev/null | base64 -d
    cmds:
      # Detached pod + `kubectl logs`: `kubectl run -i` attaches after the
      # container starts and silently loses the first output lines.
      - |
        NAME=sb-subs-lister-$RANDOM
        kubectl run $NAME --restart=Never \
          --image=servicebus-consumer:local \
          --image-pull-policy=Never \
          --namespace={{.NAMESPACE}} \
          --env="LIST_MODE=true" \
          --env="SERVICEBUS_CONNECTION_STRING={{.AZURE_CONN}}" \
          --env="SERVICEBUS_TOPICS=test-topic,test-topic-2" \
          -- /app/consumer >/dev/null 2>&1
        for i in $(seq 1 30); do
          PHASE=$(kubectl get pod $NAME -n {{.NAMESPACE}} -o jsonpath='{.status.phase}' 2>/dev/null)
          [ "$PHASE" = "Succeeded" ] || [ "$PHASE" = "Failed" ] && break
          sleep 2
        done
        kubectl logs -n {{.NAMESPACE}} $NAME 2>/dev/null
        kubectl delete pod $NAME -n {{.NAMESPACE}} --wait=false >/dev/null 2>&1

  sharedsub:send:
    desc: "Publish to one repro topic (TOPIC=test-topic|test-topic-2 TENANT=test-user|other MESSAGE=...)"
    silent: true
    preconditions:
      - sh: kubectl get secret servicebus-azure-conn -n {{.NAMESPACE}} >/dev/null 2>&1
        msg: "Secret servicebus-azure-conn not found. Run: task servicebus:multi:secret"
    vars:
      TOPIC: '{{.TOPIC | default "test-topic"}}'
      TENANT: '{{.TENANT | default "test-user"}}'
      MESSAGE: '{{.MESSAGE | default "shared-sub repro message"}}'
      AZURE_CONN:
        sh: kubectl get secret servicebus-azure-conn -n {{.NAMESPACE}} -o jsonpath='{.data.connection_string}' 2>/dev/null | base64 -d
    cmds:
      - |
        BODY='{"order_id":"ORD-001","tenant":"{{.TENANT}}","type":"repro","message":"{{.MESSAGE}}"}'
        kubectl run sb-shared-sender-$RANDOM --rm -i --restart=Never \
          --image=servicebus-consumer:local \
          --image-pull-policy=Never \
          --namespace={{.NAMESPACE}} \
          --env="SEND_MODE=true" \
          --env="SERVICEBUS_CONNECTION_STRING={{.AZURE_CONN}}" \
          --env="SEND_TOPIC={{.TOPIC}}" \
          --env="MESSAGE_BODY=$BODY" \
          --env="MESSAGE_PROPERTIES=tenant={{.TENANT}}" \
          -- /app/consumer >/dev/null 2>&1
        case "{{.TENANT}}" in
          test*) echo "published to {{.TOPIC}} (tenant={{.TENANT}} -> should reach ONLY the local session)";;
          *)     echo "published to {{.TOPIC}} (tenant={{.TENANT}} -> should stay with the deployed consumer)";;
        esac

  sharedsub:logs:
    desc: Tail the deployed shared-consumer logs
    cmds:
      - kubectl logs -n {{.NAMESPACE}} -l app=servicebus-shared-consumer --tail=100 -f

  sharedsub:clean:
    desc: Remove the shared-subscription repro (consumer + split config; keeps the secret + Azure topics)
    cmds:
      - kubectl delete mirrordclustersplitsessions --all -A 2>/dev/null || true
      - kubectl delete -f {{.OVERLAY}}/split-config-shared.yaml --ignore-not-found=true
      - kubectl delete -f {{.OVERLAY}}/consumer-topic-shared.yaml --ignore-not-found=true

  _deploy:emulator:
    internal: true
    # On Apple Silicon the cluster node is arm64, so by default it pulls the
    # arm64 build of the Service Bus emulator. That build's management gateway
    # is broken: it cannot create or delete the temporary queues that queue
    # splitting needs and crashes with "q.qm not found". The amd64 build (the
    # same one CI runs) works fine here through Rosetta, and the only way to
    # force it on an arm64 node is to pin the image by its amd64 manifest
    # digest, resolved at deploy time.
    cmds:
      - |
        set -euo pipefail
        amd64_digest() {
          {{.CONTAINER_RUNTIME}} manifest inspect "$1" \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(m["digest"] for m in d["manifests"] if m["platform"]["architecture"]=="amd64" and m["platform"]["os"]=="linux"))'
        }
        echo "Resolving amd64 image digests..."
        EMU_DIGEST=$(amd64_digest mcr.microsoft.com/azure-messaging/servicebus-emulator:latest)
        SQL_DIGEST=$(amd64_digest mcr.microsoft.com/azure-sql-edge:latest)
        echo "  emulator amd64: ${EMU_DIGEST}"
        echo "  sql-edge amd64: ${SQL_DIGEST}"
        echo "Bouncing emulator pods..."
        kubectl delete pod -n {{.EMULATOR_NAMESPACE}} servicebus-emulator azure-sql-edge --wait=true --ignore-not-found=true
        echo "Applying {{.OVERLAY}}/servicebus-emulator.yaml pinned to the amd64 build..."
        sed -e "s#mcr.microsoft.com/azure-messaging/servicebus-emulator:latest#mcr.microsoft.com/azure-messaging/servicebus-emulator@${EMU_DIGEST}#" \
            -e "s#mcr.microsoft.com/azure-sql-edge:latest#mcr.microsoft.com/azure-sql-edge@${SQL_DIGEST}#" \
            "{{.OVERLAY}}/servicebus-emulator.yaml" | kubectl apply -f -
      - task: _wait:sql-edge
      - task: _wait:emulator

  _wait:sql-edge:
    internal: true
    cmds:
      - echo "Waiting for SQL Edge..."
      - kubectl wait --for=condition=ready pod azure-sql-edge -n {{.EMULATOR_NAMESPACE}} --timeout=180s

  _wait:emulator:
    internal: true
    cmds:
      - echo "Waiting for Service Bus emulator..."
      - kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=servicebus-emulator -n {{.EMULATOR_NAMESPACE}} --timeout=180s

  _wait:consumer:
    internal: true
    cmds:
      - echo "Waiting for Service Bus consumer..."
      - kubectl wait --for=condition=ready pod -l app=servicebus-consumer -n {{.NAMESPACE}} --timeout=120s
