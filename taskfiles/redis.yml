version: "3"

# Redis database branching.
#
#   task redis:deploy         deploy the source Redis + test app into the cluster
#   task redis:run:local      run the app locally under mirrord (creates a branch Redis)
#   task redis:query:source   run a redis-cli command against the source (cluster) Redis
#   task redis:query:branch   run a redis-cli command against the branch Redis
#
# The branch config lives in apps/redis-app/mirrord-local.json
# (feature.db_branches, type "redis" — branch is created when run:local starts).
# Branch CRDs use the generic BranchDatabase kind (kubectl get branchdatabases).
#
# Query examples (QUERY= takes any redis-cli command; no auth on the test server):
#   task redis:query:source QUERY="KEYS *"
#   task redis:query:source QUERY="SET greeting 'hello from source'"
#   task redis:query:branch QUERY="GET greeting"
#   or interactively: task redis:shell:source / task redis:shell:branch

vars:
  ROOT_DIR:
    sh: git rev-parse --show-toplevel
  CLUSTER_NAME: '{{.CLUSTER_NAME | default "bearkube"}}'
  CONTAINER_RUNTIME: '{{.CONTAINER_RUNTIME | default "docker"}}'
  MIRRORD_BIN: '{{.MIRRORD_BIN | default "mirrord"}}'
  # Shared with bullmq/redis-pubsub — same literal value in every module.
  REDIS_NAMESPACE: "redis-test"
  APP_DIR: '{{.ROOT_DIR}}/apps/redis-app'
  REDIS_DIR: '{{.ROOT_DIR}}/k8s/redis'
  REDIS_MIRRORD_CONFIG: '{{.REDIS_MIRRORD_CONFIG | default (print .ROOT_DIR "/apps/redis-app/mirrord-local.json")}}'

tasks:
  deploy:
    desc: Deploy the Redis test env (source Redis + test app)
    cmds:
      - "{{.CONTAINER_RUNTIME}} build -t redis-app:latest {{.APP_DIR}}"
      - minikube -p {{.CLUSTER_NAME}} image load redis-app:latest
      - kubectl apply -k {{.REDIS_DIR}}
      - task: _wait:source
      - task: _wait:app

  run:local:
    desc: Run the Redis app locally under mirrord (creates a branch Redis; Ctrl-C to stop)
    interactive: true
    dir: apps/redis-app
    preconditions:
      - sh: test -f {{.REDIS_MIRRORD_CONFIG}}
        msg: "mirrord config not found at {{.REDIS_MIRRORD_CONFIG}}"
    cmds:
      - go build -o /tmp/redis-app .
      - |
        # If operator:dev is running on this machine, label our resources with
        # its isolation marker so the LOCAL operator reconciles the branch —
        # unlabeled resources go to the deployed operator, which may not know
        # this branch type. An explicit OPERATOR_ISOLATION_MARKER always wins.
        if [ -z "${OPERATOR_ISOLATION_MARKER:-}" ] && pgrep -qf 'target/debug/operator-service'; then
          export OPERATOR_ISOLATION_MARKER=local-dev
          echo "operator:dev detected -> OPERATOR_ISOLATION_MARKER=local-dev"
        fi
        PORT=8080 {{.MIRRORD_BIN}} exec \
          -t deploy/redis-main \
          -n {{.REDIS_NAMESPACE}} \
          -f {{.REDIS_MIRRORD_CONFIG}} \
          -- /tmp/redis-app

  query:source:
    desc: 'Run a redis-cli command against the source Redis (QUERY="KEYS *")'
    silent: true
    vars:
      QUERY: '{{.QUERY | default "KEYS *"}}'
    cmds:
      - |
        POD=$(kubectl get pod -n {{.REDIS_NAMESPACE}} -l app=redis-main -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
        if [ -z "$POD" ]; then echo "Source Redis not found. Deploy first with 'task redis:deploy'."; exit 1; fi
        echo "=== source pod: $POD ==="
        kubectl exec -n {{.REDIS_NAMESPACE}} "$POD" -- redis-cli {{.QUERY}}

  query:branch:
    desc: 'Run a redis-cli command against a branch Redis (QUERY="..." [BRANCH=...])'
    silent: true
    vars:
      QUERY: '{{.QUERY | default "KEYS *"}}'
      BRANCH: '{{.BRANCH | default ""}}'
    cmds:
      - |
        if [ -n "{{.BRANCH}}" ]; then
          SELECTOR="db-owner-name={{.BRANCH}}"
        else
          SELECTOR="db-owner-name"
        fi
        POD=$(kubectl get pod -n {{.REDIS_NAMESPACE}} -l "$SELECTOR" --field-selector=status.phase=Running \
          --sort-by=.metadata.creationTimestamp -o jsonpath='{.items[-1:].metadata.name}' 2>/dev/null)
        if [ -z "$POD" ]; then
          echo "No running branch pod found. Deploy first, or start one with 'task redis:run:local'."
          echo "Existing branches:"
          kubectl get branchdatabases -n {{.REDIS_NAMESPACE}} 2>/dev/null || echo "  none"
          exit 1
        fi
        echo "=== branch pod: $POD ==="
        kubectl exec -n {{.REDIS_NAMESPACE}} "$POD" -- redis-cli {{.QUERY}}

  shell:source:
    desc: redis-cli shell into the source Redis
    interactive: true
    cmds:
      - |
        POD=$(kubectl get pod -n {{.REDIS_NAMESPACE}} -l app=redis-main -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
        if [ -z "$POD" ]; then echo "Source Redis not found. Deploy first with 'task redis:deploy'."; exit 1; fi
        kubectl exec -it -n {{.REDIS_NAMESPACE}} "$POD" -- redis-cli

  shell:branch:
    desc: redis-cli shell into the newest branch Redis ([BRANCH=...])
    interactive: true
    vars:
      BRANCH: '{{.BRANCH | default ""}}'
    cmds:
      - |
        if [ -n "{{.BRANCH}}" ]; then
          SELECTOR="db-owner-name={{.BRANCH}}"
        else
          SELECTOR="db-owner-name"
        fi
        POD=$(kubectl get pod -n {{.REDIS_NAMESPACE}} -l "$SELECTOR" --field-selector=status.phase=Running \
          --sort-by=.metadata.creationTimestamp -o jsonpath='{.items[-1:].metadata.name}' 2>/dev/null)
        if [ -z "$POD" ]; then echo "No running branch pod found."; exit 1; fi
        kubectl exec -it -n {{.REDIS_NAMESPACE}} "$POD" -- redis-cli

  # ---------------------------------------------------------------------------
  # TLS branch pods (custom TLS-enabled image + dbServerArgs/tls branch config).
  #
  # One-time setup:
  #   task redis:tls:build:redis-image   custom redis image with a baked-in cert
  #   task redis:tls:build:init-image    init-binaries image with --target-tls
  #                                      support (SLOW first run: release-builds
  #                                      the operator branching crate in docker)
  #   + the OPERATOR_REDIS_* / OPERATOR_IMAGE env in .mirrord/operator-dev.yaml
  #     (already set), then (re)start `task operator:dev`.
  #
  # The with/without demo:
  #   task redis:tls:disable + task redis:tls:run:local  -> plaintext branch (today's behavior)
  #   task redis:tls:enable  + task redis:tls:run:local  -> TLS-only branch, app connects over TLS
  #   task redis:tls:verify                              -> plain PING fails, TLS PING works
  # ---------------------------------------------------------------------------

  tls:build:redis-image:
    desc: Build the TLS-enabled custom Redis image (self-signed cert baked in) and load it into minikube
    cmds:
      - |
        STAGE={{.ROOT_DIR}}/.build/redis-tls-image
        mkdir -p "$STAGE"
        openssl req -x509 -newkey rsa:2048 -nodes -days 30 \
          -keyout "$STAGE/server.key" -out "$STAGE/server.crt" -subj "/CN=redis-branch-tls" 2>/dev/null
        printf 'FROM redis:7-alpine\nCOPY server.crt server.key /certs/\nRUN chmod 644 /certs/server.key /certs/server.crt\n' > "$STAGE/Dockerfile"
        {{.CONTAINER_RUNTIME}} build -t redis-tls-local:7-alpine "$STAGE"
      - minikube -p {{.CLUSTER_NAME}} image load redis-tls-local:7-alpine
      - echo "redis-tls-local:7-alpine loaded into minikube"

  tls:build:init-image:
    desc: "Build the branch init-binaries image from local operator source and load it into minikube (SLOW first run: ~20-40 min release build)"
    cmds:
      - |
        {{.CONTAINER_RUNTIME}} volume create mirrord-branch-cargo >/dev/null
        {{.CONTAINER_RUNTIME}} run --rm \
          -v {{.ROOT_DIR}}/..:/w \
          -v mirrord-branch-cargo:/usr/local/cargo/registry \
          -w /w/operator rust:1-bookworm \
          bash -c "apt-get update -qq && apt-get install -y -qq cmake perl >/dev/null && \
                   cargo build -p operator-db-branching --bins --release --target-dir /w/local-sandbox/.build/operator-target"
      - |
        STAGE={{.ROOT_DIR}}/.build/branch-init-image
        mkdir -p "$STAGE"
        cp {{.ROOT_DIR}}/.build/operator-target/release/*-branch-init "$STAGE/"
        printf 'FROM debian:bookworm-slim\nRUN apt-get update && apt-get install -y ca-certificates && rm -rf /var/lib/apt/lists/*\nCOPY ./*-branch-init /usr/local/bin/\n' > "$STAGE/Dockerfile"
        {{.CONTAINER_RUNTIME}} build -t mirrord-branch-init:local "$STAGE"
      - minikube -p {{.CLUSTER_NAME}} image load mirrord-branch-init:local
      - echo "mirrord-branch-init:local loaded into minikube (branch sidecars now have --target-tls support)"

  tls:enable:
    desc: Point new Redis branches at the TLS image (operator hot-reloads the config within ~60s)
    cmds:
      - cp {{.ROOT_DIR}}/configs/redis-branch-config.tls.yaml {{.ROOT_DIR}}/configs/redis-branch-config.yaml
      - echo "TLS branch config active. Branches created from now on are TLS-only (allow ~60s for the operator to re-read the file)."

  tls:disable:
    desc: Point new Redis branches back at the stock plaintext image
    cmds:
      - cp {{.ROOT_DIR}}/configs/redis-branch-config.plain.yaml {{.ROOT_DIR}}/configs/redis-branch-config.yaml
      - echo "Plaintext branch config active (allow ~60s for the operator to re-read the file)."

  tls:run:local:
    desc: Run the app locally with a CLUSTER branch Redis, connecting over TLS (pair with tls:enable)
    interactive: true
    dir: apps/redis-app
    cmds:
      - go build -o /tmp/redis-app .
      - |
        if [ -z "${OPERATOR_ISOLATION_MARKER:-}" ] && pgrep -qf 'target/debug/operator-service'; then
          export OPERATOR_ISOLATION_MARKER=local-dev
          echo "operator:dev detected -> OPERATOR_ISOLATION_MARKER=local-dev"
        fi
        PORT=8080 REDIS_TLS=1 {{.MIRRORD_BIN}} exec \
          -t deploy/redis-app \
          -n {{.REDIS_NAMESPACE}} \
          -f {{.ROOT_DIR}}/apps/redis-app/mirrord-cluster.json \
          -- /tmp/redis-app

  run:local:cluster:
    desc: Run the app locally with a CLUSTER branch Redis over plaintext (the "without" side of the TLS demo)
    interactive: true
    dir: apps/redis-app
    cmds:
      - go build -o /tmp/redis-app .
      - |
        if [ -z "${OPERATOR_ISOLATION_MARKER:-}" ] && pgrep -qf 'target/debug/operator-service'; then
          export OPERATOR_ISOLATION_MARKER=local-dev
          echo "operator:dev detected -> OPERATOR_ISOLATION_MARKER=local-dev"
        fi
        PORT=8080 {{.MIRRORD_BIN}} exec \
          -t deploy/redis-app \
          -n {{.REDIS_NAMESPACE}} \
          -f {{.ROOT_DIR}}/apps/redis-app/mirrord-cluster.json \
          -- /tmp/redis-app

  tls:verify:
    desc: Prove the newest branch pod is TLS-only (plain PING fails, TLS PING works)
    silent: true
    vars:
      BRANCH_PASS: "mirrord-redis-branch-pod-pass"
    cmds:
      - |
        POD=$(kubectl get pod -n {{.REDIS_NAMESPACE}} -l db-owner-name --field-selector=status.phase=Running \
          --sort-by=.metadata.creationTimestamp -o jsonpath='{.items[-1:].metadata.name}' 2>/dev/null)
        if [ -z "$POD" ]; then echo "No running branch pod. Start one with 'task redis:tls:run:local'."; exit 1; fi
        echo "=== branch pod: $POD ==="
        if kubectl exec -n {{.REDIS_NAMESPACE}} "$POD" -- \
             redis-cli --no-auth-warning -a {{.BRANCH_PASS}} PING 2>/dev/null | grep -q PONG; then
          echo "FAIL: plaintext PING succeeded - the branch is NOT TLS-only"; exit 1
        else
          echo "OK: plaintext PING is rejected"
        fi
        if kubectl exec -n {{.REDIS_NAMESPACE}} "$POD" -- \
             redis-cli --no-auth-warning --tls --insecure -a {{.BRANCH_PASS}} PING 2>/dev/null | grep -q PONG; then
          echo "OK: TLS PING answers PONG"
        else
          echo "FAIL: TLS PING did not answer"; exit 1
        fi

  tls:query:branch:
    desc: 'Run a redis-cli command against a TLS branch Redis (QUERY="KEYS *")'
    silent: true
    vars:
      QUERY: '{{.QUERY | default "KEYS *"}}'
      BRANCH_PASS: "mirrord-redis-branch-pod-pass"
    cmds:
      - |
        POD=$(kubectl get pod -n {{.REDIS_NAMESPACE}} -l db-owner-name --field-selector=status.phase=Running \
          --sort-by=.metadata.creationTimestamp -o jsonpath='{.items[-1:].metadata.name}' 2>/dev/null)
        if [ -z "$POD" ]; then echo "No running branch pod."; exit 1; fi
        echo "=== branch pod: $POD (TLS) ==="
        kubectl exec -n {{.REDIS_NAMESPACE}} "$POD" -- \
          redis-cli --no-auth-warning --tls --insecure -a {{.BRANCH_PASS}} {{.QUERY}}

  branches:
    desc: List BranchDatabase CRDs and branch pods
    cmds:
      - kubectl get branchdatabases -n {{.REDIS_NAMESPACE}} -o custom-columns=NAME:.metadata.name,PHASE:.status.phase,COPY_MODE:.spec.copy.mode,AGE:.metadata.creationTimestamp 2>/dev/null || echo "No branches"
      - kubectl get pods -n {{.REDIS_NAMESPACE}} -l db-owner-name 2>/dev/null || true

  logs:
    desc: Tail the source Redis logs
    cmds:
      - kubectl logs -n {{.REDIS_NAMESPACE}} -l app=redis-main --tail=100 -f

  logs:branch:
    desc: Tail the newest branch pod logs
    cmds:
      - |
        POD=$(kubectl get pod -n {{.REDIS_NAMESPACE}} -l db-owner-name \
          --sort-by=.metadata.creationTimestamp -o jsonpath='{.items[-1:].metadata.name}' 2>/dev/null)
        if [ -z "$POD" ]; then echo "No branch pod found."; exit 1; fi
        kubectl logs -n {{.REDIS_NAMESPACE}} "$POD" --tail=100 -f

  status:
    desc: Show source, app, branches and branch pods
    silent: true
    cmds:
      - echo "=== source ==="
      - kubectl get pods -n {{.REDIS_NAMESPACE}} -l app=redis-main -o wide 2>/dev/null || echo "not deployed"
      - echo ""
      - echo "=== app ==="
      - kubectl get pods -n {{.REDIS_NAMESPACE}} -l app=redis-app 2>/dev/null || echo "not deployed"
      - echo ""
      - echo "=== branch CRDs ==="
      - kubectl get branchdatabases -n {{.REDIS_NAMESPACE}} -o custom-columns=NAME:.metadata.name,PHASE:.status.phase,COPY_MODE:.spec.copy.mode 2>/dev/null || echo "none"
      - echo ""
      - echo "=== branch pods ==="
      - kubectl get pods -n {{.REDIS_NAMESPACE}} -l db-owner-name 2>/dev/null || echo "none"

  clean:
    desc: Remove the Redis test env (deletes the redis-test namespace, shared with bullmq/redis-pubsub)
    cmds:
      - kubectl delete -k {{.REDIS_DIR}} --ignore-not-found=true 2>/dev/null || true
      - kubectl delete branchdatabases --all -n {{.REDIS_NAMESPACE}} 2>/dev/null || true
      - "{{.CONTAINER_RUNTIME}} rm -f mirrord-redis-6379 2>/dev/null || true"

  _wait:source:
    internal: true
    cmds:
      - echo "Waiting for source Redis..."
      - kubectl wait --for=condition=ready pod -l app=redis-main -n {{.REDIS_NAMESPACE}} --timeout=120s || true

  _wait:app:
    internal: true
    cmds:
      - echo "Waiting for Redis app..."
      - kubectl wait --for=condition=ready pod -l app=redis-app -n {{.REDIS_NAMESPACE}} --timeout=120s || true
