version: "3"

# ─────────────────────────────────────────────────────────────────────────────
# local-sandbox — core workflows
#
# Day-to-day flows live here and in taskfiles/*.yml. Every module follows the
# same verb set:
#
#   task <mod>:deploy           deploy the test env into the cluster
#   task <mod>:run:local        run the app locally under mirrord (starts the split)
#   task <mod>:send:match       send a message matching the filter -> local session
#   task <mod>:send:nomatch     send a non-matching message -> stays in cluster
#   task <mod>:logs / status / clean
#
# Operator (no docker builds):
#
#   task operator:use           deploy a released operator (VERSION=latest|x.y.z|pick)
#   task operator:crds          apply CRDs from the local ../operator chart
#   task operator:dev           run the local operator under mirrord (steal)
#
# Everything that existed before is unchanged under the `legacy:` namespace
# (Taskfile.legacy.yml + tasks/*.yml), e.g. `task legacy:up`,
# `task legacy:postgres:deploy`, `task legacy:operator:update`.
# ─────────────────────────────────────────────────────────────────────────────

shell:
  - bash
  - -c

dotenv: [".env"]

vars:
  ROOT_DIR:
    sh: pwd
  CLUSTER_NAME: '{{.CLUSTER_NAME | default "bearkube"}}'
  MIRRORD_BIN: '{{.MIRRORD_BIN | default "mirrord"}}'

includes:
  lint:
    taskfile: ./taskfiles/lint.yml
  cluster:
    taskfile: ./taskfiles/cluster.yml
  operator:
    taskfile: ./taskfiles/operator.yml
  mirrord:
    taskfile: ./taskfiles/mirrord.yml
  ipv6:
    taskfile: ./taskfiles/ipv6.yml
  sqs:
    taskfile: ./taskfiles/sqs.yml
  kafka:
    taskfile: ./taskfiles/kafka.yml
  kafkajs:
    taskfile: ./taskfiles/kafkajs.yml
  rmq:
    taskfile: ./taskfiles/rmq.yml
  pubsub:
    taskfile: ./taskfiles/pubsub.yml
  servicebus:
    taskfile: ./taskfiles/servicebus.yml
  redis-pubsub:
    taskfile: ./taskfiles/redis-pubsub.yml
  temporal:
    taskfile: ./taskfiles/temporal.yml
  bullmq:
    taskfile: ./taskfiles/bullmq.yml
  postgres:
    taskfile: ./taskfiles/postgres.yml
  migrations:
    taskfile: ./taskfiles/migrations.yml
  mysql:
    taskfile: ./taskfiles/mysql.yml
  mongodb:
    taskfile: ./taskfiles/mongodb.yml
  mssql:
    taskfile: ./taskfiles/mssql.yml
  spanner:
    taskfile: ./taskfiles/spanner.yml
  redis:
    taskfile: ./taskfiles/redis.yml
  generic:
    taskfile: ./taskfiles/generic.yml
  cockroachdb-tls:
    taskfile: ./taskfiles/cockroachdb-tls.yml
  multicluster:
    taskfile: ./taskfiles/multicluster.yml
  preview:
    taskfile: ./taskfiles/preview.yml
  kafka-demo:
    taskfile: ./taskfiles/kafka-demo.yml
  copytarget:
    taskfile: ./taskfiles/copytarget.yml
  lease:
    taskfile: ./taskfiles/lease.yml
  op:
    taskfile: ./taskfiles/op.yml
  linkerd-repro:
    taskfile: ./taskfiles/linkerd-repro.yml

tasks:
  default:
    desc: Show the core workflow
    silent: true
    cmds:
      - |
        cat <<'EOF'
        local-sandbox — core workflow

          1. task cluster:create            create/start the minikube cluster
          2. task operator:use              deploy a released operator (VERSION=latest|x.y.z|pick)
          3. task operator:crds             apply CRDs from your local ../operator chart
          4. task operator:dev              run your local operator under mirrord (no docker build)

        queue splitting (same verbs for sqs, kafka, rmq, pubsub, servicebus,
        redis-pubsub, temporal, bullmq):

          task sqs:deploy                   deploy the test env
          task sqs:run:local                run the consumer locally under mirrord
          task sqs:send:match               message matches filter -> your local session
          task sqs:send:nomatch             message doesn't match -> cluster consumer
          task sqs:send:match MESSAGE="hi"  custom message body
          task sqs:logs / status / clean

        database branching (same verbs for postgres, mysql, mongodb, mssql,
        spanner, redis, generic):

          task postgres:deploy              deploy the source DB
          task postgres:run:local           run app under mirrord -> creates a branch DB
          task postgres:query:source QUERY="SELECT * FROM users;"
          task postgres:query:branch QUERY="SELECT count(*) FROM users;"
          task postgres:shell:branch        interactive shell into the branch
          task postgres:branches / logs / status / clean

        postgres roles & credentials (dbPod.roles empty/full):

          task postgres:roles:deploy        source DB + seeded roles + params target
          task postgres:roles:full          switch local operator to full role fidelity
          task postgres:run:local:roles     app connects as its real role (watch "Session identity")
          task postgres:roles:login         log into the branch as app_user (real password)
          task postgres:roles:probe         grant/denial/SET ROLE probes on the branch

        multicluster (2 local clusters + real Azure Service Bus topics):

          task multicluster:up              clusters + released operators
          task multicluster:operator:primary     your operator vs primary (or :remote-1)
          task multicluster:servicebus:deploy / run:local / send:match / send:nomatch

        mirrord agent:

          task mirrord:agent:build          build agent image from ../mirrord (AGENT_IMAGE=test)
          task mirrord:agent:load           (re)load agent image into minikube

        misc:

          task check                        health check (tools, cluster, operator, agent)
          task --list                       all core tasks
          task legacy                       list the entire old task set (unchanged)
          task legacy:<anything>            run any old task (vars after --, e.g.
                                            task legacy:operator:load -- TAG=my-branch)
        EOF

  legacy:
    desc: List every legacy task (the entire pre-refactor task set)
    silent: true
    cmds:
      - task -t {{.ROOT_DIR}}/Taskfile.legacy.yml --list

  # The legacy world runs as its own task root (not a nested include) because
  # go-task merges nested includes' global vars across namespaces, which
  # breaks legacy modules that reuse names like APP_DIR/OVERLAY_DIR with
  # different values. Running it standalone preserves the exact old behavior.
  # Pass vars after `--`, e.g.: task legacy:operator:load -- TAG=my-branch
  legacy:*:
    desc: Run any legacy task (e.g. task legacy:up, task legacy:postgres:deploy)
    silent: true
    interactive: true
    vars:
      LEGACY_TASK: '{{index .MATCH 0}}'
    cmds:
      - task -t {{.ROOT_DIR}}/Taskfile.legacy.yml {{.LEGACY_TASK}} {{.CLI_ARGS}}

  check:
    desc: "Health check: tools, cluster, operator, agent image"
    silent: true
    cmds:
      - |
        ok()  { printf "  \033[32m✓\033[0m %s\n" "$1"; }
        bad() { printf "  \033[31m✗\033[0m %s\n" "$1"; }

        echo "tools:"
        for t in kubectl helm minikube docker go fzf; do
          if command -v "$t" >/dev/null 2>&1; then ok "$t"; else bad "$t (missing)"; fi
        done
        if command -v {{.MIRRORD_BIN}} >/dev/null 2>&1 || [ -x "{{.MIRRORD_BIN}}" ]; then
          ok "mirrord ({{.MIRRORD_BIN}})"
        else
          bad "mirrord ({{.MIRRORD_BIN}} not found)"
        fi

        echo "cluster ({{.CLUSTER_NAME}}):"
        if minikube -p {{.CLUSTER_NAME}} status 2>/dev/null | grep -q 'host: Running'; then
          ok "running"
        else
          bad "not running — task cluster:create"
        fi

        echo "operator:"
        if kubectl get deploy mirrord-operator -n mirrord >/dev/null 2>&1; then
          IMG=$(kubectl get deploy mirrord-operator -n mirrord -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null)
          READY=$(kubectl get deploy mirrord-operator -n mirrord -o jsonpath='{.status.readyReplicas}' 2>/dev/null)
          if [ "${READY:-0}" -ge 1 ]; then ok "running ($IMG)"; else bad "installed but not ready ($IMG)"; fi
        else
          bad "not installed — task operator:use"
        fi

        echo "agent image:"
        if minikube -p {{.CLUSTER_NAME}} image ls 2>/dev/null | grep -q 'library/test:'; then
          ok "'test' loaded in minikube"
        else
          bad "'test' not in minikube — task mirrord:agent:load (or mirrord:agent:build)"
        fi
