# Full role fidelity: real role attributes and memberships, owner/ACL-preserving
# copy, and the session leaves the app's own user/password env vars untouched.
dbPod:
  roles: "full"
  # Admin pod metadata, carried by the branch database pod and its migration/copy Job pods
  # (task op:test:pod-annotations). The Karpenter annotation is the customer case; harmless
  # on minikube.
  labels:
    sandbox.mirrord.metalbear.co/admin-pod-metadata: "db-branch"
  annotations:
    karpenter.sh/do-not-disrupt: "true"

# Profile used by scripts/test-pg-configmap-param.sh (case 3): the target's config file
# is set once here, so the session's params carry only their selectors.
profiles:
  app-config:
    dbPod:
      sourceConfigMap:
        volume: app-config
        key: config.yml
