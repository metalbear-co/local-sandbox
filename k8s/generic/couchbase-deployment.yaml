# The "source" Couchbase the app normally talks to. Couchbase has no first-boot env
# bootstrap - the container wraps the entrypoint in a script that starts the server, then
# runs `couchbase-cli cluster-init` + `bucket-create` with the password from the
# couchbase-creds Secret. The generic branch does the exact same dance via its `command`
# field, using $MIRRORD_PARAM_PASSWORD.
apiVersion: v1
kind: Secret
metadata:
  name: couchbase-creds
  namespace: generic-test
type: Opaque
stringData:
  password: "branch-me-cb-2024"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: couchbase-main
  namespace: generic-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: couchbase-main
  template:
    metadata:
      labels:
        app: couchbase-main
    spec:
      containers:
        - name: couchbase
          image: couchbase:community-7.6.2
          command:
            - /bin/bash
            - -c
            - >-
              /entrypoint.sh couchbase-server &
              until curl -s http://localhost:8091/pools > /dev/null; do sleep 2; done;
              couchbase-cli cluster-init -c localhost
              --cluster-username Administrator --cluster-password "$COUCHBASE_PASSWORD"
              --services data,index,query --cluster-ramsize 512 --cluster-index-ramsize 256;
              couchbase-cli bucket-create -c localhost -u Administrator -p "$COUCHBASE_PASSWORD"
              --bucket sandbox --bucket-type couchbase --bucket-ramsize 256;
              wait
          env:
            - name: COUCHBASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: couchbase-creds
                  key: password
          ports:
            - containerPort: 8091
            - containerPort: 8093
            - containerPort: 11210
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - curl -s -u "Administrator:$COUCHBASE_PASSWORD" http://localhost:8091/pools/default/buckets/sandbox > /dev/null
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 50
          resources:
            requests:
              memory: "1Gi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: couchbase-main
  namespace: generic-test
spec:
  selector:
    app: couchbase-main
  ports:
    - name: mgmt
      port: 8091
      targetPort: 8091
    - name: query
      port: 8093
      targetPort: 8093
    - name: kv
      port: 11210
      targetPort: 11210
