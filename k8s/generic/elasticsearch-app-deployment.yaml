apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch-app
  namespace: generic-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch-app
  template:
    metadata:
      labels:
        app: elasticsearch-app
    spec:
      containers:
        - name: elasticsearch-app
          image: elasticsearch-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: ELASTICSEARCH_URL
              value: "http://elasticsearch-main:9200"
            # Same value, NOT declared in the mirrord config, so it arrives untouched.
            - name: ELASTICSEARCH_SOURCE_URL
              value: "http://elasticsearch-main:9200"
            - name: ELASTICSEARCH_USER
              value: "elastic"
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-creds
                  key: password
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "50m"
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-app
  namespace: generic-test
spec:
  selector:
    app: elasticsearch-app
  ports:
    - port: 8080
      targetPort: 8080
