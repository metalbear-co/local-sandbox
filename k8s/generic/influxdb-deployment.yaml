# The "source" InfluxDB the app normally talks to, bootstrapped with the token/org/bucket
# from the influx-creds Secret - the same values the generic branch will be bootstrapped
# with via $(MIRRORD_PARAM_TOKEN/ORG/BUCKET), so the app's untouched credentials stay valid
# against the branch.
apiVersion: v1
kind: Secret
metadata:
  name: influx-creds
  namespace: generic-test
type: Opaque
stringData:
  token: "sandbox-super-secret-token"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: influxdb-main
  namespace: generic-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: influxdb-main
  template:
    metadata:
      labels:
        app: influxdb-main
    spec:
      containers:
        - name: influxdb
          image: influxdb:2.7-alpine
          env:
            - name: DOCKER_INFLUXDB_INIT_MODE
              value: "setup"
            - name: DOCKER_INFLUXDB_INIT_USERNAME
              value: "admin"
            - name: DOCKER_INFLUXDB_INIT_PASSWORD
              value: "sandbox-admin-pw"
            - name: DOCKER_INFLUXDB_INIT_ORG
              value: "metalbear"
            - name: DOCKER_INFLUXDB_INIT_BUCKET
              value: "metrics"
            - name: DOCKER_INFLUXDB_INIT_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: influx-creds
                  key: token
          ports:
            - containerPort: 8086
          readinessProbe:
            httpGet:
              path: /health
              port: 8086
            initialDelaySeconds: 3
            periodSeconds: 2
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: influxdb-main
  namespace: generic-test
spec:
  selector:
    app: influxdb-main
  ports:
    - port: 8086
      targetPort: 8086
