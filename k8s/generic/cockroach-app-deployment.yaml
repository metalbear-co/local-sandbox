apiVersion: apps/v1
kind: Deployment
metadata:
  name: cockroach-app
  namespace: generic-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cockroach-app
  template:
    metadata:
      labels:
        app: cockroach-app
    spec:
      containers:
        - name: cockroach-app
          image: cockroach-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            # Postgres-style URL - mirrord rewrites the host (after '@') and port fragments
            # via value_pattern; scheme, user, database, and query params survive.
            - name: COCKROACH_URL
              value: "postgresql://root@cockroach-main:26257/defaultdb?sslmode=disable"
            # Same value, NOT declared in the mirrord config, so it arrives untouched.
            - name: COCKROACH_SOURCE_URL
              value: "postgresql://root@cockroach-main:26257/defaultdb?sslmode=disable"
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "50m"
---
apiVersion: v1
kind: Service
metadata:
  name: cockroach-app
  namespace: generic-test
spec:
  selector:
    app: cockroach-app
  ports:
    - port: 8080
      targetPort: 8080
