# The "source" Cassandra the app normally talks to - single node, default (no-auth) config,
# JVM heap tuned via the image's MAX_HEAP_SIZE env. No credentials to bootstrap, so the
# generic branch config only declares host/port.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cassandra-main
  namespace: generic-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cassandra-main
  template:
    metadata:
      labels:
        app: cassandra-main
    spec:
      containers:
        - name: cassandra
          image: cassandra:5
          env:
            - name: MAX_HEAP_SIZE
              value: "512M"
            - name: HEAP_NEWSIZE
              value: "128M"
          ports:
            - containerPort: 9042
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - cqlsh -e 'SELECT now() FROM system.local' > /dev/null 2>&1
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 40
          resources:
            requests:
              memory: "1Gi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: cassandra-main
  namespace: generic-test
spec:
  selector:
    app: cassandra-main
  ports:
    - port: 9042
      targetPort: 9042
