apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch-app
  namespace: generic-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensearch-app
  template:
    metadata:
      labels:
        app: opensearch-app
    spec:
      containers:
        - name: opensearch-app
          image: opensearch-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            # https URL - mirrord rewrites only the host/port fragments via value_pattern.
            - name: OPENSEARCH_URL
              value: "https://opensearch-main:9200"
            # Same value, NOT declared in the mirrord config, so it arrives untouched.
            - name: OPENSEARCH_SOURCE_URL
              value: "https://opensearch-main:9200"
            - name: OPENSEARCH_USER
              value: "admin"
            # Secret-backed - the operator resolves this off the pod spec and injects it
            # into the branch container as MIRRORD_PARAM_PASSWORD (secretKeyRef, never read).
            - name: OPENSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensearch-creds
                  key: password
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "50m"
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch-app
  namespace: generic-test
spec:
  selector:
    app: opensearch-app
  ports:
    - port: 8080
      targetPort: 8080
