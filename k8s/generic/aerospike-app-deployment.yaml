apiVersion: apps/v1
kind: Deployment
metadata:
  name: aerospike-app
  namespace: generic-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aerospike-app
  template:
    metadata:
      labels:
        app: aerospike-app
    spec:
      containers:
        - name: aerospike-app
          image: aerospike-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: AEROSPIKE_ADDR
              value: "aerospike-main:3000"
            # Same value, NOT declared in the mirrord config, so it arrives untouched.
            - name: AEROSPIKE_SOURCE_ADDR
              value: "aerospike-main:3000"
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "50m"
---
apiVersion: v1
kind: Service
metadata:
  name: aerospike-app
  namespace: generic-test
spec:
  selector:
    app: aerospike-app
  ports:
    - port: 8080
      targetPort: 8080
