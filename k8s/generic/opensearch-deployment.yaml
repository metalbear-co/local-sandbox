# The "source" OpenSearch the app normally talks to. Security stays enabled: the admin
# password comes from the opensearch-creds Secret - the same Secret the generic branch is
# bootstrapped with via OPENSEARCH_INITIAL_ADMIN_PASSWORD=$(MIRRORD_PARAM_PASSWORD), so the
# app's untouched credentials stay valid against the branch.
apiVersion: v1
kind: Secret
metadata:
  name: opensearch-creds
  namespace: generic-test
type: Opaque
stringData:
  # Must satisfy OpenSearch's initial-admin-password strength rules.
  password: "Branch-Me-2024!"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch-main
  namespace: generic-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensearch-main
  template:
    metadata:
      labels:
        app: opensearch-main
    spec:
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.19.1
          env:
            # The image's entrypoint turns dotted env names into opensearch.yml settings.
            - name: discovery.type
              value: "single-node"
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
            - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensearch-creds
                  key: password
          ports:
            - containerPort: 9200
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - curl -sk -u "admin:$OPENSEARCH_INITIAL_ADMIN_PASSWORD" https://localhost:9200 > /dev/null
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 40
          resources:
            requests:
              memory: "1Gi"
              cpu: "250m"
            limits:
              memory: "1536Mi"
              cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch-main
  namespace: generic-test
spec:
  selector:
    app: opensearch-main
  ports:
    - port: 9200
      targetPort: 9200
