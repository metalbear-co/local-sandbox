apiVersion: apps/v1
kind: Deployment
metadata:
  name: cassandra-app
  namespace: generic-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cassandra-app
  template:
    metadata:
      labels:
        app: cassandra-app
    spec:
      containers:
        - name: cassandra-app
          image: cassandra-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            # Composite host:port var - mirrord rewrites only the matched fragments.
            - name: CASSANDRA_ADDR
              value: "cassandra-main:9042"
            # Same value, NOT declared in the mirrord config, so it arrives untouched.
            - name: CASSANDRA_SOURCE_ADDR
              value: "cassandra-main:9042"
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "50m"
---
apiVersion: v1
kind: Service
metadata:
  name: cassandra-app
  namespace: generic-test
spec:
  selector:
    app: cassandra-app
  ports:
    - port: 8080
      targetPort: 8080
