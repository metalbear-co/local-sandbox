# Target pod for the roles/credentials scenarios: params-style DB env vars carrying the
# app user's own credentials (seeded by `task postgres:roles:seed`), so full roles mode
# can leave user/password untouched and the local app connects as its real role.
apiVersion: v1
kind: Pod
metadata:
  name: pg-server-roles
  namespace: test-mirrord
  labels:
    test-scenario: roles
spec:
  containers:
  - name: app
    image: busybox
    command: ["sh", "-c", "echo 'Postgres roles scenario running' && sleep 3600"]
    env:
    - name: DB_HOST
      value: "postgres-test"
    - name: DB_PORT
      value: "5432"
    - name: DB_USER
      value: "app_user"
    - name: DB_PASSWORD
      value: "app_pass"
    - name: DB_NAME
      value: "source_db"
