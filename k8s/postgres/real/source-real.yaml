# "Real" Postgres source: the Pagila sample database (DVD rental, ~20 FK-linked
# tables incl. composite keys and partitioned payments) downloaded at pod start.
# Used for exercising the `subset` branch copy mode against realistic relationships.
apiVersion: v1
kind: Pod
metadata:
  name: postgres-real
  labels:
    app: postgres-real
spec:
  initContainers:
    - name: fetch-pagila
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          set -e
          wget -q -O /initdb/01-schema.sql https://raw.githubusercontent.com/devrimgunduz/pagila/master/pagila-schema.sql
          wget -q -O /initdb/02-data.sql   https://raw.githubusercontent.com/devrimgunduz/pagila/master/pagila-data.sql
          echo "pagila downloaded: $(wc -c < /initdb/01-schema.sql) + $(wc -c < /initdb/02-data.sql) bytes"
      volumeMounts:
        - name: initdb
          mountPath: /initdb
  containers:
    - name: postgres
      image: postgres:17
      env:
        - name: POSTGRES_PASSWORD
          value: postgres
        - name: POSTGRES_DB
          value: pagila
      ports:
        - containerPort: 5432
      volumeMounts:
        - name: initdb
          mountPath: /docker-entrypoint-initdb.d
      readinessProbe:
        exec:
          command: ["pg_isready", "-U", "postgres", "-d", "pagila"]
        initialDelaySeconds: 10
        periodSeconds: 5
        failureThreshold: 30
  volumes:
    - name: initdb
      emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-real
spec:
  selector:
    app: postgres-real
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
