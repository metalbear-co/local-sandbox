# "Real" MongoDB source: the Atlas sample_analytics dataset (customers referencing
# accounts through an ARRAY field, transactions referencing accounts) restored at
# pod start. MongoDB has no declared foreign keys, so the matching subset config
# (mirrord-real.json) declares the relations explicitly.
apiVersion: v1
kind: Pod
metadata:
  name: mongodb-real
  labels:
    app: mongodb-real
spec:
  initContainers:
    - name: fetch-sample-analytics
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          set -e
          BASE=https://raw.githubusercontent.com/mcampo2/mongodb-sample-databases/master/dump/sample_analytics
          mkdir -p /dump/sample_analytics
          for f in accounts.bson accounts.metadata.json customers.bson customers.metadata.json transactions.bson transactions.metadata.json; do
            wget -q -O /dump/sample_analytics/$f $BASE/$f
          done
          echo "sample_analytics downloaded"
      volumeMounts:
        - name: dump
          mountPath: /dump
  containers:
    - name: mongodb
      image: mongo:7.0
      env:
        - name: MONGO_INITDB_ROOT_USERNAME
          value: admin
        - name: MONGO_INITDB_ROOT_PASSWORD
          value: password
      ports:
        - containerPort: 27017
      volumeMounts:
        - name: dump
          mountPath: /dump
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d
      readinessProbe:
        exec:
          command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
        initialDelaySeconds: 10
        periodSeconds: 5
        failureThreshold: 30
  volumes:
    - name: dump
      emptyDir: {}
    - name: init-script
      configMap:
        name: mongodb-real-init
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-real-init
data:
  # Runs during the image's init phase (auth not yet enforced on localhost).
  restore.sh: |
    #!/bin/bash
    set -e
    echo "Restoring sample_analytics..."
    mongorestore --nsInclude 'sample_analytics.*' /dump
    echo "sample_analytics restored"
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-real
spec:
  selector:
    app: mongodb-real
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
