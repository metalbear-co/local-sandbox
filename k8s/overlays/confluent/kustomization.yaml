apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: test-mirrord

# Carries its own copy of the broker manifest (same names as the kafka
# overlay's), so deploying either overlay converges on one shared broker.
resources:
  - ../../base
  - kafka.yaml
  - app.yaml
  - property-list.yaml
  - split-config.yaml
