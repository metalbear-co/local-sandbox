apiVersion: apps/v1
kind: Deployment
metadata:
  name: servicebus-consumer
  namespace: test-mirrord
spec:
  replicas: 1
  selector:
    matchLabels:
      app: servicebus-consumer
  template:
    metadata:
      labels:
        app: servicebus-consumer
    spec:
      # No emulator init container here: the app talks to a real Azure Service
      # Bus namespace over the internet, so there is no in-cluster service to
      # wait for.
      containers:
      - name: consumer
        image: servicebus-consumer:local
        imagePullPolicy: Never
        env:
        - name: SERVICEBUS_QUEUE_NAME
          value: "test-queue"
        - name: SERVICEBUS_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: servicebus-azure-conn
              key: connection_string
