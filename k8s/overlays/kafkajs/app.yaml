apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafkajs-consumer
  namespace: test-mirrord
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafkajs-consumer
  template:
    metadata:
      labels:
        app: kafkajs-consumer
    spec:
      containers:
      - name: consumer
        image: kafkajs-consumer:local
        imagePullPolicy: Never
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka-cluster.test-mirrord.svc.cluster.local:9092"
        - name: KAFKA_TOPIC_NAME
          value: "test-topic"
        - name: KAFKA_GROUP_ID
          value: "kafkajs-consumer-group"
        # Not read by the app. split-config-ignored-env.yaml points the split
        # at it to reproduce a workload that keeps its original group after the
        # operator patched the wrong variable.
        - name: KAFKA_GROUP_ID_UNUSED
          value: "kafkajs-consumer-group"
