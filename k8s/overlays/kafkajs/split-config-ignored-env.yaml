# Variant of split-config.yaml whose groupId source is an env var the app does
# not read (KAFKA_GROUP_ID_UNUSED). A temporary-group split patches that var,
# the pods restart still on kafkajs-consumer-group, and the forwarder can never
# join: this is what a customer whose app builds its group id elsewhere looks
# like. Applied by `task kafkajs:ignored-env:on`.
apiVersion: queues.mirrord.metalbear.co/v1
kind: MirrordSplitConfig
metadata:
  name: kafkajs-consumer
  namespace: test-mirrord
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kafkajs-consumer
  queues:
    - id: test-topic
      kind: kafka
      clientConfig: kafkajs-kafka-connection
      appConfig:
        topic:
          - env: KAFKA_TOPIC_NAME
        groupId:
          - env: KAFKA_GROUP_ID_UNUSED
