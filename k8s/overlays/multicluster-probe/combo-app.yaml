# The ONE demo app: serves HTTP, consumes SQS (QUEUE_NAME), talks to PG (DATABASE_URL).
# Placeholders __IMG__ / __CLUSTER__ / __AWS_EP__ are substituted per cluster by the task.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: combo-app
  labels: { app: combo-app }
spec:
  replicas: 1
  selector: { matchLabels: { app: combo-app } }
  template:
    metadata: { labels: { app: combo-app } }
    spec:
      containers:
        - name: app
          image: __IMG__
          imagePullPolicy: Never
          ports: [ { containerPort: 80 } ]
          env:
            - { name: CLUSTER_ID, value: "__CLUSTER__" }
            - { name: DATABASE_URL, value: "postgres://postgres:sourcepass@pg-source.test-multicluster.svc:5432/source_db" }
            - { name: QUEUE_NAME, value: "test-queue" }
            - { name: AWS_ACCESS_KEY_ID, value: "test" }
            - { name: AWS_SECRET_ACCESS_KEY, value: "test" }
            - { name: AWS_REGION, value: "us-east-1" }
            - { name: AWS_ENDPOINT_URL, value: "__AWS_EP__" }
---
apiVersion: v1
kind: Service
metadata:
  name: combo-app
spec:
  selector: { app: combo-app }
  ports: [ { port: 80, targetPort: 80 } ]
