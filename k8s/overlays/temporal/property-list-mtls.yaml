# mTLS variant of the Temporal connection settings. Same resource name as
# property-list.yaml so the split config keeps pointing at `temporal-connection`;
# applying this file swaps the operator's upstream from the plaintext frontend
# to the client-cert-requiring nginx front (temporal-mtls-front.yaml). Applying
# property-list.yaml swaps it back.
#
# The referenced secret is created by `task temporal:mtls:deploy` from the
# certs generated by scripts/temporal-mtls-certs.sh.
apiVersion: mirrord.metalbear.co/v1
kind: MirrordPropertyList
metadata:
  name: temporal-connection
  namespace: test-mirrord
spec:
  properties:
  - name: address
    value: temporal-mtls.temporal.svc.cluster.local:7233
  - name: namespace
    value: temporal
  - name: tlsCaCert
    valueFrom:
      secretKeyRef:
        name: temporal-mtls-client
        key: ca.crt
  - name: tlsClientCert
    valueFrom:
      secretKeyRef:
        name: temporal-mtls-client
        key: tls.crt
  - name: tlsClientKey
    valueFrom:
      secretKeyRef:
        name: temporal-mtls-client
        key: tls.key
